<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>GOTCHA App</title>

  <!-- Fix for missing favicon 404 error -->
  <link rel="icon" href="data:," />

  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- React & ReactDOM -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>

  <!-- Babel for JSX -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>

  <!-- Supabase -->
  <script src="https://unpkg.com/@supabase/supabase-js@2"></script>

  <!-- Google Fonts: Inter -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">

  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: { sans: ['Inter', 'sans-serif'] },
          colors: {
            night: {
              950: '#020617',
              900: '#0f172a',
              800: '#1e293b'
            }
          }
        }
      }
    }
  </script>

  <style>
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

    body {
      margin: 0;
      font-family: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: #020617;
      color: #e2e8f0;
      -webkit-font-smoothing: antialiased;
    }

    /* Hide scrollbar for Chrome, Safari and Opera */
    .no-scrollbar::-webkit-scrollbar {
      display: none;
    }
    /* Hide scrollbar for IE, Edge and Firefox */
    .no-scrollbar {
      -ms-overflow-style: none;  /* IE and Edge */
      scrollbar-width: none;  /* Firefox */
    }

    /* Custom scrollbar */
    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-track { background: rgba(15,23,42,0.5); }
    ::-webkit-scrollbar-thumb { background: rgba(167,139,250,0.3); border-radius: 10px; }
    ::-webkit-scrollbar-thumb:hover { background: rgba(167,139,250,0.6); }

    /* NIGHT GLASS IMAGE BACKGROUND */
    .night-bg {
        position: fixed;
        inset: 0;
        width: 100vw;
        height: 100vh;
        background-image: url('https://i.imgur.com/J3ZEdiB.png');
        background-size: cover;
        background-position: center;
        z-index: -2;
        background-color: #020617;
    }

    /* Vignette effect */
    .night-overlay {
        position: fixed;
        inset: 0;
        background: radial-gradient(circle at center, transparent 0%, #020617 150%);
        opacity: 0.9;
        z-index: -1;
        pointer-events: none;
    }

    /* ULTRA FROSTED GLASS CARDS */
    .night-glass-card {
        background: rgba(15, 23, 42, 0.5);
        backdrop-filter: blur(40px) saturate(150%);
        -webkit-backdrop-filter: blur(40px) saturate(150%);
        border: 1px solid rgba(167, 139, 250, 0.2);
        border-top: 1px solid rgba(255, 255, 255, 0.1); /* Subtle top light reflection */
        box-shadow: 0 50px 100px rgba(0, 0, 0, 0.65), 0 0 80px rgba(124, 58, 237, 0.15);
    }

    .night-glass-card-subtle {
        background: rgba(15, 23, 42, 0.4);
        backdrop-filter: blur(25px) saturate(120%);
        -webkit-backdrop-filter: blur(25px) saturate(120%);
        border: 1px solid rgba(167, 139, 250, 0.15);
        border-top: 1px solid rgba(255, 255, 255, 0.05);
    }

    /* LOGO RADIAL GLOW & FLOAT EFFECT */
    .logo-box {
        position: relative;
        display: flex;
        justify-content: center;
        align-items: center;
    }

    .logo-box::before {
        content: "";
        position: absolute;
        width: 150px;
        height: 150px;
        border-radius: 50%;
        background: radial-gradient(circle, rgba(168, 85, 247, 0.65), rgba(99, 102, 241, 0.45), rgba(37, 99, 235, 0.2), transparent 75%);
        filter: blur(28px);
        animation: logoGlowPulse 4s infinite ease-in-out;
        pointer-events: none;
    }

    @keyframes logoGlowPulse {
        0%, 100% { transform: scale(1); opacity: 0.8; }
        50% { transform: scale(1.22); opacity: 1; }
    }

    /* PILL BUTTONS */
    .night-btn-primary {
        background: linear-gradient(135deg, #a855f7, #6366f1, #2563eb);
        color: white;
        box-shadow: 0 15px 35px rgba(99, 102, 241, 0.45);
        transition: all 0.3s ease;
        border-radius: 9999px; /* Pill shape */
    }

    .night-btn-primary:hover {
        transform: translateY(-2px);
        box-shadow: 0 20px 45px rgba(99, 102, 241, 0.65);
    }

    .night-btn-link {
        background: rgba(15, 23, 42, 0.6);
        backdrop-filter: blur(12px);
        -webkit-backdrop-filter: blur(12px);
        border: 1px solid rgba(167, 139, 250, 0.3);
        transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        border-radius: 9999px; /* Pill shape */
    }

    .night-btn-link:hover {
        background: rgba(30, 41, 59, 0.8);
        border-color: rgba(168, 85, 247, 0.7);
        transform: translateY(-3px);
        box-shadow: 0 12px 30px rgba(124, 58, 237, 0.35);
    }

    /* PILL INPUTS */
    .control-input {
        width: 100%;
        background: rgba(15, 23, 42, 0.65);
        border: 1px solid rgba(167, 139, 250, 0.45);
        color: #ffffff;
        border-radius: 9999px; /* Pill shape */
        padding: 1rem 1.5rem; /* Taller padding for touch targets */
        outline: none;
        transition: all 0.3s ease;
        font-size: 1rem;
    }

    .control-input::placeholder { color: rgba(255, 255, 255, 0.5); }

    .control-input:focus {
        border-color: #60a5fa;
        background: rgba(15, 23, 42, 0.85);
        box-shadow: 0 0 25px rgba(96, 165, 250, 0.4);
        transform: translateY(-1px);
    }

    .control-input.border-red-500, .control-input.border-red-500:focus {
        border-color: #f87171;
    }
  </style>
</head>
<body class="text-white min-h-screen w-full relative overflow-x-hidden selection:bg-purple-500/30 antialiased">
  <!-- Fullscreen Background Image -->
  <div class="night-bg"></div>
  <div class="night-overlay"></div>

  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useMemo } = React;

    // --- Supabase ---
    const SUPABASE_URL = 'https://nmmshjdknmuzpgpquwec.supabase.co';
    const SUPABASE_ANON_KEY = 'sb_publishable_PCxlxywY7W6K3TmMrSnSsw_NPXKugoZ';
    const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    const PLAYER_LOGIN_KEY = 'gotcha_student_id';

    const fetchHouses = async () => {
      const { data, error } = await supabase.from('houses').select('*').order('name');
      if (error) { console.error('fetchHouses', error); return []; }
      return data.map(h => ({ id: h.id, name: h.name, points: h.points }));
    };

    const fetchPlayers = async () => {
      const { data, error } = await supabase.from('players').select('*').order('name');
      if (error) { console.error('fetchPlayers', error); return []; }
      return data.map(p => ({
        id: p.id,
        name: p.name,
        house: p.house,
        status: p.status,
        targetId: p.target_id,
        eliminations: p.eliminations,
        hasGoldenDart: p.has_golden_dart,
        studentId: p.student_id,
        photoUrl: p.photo_url
      }));
    };

    const fetchGameActive = async () => {
      const { data, error } = await supabase.from('game_state').select('active').eq('id', 1).maybeSingle();
      if (error) { console.error('fetchGameActive', error); return false; }
      return data ? data.active : false;
    };

    const fetchTimesheetRoster = async () => {
      const { data: settingRow, error: settingsError } = await supabase
        .from('settings')
        .select('value')
        .eq('key', 'ActiveYear')
        .maybeSingle();
      if (settingsError) throw new Error(settingsError.message);
      const activeYear = settingRow && settingRow.value;
      if (!activeYear) throw new Error('Could not find an active academic year in the timesheet settings.');

      const { data: rosterRows, error: rosterError } = await supabase
        .from('roster')
        .select('student_id, name, team')
        .eq('academic_year', activeYear)
        .order('name');
      if (rosterError) throw new Error(rosterError.message);
      if (!rosterRows || rosterRows.length === 0) {
        throw new Error(`No students found on the ${activeYear} timesheet roster.`);
      }

      return {
        activeYear,
        players: rosterRows.map(r => ({
          studentId: r.student_id,
          name: r.name,
          house: r.team,
          status: 'alive',
          eliminations: 0,
          hasGoldenDart: false
        }))
      };
    };

    const IconWrapper = ({ name, size = 24, className = '', color = 'currentColor' }) => {
      const iconRef = React.useRef(null);

      React.useEffect(() => {
        if (iconRef.current && window.lucide) {
           window.lucide.createIcons({
             icons: { [name]: window.lucide.icons[name] },
             nameAttr: 'data-lucide',
             attrs: {
               class: className,
               width: size,
               height: size,
               stroke: color
             }
           });
        }
      }, [name, size, className, color]);

      return <i ref={iconRef} data-lucide={name} className={className} style={{ width: size, height: size }}></i>;
    };

    const Crosshair = (props) => <IconWrapper name="crosshair" {...props} />;
    const ShieldAlert = (props) => <IconWrapper name="shield-alert" {...props} />;
    const Trophy = (props) => <IconWrapper name="trophy" {...props} />;
    const Users = (props) => <IconWrapper name="users" {...props} />;
    const Settings = (props) => <IconWrapper name="settings" {...props} />;
    const User = (props) => <IconWrapper name="user" {...props} />;
    const Clock = (props) => <IconWrapper name="clock" {...props} />;
    const AlertCircle = (props) => <IconWrapper name="alert-circle" {...props} />;
    const Target = (props) => <IconWrapper name="target" {...props} />;
    const Camera = (props) => <IconWrapper name="camera" {...props} />;
    const Star = (props) => <IconWrapper name="star" {...props} />;
    const Upload = (props) => <IconWrapper name="upload" {...props} />;
    const LogOut = (props) => <IconWrapper name="log-out" {...props} />;
    const RefreshCw = (props) => <IconWrapper name="refresh-cw" {...props} />;
    const Trash2 = (props) => <IconWrapper name="trash-2" {...props} />;
    const UserCog = (props) => <IconWrapper name="user-cog" {...props} />;

    const DEFAULT_HOUSES = [
      { id: 'H1', name: 'Gryffindor', points: 0 },
      { id: 'H2', name: 'Slytherin', points: 0 },
      { id: 'H3', name: 'Ravenclaw', points: 0 },
      { id: 'H4', name: 'Hufflepuff', points: 0 }
    ];

    const Button = ({ children, onClick, variant = 'primary', className = '', disabled = false, type = 'button' }) => {
      const baseStyle = "px-6 py-4 rounded-full font-bold transition-all duration-300 flex items-center justify-center gap-2";
      const variants = {
        primary: "night-btn-primary",
        secondary: "night-btn-link text-white",
        danger: "bg-gradient-to-r from-rose-600 to-red-600 hover:from-rose-500 hover:to-red-500 text-white shadow-[0_0_15px_rgba(225,29,72,0.4)] rounded-full",
        outline: "border-2 border-purple-400/50 text-purple-300 hover:bg-purple-500/20 rounded-full"
      };

      return (
        <button
          type={type}
          onClick={onClick}
          disabled={disabled}
          className={`${baseStyle} ${variants[variant]} ${disabled ? 'opacity-50 cursor-not-allowed shadow-none' : 'active:scale-95'} ${className}`}
        >
          {children}
        </button>
      );
    };

    const Modal = ({ isOpen, onClose, title, children }) => {
      if (!isOpen) return null;
      return (
        <div className="fixed inset-0 bg-slate-950/80 flex items-end sm:items-center justify-center p-0 sm:p-4 z-[60] backdrop-blur-md transition-all">
          <div className="night-glass-card rounded-t-[40px] rounded-b-none sm:rounded-[32px] w-full max-w-md overflow-hidden shadow-2xl border-purple-400/40 animate-in slide-in-from-bottom-8 sm:zoom-in duration-300 max-h-[90vh] flex flex-col">
            <div className="p-6 border-b border-purple-500/20 flex justify-between items-center bg-slate-900/60 shrink-0">
              <h3 className="font-black text-xl text-white tracking-tight">{title}</h3>
              <button onClick={onClose} className="text-purple-200 hover:text-white transition-colors bg-slate-800 border border-purple-400/30 w-10 h-10 rounded-full flex items-center justify-center active:scale-95">&times;</button>
            </div>
            <div className="p-6 overflow-y-auto no-scrollbar pb-12 sm:pb-6">
              {children}
            </div>
          </div>
        </div>
      );
    };

    const PlayerAvatar = ({ player, size = 96 }) => {
      if (player && player.photoUrl) {
        return (
          <img
            src={player.photoUrl}
            alt={player.name}
            className="rounded-full object-cover border-4 border-purple-400/20 shadow-[0_0_20px_rgba(0,0,0,0.5)] shrink-0"
            style={{ width: size, height: size }}
          />
        );
      }
      return (
        <div className="bg-slate-900/60 rounded-full flex items-center justify-center border-4 border-purple-400/20 shadow-[0_0_20px_rgba(0,0,0,0.5)] shrink-0" style={{ width: size, height: size }}>
          <User size={Math.round(size * 0.42)} className="text-slate-400" />
        </div>
      );
    };

    const AdminLogin = ({ onLogin }) => {
      const [password, setPassword] = useState('');
      const [error, setError] = useState(false);

      const handleSubmit = (e) => {
        e.preventDefault();
        if (password === 'Staff49!') {
          onLogin();
        } else {
          setError(true);
          setPassword('');
        }
      };

      return (
        <div className="flex flex-col items-center justify-center py-12 px-4">
          <div className="night-glass-card p-8 rounded-[32px] w-full max-w-sm shadow-2xl relative overflow-hidden text-center">
            <div className="logo-box mb-6 justify-center">
              <div className="w-20 h-20 rounded-[20px] bg-slate-900/50 border border-purple-400/30 flex items-center justify-center relative z-10 shadow-lg">
                <ShieldAlert size={36} className="text-purple-300" />
              </div>
            </div>
            <h2 className="text-2xl font-black text-white text-center mb-2 tracking-tight">Admin Access</h2>
            <p className="text-purple-200/70 text-sm text-center mb-8 leading-relaxed">Enter the staff password to manage the game.</p>

            <form onSubmit={handleSubmit} className="space-y-4">
              <div>
                <input
                  type="password"
                  value={password}
                  onChange={(e) => { setPassword(e.target.value); setError(false); }}
                  placeholder="Enter Password"
                  className={`control-input ${error ? 'border-red-500' : ''} !text-center font-mono`}
                  autoFocus
                />
                {error && <p className="text-red-400 text-xs mt-2 text-center font-bold">Incorrect password.</p>}
              </div>
              <Button type="submit" variant="primary" className="w-full text-lg mt-2">Authenticate</Button>
            </form>
          </div>
        </div>
      );
    };

    const PlayerLogin = ({ onLogin }) => {
      const [studentId, setStudentId] = useState('');
      const [error, setError] = useState('');
      const [busy, setBusy] = useState(false);

      const handleSubmit = async (e) => {
        e.preventDefault();
        if (!studentId.trim()) return;
        setBusy(true);
        setError('');
        const result = await onLogin(studentId.trim());
        setBusy(false);
        if (!result.success) {
          setError(result.message);
          setStudentId('');
        }
      };

      return (
        <div className="flex flex-col items-center justify-center py-12 px-4">
          <div className="night-glass-card p-8 sm:p-10 rounded-[32px] w-full max-w-sm shadow-2xl relative overflow-hidden text-center">
            <div className="logo-box mb-6 justify-center">
              <img
                src="https://i.imgur.com/p2qZOL5.png"
                alt="GOTCHA Logo"
                className="w-28 h-28 object-contain relative z-10 drop-shadow-[0_0_15px_rgba(168,85,247,0.6)]"
              />
            </div>
            <h2 className="text-3xl font-black text-white text-center mb-2 tracking-tight drop-shadow-md">GOTCHA</h2>
            <p className="text-purple-200/70 text-sm text-center mb-8 leading-relaxed">Enter your Student ID to start the game and see your target.</p>

            <form onSubmit={handleSubmit} className="space-y-5">
              <div>
                <input
                  type="text"
                  inputMode="numeric"
                  value={studentId}
                  onChange={(e) => { setStudentId(e.target.value); setError(''); }}
                  placeholder="Student ID"
                  className={`control-input ${error ? 'border-red-500' : ''} !text-center font-mono text-lg`}
                  autoFocus
                />
                {error && <p className="text-red-400 text-xs mt-3 text-center font-bold">{error}</p>}
              </div>
              <Button type="submit" variant="primary" className="w-full text-lg shadow-[0_10px_25px_rgba(99,102,241,0.5)]" disabled={busy}>
                {busy ? 'Checking...' : 'Continue'}
              </Button>
            </form>
          </div>
        </div>
      );
    };

    const DashboardView = ({ currentUser, players, onEliminate, onLogin, onLogout, onUseGoldenDart }) => {
      const [isModalOpen, setIsModalOpen] = useState(false);
      const [isRevealing, setIsRevealing] = useState(false);
      const [scrambleName, setScrambleName] = useState("");
      const [isDartModalOpen, setIsDartModalOpen] = useState(false);
      const [selectedReviveId, setSelectedReviveId] = useState("");

      const target = useMemo(() => players.find(p => p.id === currentUser?.targetId), [players, currentUser]);

      // Target decryption animation logic
      useEffect(() => {
        if (!currentUser) return;
        const key = `target_seen_${currentUser.id}_${currentUser.targetId}`;
        
        // If they have a target, and we haven't logged that they've seen THIS specific target yet
        if (currentUser.targetId && !localStorage.getItem(key)) {
          setIsRevealing(true);
          let iteration = 0;
          const maxIterations = 25; // number of cycles
          const nameToScramble = target?.name || "ACQUIRING...";

          const interval = setInterval(() => {
            const chars = "ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789@#$%&*";
            setScrambleName(nameToScramble.split("").map((c, i) => {
              if (c === " ") return " ";
              // Decode from left to right gradually based on iteration
              const threshold = (i / nameToScramble.length) * maxIterations;
              return iteration > threshold ? c : chars[Math.floor(Math.random() * chars.length)];
            }).join(""));

            iteration++;
            if (iteration > maxIterations) {
              clearInterval(interval);
              setIsRevealing(false);
              localStorage.setItem(key, 'true');
            }
          }, 80);
          return () => clearInterval(interval);
        }
      }, [currentUser, target]);

      if (!currentUser) {
        return <PlayerLogin onLogin={onLogin} />;
      }

      return (
        <div className="max-w-3xl mx-auto space-y-6 pb-12">
          {/* Player Identity Card */}
          <div className="night-glass-card rounded-[32px] p-6 sm:p-8 flex flex-col md:flex-row items-center justify-between gap-6 relative overflow-hidden shadow-2xl">
            <div className="absolute top-0 left-0 w-full h-2 md:w-2 md:h-full bg-gradient-to-r md:bg-gradient-to-b from-purple-400 to-blue-600"></div>
            <div className="flex flex-col sm:flex-row items-center gap-6 z-10 w-full md:w-auto text-center sm:text-left">
              <PlayerAvatar player={currentUser} size={96} />
              <div>
                <h1 className="text-3xl sm:text-4xl font-black text-white tracking-tight break-words">{currentUser.name}</h1>
                <div className="flex flex-wrap justify-center sm:justify-start items-center gap-3 mt-3">
                  <span className="bg-slate-900/50 border border-purple-400/20 px-4 py-1.5 rounded-full text-sm font-bold text-purple-200">
                    Team {currentUser.house}
                  </span>
                  {currentUser.status === 'alive' ? (
                    <span className="bg-emerald-500/10 border border-emerald-500/30 text-emerald-400 px-4 py-1.5 rounded-full text-sm font-bold flex items-center gap-1.5">
                      <span className="w-2 h-2 rounded-full bg-emerald-400 animate-pulse"></span> ACTIVE
                    </span>
                  ) : (
                    <span className="bg-rose-500/10 border border-rose-500/30 text-rose-400 px-4 py-1.5 rounded-full text-sm font-bold flex items-center gap-1.5">
                      <AlertCircle size={14} /> ELIMINATED
                    </span>
                  )}
                  <button onClick={onLogout} className="night-btn-link px-4 py-1.5 rounded-full text-xs font-bold text-purple-300/60 hover:text-white flex items-center gap-1.5">
                    <LogOut size={12} /> Not you?
                  </button>
                </div>
              </div>
            </div>

            <div className="text-center md:text-right z-10 night-glass-card-subtle p-5 rounded-3xl border-purple-400/30 w-full md:w-auto shadow-inner">
              <div className="text-xs text-purple-200/70 font-bold uppercase tracking-widest mb-1">Total Eliminations</div>
              <div className="text-5xl font-black text-white drop-shadow-md">{currentUser.eliminations}</div>
            </div>
          </div>

          {currentUser.hasGoldenDart && (
            <div className="bg-gradient-to-r from-yellow-500/20 to-transparent border border-yellow-500/30 p-6 rounded-[32px] flex flex-col sm:flex-row items-center gap-5 shadow-xl backdrop-blur-md">
              <div className="bg-yellow-500/20 text-yellow-400 p-4 rounded-2xl border border-yellow-500/30 shrink-0">
                <Star size={32} className="text-yellow-400" fill="currentColor" />
              </div>
              <div className="text-center sm:text-left flex-1">
                <h3 className="text-yellow-400 font-black text-xl mb-1">Golden Dart Secured</h3>
                <p className="text-sm text-yellow-100/80 leading-relaxed">You possess a rare Golden Dart. Use it to revive yourself or another fallen player.</p>
              </div>
              <Button onClick={() => setIsDartModalOpen(true)} className="!bg-yellow-500 hover:!bg-yellow-400 !text-yellow-950 w-full sm:w-auto shadow-[0_10px_25px_rgba(234,179,8,0.4)] px-8">
                Use Dart
              </Button>
            </div>
          )}

          {/* Golden Dart Usage Modal */}
          <Modal isOpen={isDartModalOpen} onClose={() => setIsDartModalOpen(false)} title="Use Golden Dart">
            <div className="space-y-6">
              <div className="bg-yellow-500/10 border border-yellow-500/20 p-5 rounded-2xl text-center">
                <Star className="text-yellow-400 mx-auto mb-2" fill="currentColor" size={24} />
                <p className="text-sm text-yellow-200 leading-relaxed">
                  Select an eliminated player to revive. If you revive yourself, you will re-enter the game immediately.
                </p>
              </div>
              
              <div className="bg-slate-900/50 p-1 rounded-[24px]">
                <select

        if (!rosterText.trim()) return;

        const lines = rosterText.split('\n');
        const newPlayers = [];
        const discoveredHouses = new Set();

        lines.forEach((line) => {
          if (!line.trim()) return;
          const parts = line.split(',');
          if (parts.length >= 3) {
            const studentId = parts[0].trim();
            const name = parts[1].trim();
            const houseName = parts[2].trim();
            discoveredHouses.add(houseName);

            newPlayers.push({
              studentId,
              name,
              house: houseName,
              status: 'alive',
              eliminations: 0,
              hasGoldenDart: false
            });
          }
        });

        if (newPlayers.length > 0) {
          setBusy(true);
          await onLoadRoster(newPlayers, Array.from(discoveredHouses));
          setBusy(false);
          setMessage(`Successfully loaded ${newPlayers.length} players across ${discoveredHouses.size} teams.`);
        } else {
          setMessage("Failed to parse roster. Please ensure 'Student ID, Name, Team' format.");
        }

        if (!file) return;
        setUploadingId(playerId);

        setMessage(result.success ? 'Photo uploaded.' : `Photo upload failed: ${result.message}`);

                  <p className="text-sm text-slate-400 mt-2 leading-relaxed max-w-xl">Pulls the active year's roster (Student ID, name, team) straight from the timesheet database — no manual upload needed.</p>
                </div>
                <Button variant="primary" onClick={handleSyncRoster} disabled={syncing} className="w-full sm:w-auto whitespace-nowrap px-8">
                  {syncing ? 'Syncing...' : 'Sync Roster'}
                </Button>
              </div>

              <button onClick={() => setShowManual(s => !s)} className="text-xs font-bold text-purple-300/60 hover:text-purple-200 uppercase tracking-widest transition-colors block ml-2">
                {showManual ? 'Hide manual override' : 'Need to add someone manually? →'}
              </button>

              {showManual && (
                <div className="animate-in slide-in-from-top-4 duration-300">
                  <label className="block text-sm font-bold text-purple-200/70 mb-3 ml-2">Manual Roster Override (Format: Student ID, Name, Team per line)</label>
                  <textarea
                    value={rosterText}
                    onChange={(e) => setRosterText(e.target.value)}
                    placeholder="10234567, John Doe, Gryffindor&#10;10298765, Jane Smith, Slytherin"
                    className="control-input !rounded-[24px] h-40 font-mono text-sm shadow-inner resize-none p-5"
                  ></textarea>
                  <p className="text-xs text-slate-500 mt-3 ml-2">This replaces the entire roster — use it only for players outside the timesheet roster.</p>
                  <Button variant="secondary" onClick={handleParseRoster} disabled={busy} className="w-full mt-4">
                    {busy ? 'Loading...' : 'Load Manual Roster'}
                  </Button>
                </div>
              )}

              {message && <div className="p-5 bg-purple-500/10 text-purple-200 rounded-[20px] border border-purple-500/20 text-sm font-bold text-center animate-in fade-in">{message}</div>}
            </div>
          </div>

          {/* Active Roster List */}
          {players.length > 0 && (
            <div className="space-y-6">
              <h2 className="text-2xl font-black text-white px-2">Active Roster</h2>
              
              {/* Desktop Table View */}
              <div className="hidden md:block night-glass-card p-6 sm:p-8 rounded-[32px] border-purple-400/40 shadow-2xl overflow-hidden">
                <div className="overflow-x-auto no-scrollbar">
                  <table className="w-full text-left text-sm text-slate-300 min-w-[850px]">
                    <thead className="bg-slate-900/50 text-purple-200/70 uppercase text-xs tracking-wider">
                      <tr>
                        <th className="p-4 rounded-tl-[16px]">Photo</th>
                        <th className="p-4">Student ID</th>
                        <th className="p-4">Name</th>
                        <th className="p-4">Team</th>
                        <th className="p-4">Target</th>
                        <th className="p-4">Status</th>
                        <th className="p-4 text-right rounded-tr-[16px]">Admin Actions</th>
                      </tr>
                    </thead>
                    <tbody className="divide-y divide-purple-500/10">
                      {players.map(p => (
                        <tr key={p.id} className="hover:bg-white/5 transition-colors">
                          <td className="p-4">
                            <label className="cursor-pointer inline-flex items-center gap-3 group">
                              <PlayerAvatar player={p} size={40} />
                              <span className="text-slate-500 group-hover:text-purple-300 transition-colors">
                                {uploadingId === p.id ? <span className="text-xs">...</span> : <Upload size={16} />}
                              </span>
                              <input
                                type="file"
                                accept="image/*"
                                className="hidden"
                                disabled={uploadingId === p.id}
                                onChange={(e) => handlePhotoChange(p.id, e.target.files[0])}
                              />
                            </label>
                          </td>
                          <td className="p-4 font-mono text-slate-400 whitespace-nowrap">{p.studentId || '—'}</td>
                          <td className="p-4 font-bold text-white max-w-[180px] truncate">{p.name} {p.hasGoldenDart && <span className="ml-2 text-yellow-500" title="Has Golden Dart">★</span>}</td>
                          <td className="p-4 whitespace-nowrap">{p.house}</td>
                          <td className="p-4 font-medium text-purple-300/80 max-w-[150px] truncate">{players.find(t => t.id === p.targetId)?.name || 'Unassigned'}</td>
                          <td className="p-4">
                            {p.status === 'alive' ? <span className="text-emerald-400 text-xs font-bold bg-emerald-500/10 px-3 py-1.5 rounded-full">ALIVE</span> : <span className="text-rose-400 text-xs font-bold bg-rose-500/10 px-3 py-1.5 rounded-full">ELIMINATED</span>}
                          </td>
                          <td className="p-4 text-right whitespace-nowrap">
                            <button onClick={() => setManagingPlayerId(p.id)} className="text-xs bg-purple-500/10 text-purple-300 border border-purple-500/30 px-4 py-2 rounded-full hover:bg-purple-500/20 transition-colors font-bold uppercase tracking-wider flex items-center gap-1.5 ml-auto">
                              <UserCog size={14} /> Manage
                            </button>
                          </td>
                        </tr>
                      ))}
                    </tbody>
                  </table>
                </div>
              </div>

              {/* Mobile Card View */}
              <div className="flex md:hidden flex-col gap-4">
                {players.map(p => (
                  <div key={p.id} className="night-glass-card-subtle p-5 rounded-[32px] border-purple-400/30 shadow-xl space-y-4">
                    <div className="flex items-center gap-4">
                      <label className="cursor-pointer relative group shrink-0">
                        <PlayerAvatar player={p} size={64} />
                        <div className="absolute inset-0 bg-black/60 rounded-full flex items-center justify-center opacity-0 group-hover:opacity-100 transition-opacity">
                          {uploadingId === p.id ? <RefreshCw size={20} className="text-white animate-spin" /> : <Upload size={20} className="text-white" />}
                        </div>
                        <input
                          type="file"
                          accept="image/*"
                          className="hidden"
                          disabled={uploadingId === p.id}
                          onChange={(e) => handlePhotoChange(p.id, e.target.files[0])}
                        />
                      </label>
                      <div className="min-w-0 flex-1">
                        <div className="font-bold text-white text-lg truncate">{p.name} {p.hasGoldenDart && <span className="text-yellow-500 ml-1">★</span>}</div>
                        <div className="text-sm font-mono text-purple-300/70">{p.studentId || 'No ID'}</div>
                        <div className="text-sm font-bold text-slate-300 mt-0.5">Team {p.house}</div>
                      </div>
                    </div>
                    
                    <div className="bg-slate-900/60 rounded-[24px] p-4 border border-white/5 text-sm space-y-3">
                       <div className="flex justify-between items-center">
                         <span className="text-slate-400 font-bold">Status</span>
                         {p.status === 'alive' ? <span className="text-emerald-400 font-bold bg-emerald-500/10 border border-emerald-500/20 px-3 py-1 rounded-full text-[10px] tracking-widest uppercase">Alive</span> : <span className="text-rose-400 font-bold bg-rose-500/10 border border-rose-500/20 px-3 py-1 rounded-full text-[10px] tracking-widest uppercase">Eliminated</span>}
                       </div>
                       <div className="flex justify-between items-center">
                         <span className="text-slate-400 font-bold">Target</span>
                         <span className="font-medium text-white truncate max-w-[150px]">{players.find(t => t.id === p.targetId)?.name || 'None'}</span>
                       </div>
                    </div>

                    <Button onClick={() => setManagingPlayerId(p.id)} variant="outline" className="w-full !py-3">
                      <UserCog size={16} /> Manage Player
                    </Button>
                  </div>
                ))}
              </div>
            </div>
          )}
        </div>
      );
    };

    const App = () => {
      const [activeTab, setActiveTab] = useState('dashboard');
      const [players, setPlayers] = useState([]);
      const [houses, setHouses] = useState(DEFAULT_HOUSES);
      const [loggedInStudentId, setLoggedInStudentId] = useState(() => localStorage.getItem(PLAYER_LOGIN_KEY) || null);
      const [gameActive, setGameActive] = useState(false);
      const [isAdminAuthenticated, setIsAdminAuthenticated] = useState(false);

      const currentUser = players.find(p => p.studentId && p.studentId === loggedInStudentId) || null;

      useEffect(() => {
        let cancelled = false;

        const loadAll = async () => {
          const [h, p, g] = await Promise.all([fetchHouses(), fetchPlayers(), fetchGameActive()]);
          if (cancelled) return;
          setHouses(h.length ? h : DEFAULT_HOUSES);
          setPlayers(p);
          setGameActive(g);
        };
        
        // Initial load
        loadAll();

        // WebSockets are restricted in this preview environment, 
        // so we use HTTP polling (every 5 seconds) as a fallback for realtime updates.
        const pollInterval = setInterval(() => {
          if (!cancelled) {
            loadAll();
          }
        }, 5000);

        return () => {
          cancelled = true;
          clearInterval(pollInterval);
        };
      }, []);

      const handleLoadRoster = async (newPlayers, houseNames) => {
        await supabase.from('players').delete().neq('id', 0);
        await supabase.from('houses').delete().neq('id', 0);
        await supabase.from('houses').insert(houseNames.map(name => ({ name, points: 0 })));
        await supabase.from('players').insert(newPlayers.map(p => ({
          student_id: p.studentId,
          name: p.name,
          house: p.house,
          status: p.status,
          eliminations: p.eliminations,
          has_golden_dart: p.hasGoldenDart
        })));
      };

      const handleSyncTimesheetRoster = async () => {
        try {
          const { activeYear, players: rosterPlayers } = await fetchTimesheetRoster();
          const discoveredHouses = Array.from(new Set(rosterPlayers.map(p => p.house)));
          await handleLoadRoster(rosterPlayers, discoveredHouses);
          return { success: true, count: rosterPlayers.length, houseCount: discoveredHouses.length, activeYear };
        } catch (err) {
          return { success: false, message: err.message };
        }
      };

      // Game State Methods
      const startGame = async () => {
        if (players.length < 2) return;
        const shuffled = [...players].sort(() => Math.random() - 0.5);
        await Promise.all(shuffled.map((player, index) =>
          supabase.from('players').update({
            status: 'alive',
            target_id: shuffled[(index + 1) % shuffled.length].id,
            eliminations: 0
          }).eq('id', player.id)
        ));
        await supabase.from('houses').update({ points: 0 }).neq('id', 0);
        await supabase.from('game_state').update({ active: true }).eq('id', 1);
      };

      const endGame = async () => {
         await supabase.from('game_state').update({ active: false }).eq('id', 1);
      };

      const resetGame = async () => {
        await supabase.from('game_state').update({ active: false }).eq('id', 1);
        await supabase.from('houses').update({ points: 0 }).neq('id', 0);
        await supabase.from('players').update({
          status: 'alive',
          target_id: null,
          eliminations: 0,
          has_golden_dart: false
        }).neq('id', 0);
      };

      const handleElimination = async (eliminatorId, targetId) => {
        const eliminator = players.find(p => p.id === eliminatorId);
        const target = players.find(p => p.id === targetId);
        if (!eliminator || !target || target.status !== 'alive') return;

        await supabase.from('players').update({
          target_id: target.targetId,
          eliminations: eliminator.eliminations + 1
        }).eq('id', eliminator.id);

        await supabase.from('players').update({
          status: 'eliminated',
          target_id: null
        }).eq('id', target.id);

        const house = houses.find(h => h.name === eliminator.house);
        if (house) {
          await supabase.from('houses').update({ points: house.points + 10 }).eq('id', house.id);
        }
      };

      const handleGoldenDart = async (playerId) => {
        setPlayers(prev => prev.map(p => p.id === playerId ? { ...p, hasGoldenDart: true } : p));
        await supabase.from('players').update({ has_golden_dart: true }).eq('id', playerId);
      };

      const handleRemoveGoldenDart = async (playerId) => {
        setPlayers(prev => prev.map(p => p.id === playerId ? { ...p, hasGoldenDart: false } : p));
        await supabase.from('players').update({ has_golden_dart: false }).eq('id', playerId);
      };

      const handleUpdateTarget = async (playerId, newTargetId) => {
        setPlayers(prev => prev.map(p => p.id === playerId ? { ...p, targetId: newTargetId } : p));
        await supabase.from('players').update({ target_id: newTargetId }).eq('id', playerId);
      };

      const handleRevivePlayer = async (playerId) => {
        setPlayers(prev => prev.map(p => p.id === playerId ? { ...p, status: 'alive' } : p));
        await supabase.from('players').update({ status: 'alive' }).eq('id', playerId);
      };

      const handleRemovePlayer = async (playerId) => {
        const playerToRemove = players.find(p => p.id === playerId);
        if (!playerToRemove) return;

        const playersTargetingThis = players.filter(p => p.targetId === playerId);

        // Optimistically stitch the chain and remove the player locally
        setPlayers(prev => {
          let next = prev.filter(p => p.id !== playerId);
          playersTargetingThis.forEach(pt => {
            next = next.map(p => p.id === pt.id ? { ...p, targetId: playerToRemove.targetId } : p);
          });
          return next;
        });

        // Stitch the chain in DB
        for (const pt of playersTargetingThis) {
          await supabase.from('players').update({ target_id: playerToRemove.targetId }).eq('id', pt.id);
        }
        
        // Delete from DB
        await supabase.from('players').delete().eq('id', playerId);
      };

      const handleUseGoldenDart = async (ownerId, reviveeId) => {
        const owner = players.find(p => p.id === ownerId);
        const revivee = players.find(p => p.id === reviveeId);
        if (!owner || !revivee || !owner.hasGoldenDart) return;

        // Optimistic UI updates
        setPlayers(prev => prev.map(p => {
          if (p.id === ownerId) {
            // Remove dart from owner, and revive if they were reviving themselves
            return { ...p, hasGoldenDart: false, status: ownerId === reviveeId ? 'alive' : p.status };
          }
          if (p.id === reviveeId) {
            // Revive the target
            return { ...p, status: 'alive' };
          }
          return p;
        }));

        // Database updates
        await supabase.from('players').update({ has_golden_dart: false }).eq('id', ownerId);
        await supabase.from('players').update({ status: 'alive' }).eq('id', reviveeId);
      };

      const handlePlayerLogin = async (studentId) => {
        const match = players.find(p => p.studentId && p.studentId.toString().trim() === studentId);
        if (!match) {
          return { success: false, message: 'Student ID not found. See a staff member if you believe this is an error.' };
        }
        localStorage.setItem(PLAYER_LOGIN_KEY, studentId);
        setLoggedInStudentId(studentId);
        return { success: true };
      };

      const handlePlayerLogout = () => {
        localStorage.removeItem(PLAYER_LOGIN_KEY);
        setLoggedInStudentId(null);
      };

      const handlePhotoUpload = async (playerId, file) => {
        const ext = (file.name.split('.').pop() || 'jpg').toLowerCase();
        const path = `${playerId}-${Date.now()}.${ext}`;
        const { error: uploadError } = await supabase.storage.from('player-photos').upload(path, file, { upsert: true, contentType: file.type });
        if (uploadError) return { success: false, message: uploadError.message };
        const { data } = supabase.storage.from('player-photos').getPublicUrl(path);
        const { error: updateError } = await supabase.from('players').update({ photo_url: data.publicUrl }).eq('id', playerId);
        if (updateError) return { success: false, message: updateError.message };
        return { success: true };
      };

      const renderTabContent = () => {
        switch (activeTab) {
          case 'dashboard':
            return <DashboardView 
              currentUser={currentUser} 
              players={players} 
              onEliminate={handleElimination} 
              onLogin={handlePlayerLogin} 
              onLogout={handlePlayerLogout}
              onUseGoldenDart={handleUseGoldenDart} 
            />;
          case 'leaderboard':
            return <LeaderboardView houses={houses} players={players} />;
          case 'rules':
            return <RulesView />;
          case 'admin':
            return isAdminAuthenticated ? (
              <AdminView 
                players={players} 
                houses={houses} 
                gameActive={gameActive}
                onLoadRoster={handleLoadRoster} 
                onSyncRoster={handleSyncTimesheetRoster} 
                onStartGame={startGame}
                onEndGame={endGame}
                onResetGame={resetGame}
                onGoldenDart={handleGoldenDart}
                onRemoveGoldenDart={handleRemoveGoldenDart}
                onPhotoUpload={handlePhotoUpload} 
                onUpdateTarget={handleUpdateTarget}
                onRevivePlayer={handleRevivePlayer}
                onRemovePlayer={handleRemovePlayer}
              />
            ) : (
              <AdminLogin onLogin={() => setIsAdminAuthenticated(true)} />
            );
          default:
            return null;
        }
      };

      return (
        <div className="min-h-screen font-sans text-slate-200 relative selection:bg-purple-500/30 overflow-x-hidden pb-32 md:pb-0">
          <div className="relative z-10 flex flex-col min-h-screen">
            {/* Header - Night Glass */}
            <header className="bg-slate-900/40 backdrop-blur-3xl border-b border-purple-400/20 sticky top-0 z-40">
              <div className="max-w-6xl mx-auto px-4 sm:px-6 h-16 md:h-20 flex items-center justify-end">
                {currentUser ? (
                  <div className="flex items-center gap-3 bg-slate-900/60 border border-purple-400/30 py-1.5 pl-2 pr-4 rounded-full shadow-inner backdrop-blur-md">
                    <PlayerAvatar player={currentUser} size={36} />
                    <span className="text-sm font-bold text-white hidden sm:inline truncate max-w-[150px]">{currentUser.name}</span>
                    <button onClick={handlePlayerLogout} title="Log out" className="text-purple-300/70 hover:text-white transition-colors ml-2">
                      <LogOut size={16} />
                    </button>
                  </div>
                ) : (
                  <div className="text-xs font-bold text-purple-300/50 uppercase tracking-widest hidden sm:block bg-slate-900/50 px-4 py-2 rounded-full">Secure Connection Established</div>
                )}
              </div>
            </header>

            {/* Navigation - Floating perfect pill on mobile, sticky top on desktop */}
            <nav className="fixed bottom-6 left-4 right-4 z-50 md:sticky md:top-20 md:bottom-auto md:left-auto md:right-auto md:bg-slate-900/40 md:border-t-0 md:border-b md:border-purple-400/25 md:backdrop-blur-3xl md:rounded-none bg-slate-900/70 backdrop-blur-3xl border border-purple-400/40 rounded-full shadow-[0_20px_40px_rgba(0,0,0,0.6),_0_0_25px_rgba(168,85,247,0.2)] overflow-hidden">
              <div className="max-w-6xl mx-auto flex justify-around md:justify-start p-1.5 md:p-0">
                {[
                  { id: 'dashboard', label: 'Mission', icon: User },
                  { id: 'leaderboard', label: 'Standings', icon: Trophy },
                  { id: 'rules', label: 'Rules', icon: ShieldAlert },
                  { id: 'admin', label: 'Admin', icon: Settings }
                ].map(tab => (
                  <button
                    key={tab.id}
                    onClick={() => setActiveTab(tab.id)}
                    className={`flex flex-col md:flex-row items-center justify-center gap-1 md:gap-3 px-3 py-3 md:px-8 md:py-6 font-bold transition-all w-full md:w-auto md:border-b-2 rounded-full md:rounded-none ${
                      activeTab === tab.id
                        ? 'text-purple-200 md:border-purple-400 bg-purple-500/20 md:bg-purple-500/10 shadow-inner'
                        : 'text-slate-400 hover:text-white border-transparent hover:bg-white/5'
                    }`}
                  >
                    <tab.icon size={22} className={activeTab === tab.id ? 'drop-shadow-[0_0_10px_rgba(168,85,247,0.8)]' : ''} />
                    <span className="text-[11px] md:text-sm tracking-wide">{tab.label}</span>
                  </button>
                ))}
              </div>
            </nav>

            {/* Main Content Area */}
            <main className="flex-1 max-w-6xl mx-auto w-full px-4 sm:px-6 pt-8 pb-12 relative z-10">
              {renderTabContent()}
            </main>
          </div>
        </div>
      );
    };

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
