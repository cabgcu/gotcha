<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>GOTCHA App</title>

  <link rel="icon" href="data:," />

  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- React & ReactDOM -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>

  <!-- Babel for JSX -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>

  <!-- Supabase -->
  <script src="https://unpkg.com/@supabase/supabase-js@2"></script>

  <!-- Google Fonts: Inter -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">

  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: { sans: ['Inter', 'sans-serif'] }
        }
      }
    }
  </script>

  <style>
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

    body {
      margin: 0;
      font-family: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: #000000;
      color: #e5e5e5;
      -webkit-font-smoothing: antialiased;
    }

    /* Hide scrollbar for Chrome, Safari and Opera */
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

    /* Custom scrollbar */
    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-track { background: rgba(255,255,255,0.05); }
    ::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.2); border-radius: 10px; }
    ::-webkit-scrollbar-thumb:hover { background: rgba(255,255,255,0.4); }

    /* BLACK MONOCHROMATIC BACKGROUND */
    .black-bg {
        position: fixed;
        inset: 0;
        width: 100vw;
        height: 100vh;
        background: radial-gradient(circle at 50% 0%, #111111 0%, #000000 70%);
        z-index: -2;
    }

    /* BLACK GLASS CARDS */
    .black-glass-card {
        background: rgba(20, 20, 20, 0.4);
        backdrop-filter: blur(40px);
        -webkit-backdrop-filter: blur(40px);
        border: 1px solid rgba(255, 255, 255, 0.1);
        border-top: 1px solid rgba(255, 255, 255, 0.15);
        box-shadow: 0 30px 60px rgba(0, 0, 0, 0.8), inset 0 1px 0 rgba(255, 255, 255, 0.05);
    }

    .black-glass-card-subtle {
        background: rgba(30, 30, 30, 0.3);
        backdrop-filter: blur(25px);
        -webkit-backdrop-filter: blur(25px);
        border: 1px solid rgba(255, 255, 255, 0.08);
        border-top: 1px solid rgba(255, 255, 255, 0.12);
    }

    /* LOGO RADIAL GLOW */
    .logo-box {
        position: relative;
        display: flex;
        justify-content: center;
        align-items: center;
    }

    .logo-box::before {
        content: "";
        position: absolute;
        width: 120px;
        height: 120px;
        border-radius: 50%;
        background: radial-gradient(circle, rgba(255, 255, 255, 0.2), transparent 70%);
        filter: blur(25px);
        animation: logoGlowPulse 4s infinite ease-in-out;
        pointer-events: none;
    }

    @keyframes logoGlowPulse {
        0%, 100% { transform: scale(1); opacity: 0.5; }
        50% { transform: scale(1.1); opacity: 0.8; }
    }

    /* SOLID WHITE BUTTONS */
    .black-btn-primary {
        background: #ffffff;
        color: #000000;
        box-shadow: 0 10px 25px rgba(255, 255, 255, 0.15);
        transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    }
    .black-btn-primary:hover:not(:disabled) {
        transform: translateY(-2px);
        box-shadow: 0 15px 35px rgba(255, 255, 255, 0.25);
        background: #f0f0f0;
    }

    /* SECONDARY BUTTONS */
    .black-btn-link {
        background: rgba(255, 255, 255, 0.05);
        backdrop-filter: blur(12px);
        -webkit-backdrop-filter: blur(12px);
        border: 1px solid rgba(255, 255, 255, 0.1);
        color: #ffffff;
        transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    }
    .black-btn-link:hover:not(:disabled) {
        background: rgba(255, 255, 255, 0.1);
        border-color: rgba(255, 255, 255, 0.2);
    }

    /* INPUT STYLES */
    .control-input {
        width: 100%;
        background: rgba(0, 0, 0, 0.4);
        border: 1px solid rgba(255, 255, 255, 0.15);
        color: #ffffff;
        border-radius: 9999px;
        padding: 1rem 1.25rem;
        outline: none;
        transition: all 0.3s ease;
        font-size: 1rem;
    }
    .control-input::placeholder { color: rgba(255, 255, 255, 0.3); }
    .control-input:focus {
        border-color: rgba(255, 255, 255, 0.5);
        background: rgba(20, 20, 20, 0.8);
        box-shadow: 0 0 20px rgba(255, 255, 255, 0.1);
    }
    .control-input.border-red-500 { border-color: #ef4444; }

    /* Bottom Sheet Animation for Mobile */
    @keyframes slideUp {
        from { transform: translateY(100%); opacity: 0; }
        to { transform: translateY(0); opacity: 1; }
    }
    .animate-slide-up { animation: slideUp 0.4s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
    
    /* Target Reveal Blur Animation */
    .motion-blur { filter: blur(2px); transform: scale(1.02); opacity: 0.8; }
  </style>
</head>
<body class="text-white min-h-screen w-full relative overflow-x-hidden selection:bg-white/30 antialiased">
  <div class="black-bg"></div>

  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useMemo, useRef } = React;

    // --- Supabase ---
    const SUPABASE_URL = 'https://nmmshjdknmuzpgpquwec.supabase.co';
    const SUPABASE_ANON_KEY = 'sb_publishable_PCxlxywY7W6K3TmMrSnSsw_NPXKugoZ';
    const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    const PLAYER_LOGIN_KEY = 'gotcha_student_id';

    const fetchHouses = async () => {
      const { data, error } = await supabase.from('houses').select('*').order('name');
      if (error) return [];
      return data.map(h => ({ id: h.id, name: h.name, points: h.points }));
    };

    const fetchPlayers = async () => {
      const { data, error } = await supabase.from('players').select('*').order('name');
      if (error) return [];
      return data.map(p => ({
        id: p.id,
        name: p.name,
        house: p.house,
        status: p.status,
        targetId: p.target_id,
        eliminations: p.eliminations,
        hasGoldenDart: p.has_golden_dart,
        studentId: p.student_id,
        photoUrl: p.photo_url,
        targetAssignedAt: p.target_assigned_at
      }));
    };

    const fetchGameActive = async () => {
      const { data, error } = await supabase.from('game_state').select('active').eq('id', 1).maybeSingle();
      if (error) return false;
      return data ? data.active : false;
    };

    const fetchTimesheetRoster = async () => {
      const { data: settingRow, error: settingsError } = await supabase.from('settings').select('value').eq('key', 'ActiveYear').maybeSingle();
      if (settingsError) throw new Error(settingsError.message);
      const activeYear = settingRow && settingRow.value;
      if (!activeYear) throw new Error('Could not find an active academic year.');

      const { data: rosterRows, error: rosterError } = await supabase.from('roster').select('student_id, name, team').eq('academic_year', activeYear).order('name');
      if (rosterError) throw new Error(rosterError.message);
      if (!rosterRows || rosterRows.length === 0) throw new Error(`No students found for ${activeYear}.`);

      return {
        activeYear,
        players: rosterRows.map(r => ({
          studentId: r.student_id,
          name: r.name,
          house: r.team,
          status: 'alive',
          eliminations: 0,
          hasGoldenDart: false
        }))
      };
    };

    const IconWrapper = ({ name, size = 24, className = '', color = 'currentColor' }) => {
      const iconRef = useRef(null);
      useEffect(() => {
        if (iconRef.current && window.lucide && window.lucide.icons) {
           const pascalName = name.replace(/(^\w|-\w)/g, c => c.replace('-', '').toUpperCase());
           const iconData = window.lucide.icons[pascalName] || window.lucide.icons[name];
           if (!iconData) return;
           window.lucide.createIcons({
             icons: { [name]: iconData },
             nameAttr: 'data-lucide',
             attrs: { class: className, width: size, height: size, stroke: color }
           });
        }
      }, [name, size, className, color]);
      return <i ref={iconRef} data-lucide={name} className={className} style={{ width: size, height: size }}></i>;
    };

    // Icons
    const Crosshair = (props) => <IconWrapper name="crosshair" {...props} />;
    const ShieldAlert = (props) => <IconWrapper name="shield-alert" {...props} />;
    const Trophy = (props) => <IconWrapper name="trophy" {...props} />;
    const Users = (props) => <IconWrapper name="users" {...props} />;
    const Settings = (props) => <IconWrapper name="settings" {...props} />;
    const User = (props) => <IconWrapper name="user" {...props} />;
    const Clock = (props) => <IconWrapper name="clock" {...props} />;
    const AlertCircle = (props) => <IconWrapper name="alert-circle" {...props} />;
    const Target = (props) => <IconWrapper name="target" {...props} />;
    const Camera = (props) => <IconWrapper name="camera" {...props} />;
    const Star = (props) => <IconWrapper name="star" {...props} />;
    const Upload = (props) => <IconWrapper name="upload" {...props} />;
    const LogOut = (props) => <IconWrapper name="log-out" {...props} />;
    const RefreshCw = (props) => <IconWrapper name="refresh-cw" {...props} />;
    const Trash2 = (props) => <IconWrapper name="trash-2" {...props} />;
    const HeartPulse = (props) => <IconWrapper name="heart-pulse" {...props} />;
    const UserMinus = (props) => <IconWrapper name="user-minus" {...props} />;
    const Edit3 = (props) => <IconWrapper name="edit-3" {...props} />;

    const DEFAULT_HOUSES = [
      { id: 'H1', name: 'Gryffindor', points: 0 },
      { id: 'H2', name: 'Slytherin', points: 0 },
      { id: 'H3', name: 'Ravenclaw', points: 0 },
      { id: 'H4', name: 'Hufflepuff', points: 0 }
    ];

    const Button = ({ children, onClick, variant = 'primary', className = '', disabled = false, type = 'button' }) => {
      const baseStyle = "px-6 py-4 rounded-full font-bold transition-all duration-300 flex items-center justify-center gap-2";
      const variants = {
        primary: "black-btn-primary",
        secondary: "black-btn-link",
        danger: "bg-red-500 text-white hover:bg-red-600 shadow-[0_0_15px_rgba(239,68,68,0.3)]",
        outline: "border border-white/20 text-white hover:bg-white/10"
      };

      return (
        <button
          type={type}
          onClick={onClick}
          disabled={disabled}
          className={`${baseStyle} ${variants[variant]} ${disabled ? 'opacity-50 cursor-not-allowed hover:transform-none shadow-none' : 'active:scale-95'} ${className}`}
        >
          {children}
        </button>
      );
    };

    const Modal = ({ isOpen, onClose, title, children }) => {
      if (!isOpen) return null;
      return (
        <div className="fixed inset-0 bg-black/80 flex items-end md:items-center justify-center z-[70] backdrop-blur-md transition-opacity">
          <div className="black-glass-card w-full md:max-w-md overflow-hidden shadow-2xl rounded-t-[40px] md:rounded-[36px] animate-slide-up md:animate-none">
            <div className="p-6 border-b border-white/10 flex justify-between items-center relative">
              <div className="absolute top-3 left-1/2 -translate-x-1/2 w-12 h-1.5 bg-white/20 rounded-full md:hidden"></div>
              <h3 className="font-bold text-xl text-white mt-2 md:mt-0">{title}</h3>
              <button onClick={onClose} className="text-white/50 hover:text-white transition-colors bg-white/5 border border-white/10 w-8 h-8 rounded-full flex items-center justify-center mt-2 md:mt-0">&times;</button>
            </div>
            <div className="p-6 pb-12 md:pb-6 max-h-[80vh] overflow-y-auto no-scrollbar">
              {children}
            </div>
          </div>
        </div>
      );
    };

    const PlayerAvatar = ({ player, size = 96, className = '' }) => {
      if (player && player.photoUrl) {
        return (
          <img
            src={player.photoUrl}
            alt={player.name}
            className={`rounded-full object-cover border border-white/20 shadow-[0_0_20px_rgba(0,0,0,0.5)] shrink-0 ${className}`}
            style={{ width: size, height: size }}
          />
        );
      }
      return (
        <div className={`bg-white/5 rounded-full flex items-center justify-center border border-white/20 shadow-[0_0_20px_rgba(0,0,0,0.5)] shrink-0 ${className}`} style={{ width: size, height: size }}>
          <User size={Math.round(size * 0.45)} className="text-white/40" />
        </div>
      );
    };

    const AdminLogin = ({ onLogin }) => {
      const [password, setPassword] = useState('');
      const [error, setError] = useState(false);

      const handleSubmit = (e) => {
        e.preventDefault();
        if (password === 'Staff49!') onLogin();
        else { setError(true); setPassword(''); }
      };

      return (
        <div className="flex flex-col items-center justify-center py-12 px-4 h-[80vh]">
          <div className="black-glass-card p-8 sm:p-10 rounded-[40px] w-full max-w-sm shadow-2xl relative overflow-hidden text-center">
            <div className="logo-box mb-8 justify-center">
              <div className="w-20 h-20 rounded-3xl bg-black border border-white/10 flex items-center justify-center relative z-10 shadow-lg">
                <img src="https://i.imgur.com/p2qZOL5.png" alt="GOTCHA Logo" className="w-12 h-12 object-contain" />
              </div>
            </div>
            <h2 className="text-2xl font-black text-white text-center mb-2 tracking-tight">Admin Access</h2>
            <p className="text-white/40 text-sm text-center mb-8 leading-relaxed">Enter the staff password to manage the hunting grounds.</p>

            <form onSubmit={handleSubmit} className="space-y-4">
              <div>
                <input
                  type="password"
                  value={password}
                  onChange={(e) => { setPassword(e.target.value); setError(false); }}
                  placeholder="Enter Password"
                  className={`control-input ${error ? 'border-red-500' : ''} !text-center font-mono`}
                  autoFocus
                />
                {error && <p className="text-red-400 text-xs mt-3 text-center font-bold">Incorrect password.</p>}
              </div>
              <Button type="submit" variant="primary" className="w-full mt-2">Authenticate</Button>
            </form>
          </div>
        </div>
      );
    };

    const PlayerLogin = ({ onLogin, onAdminClick }) => {
      const [studentId, setStudentId] = useState('');
      const [error, setError] = useState('');
      const [busy, setBusy] = useState(false);

      const handleSubmit = async (e) => {
        e.preventDefault();
        if (!studentId.trim()) return;
        setBusy(true); setError('');
        const result = await onLogin(studentId.trim());
        setBusy(false);
        if (!result.success) { setError(result.message); setStudentId(''); }
      };

      return (
        <div className="flex flex-col items-center justify-center py-12 px-4 h-[80vh]">
          <div className="black-glass-card p-8 sm:p-10 rounded-[40px] w-full max-w-sm shadow-2xl relative overflow-hidden text-center">
            <div className="logo-box mb-8 justify-center">
              <div className="w-20 h-20 rounded-3xl bg-black border border-white/10 flex items-center justify-center relative z-10 shadow-lg">
                <img src="https://i.imgur.com/p2qZOL5.png" alt="GOTCHA Logo" className="w-12 h-12 object-contain" />
              </div>
            </div>
            <h2 className="text-3xl font-black text-white text-center mb-2 tracking-tight">GOTCHA</h2>
            <p className="text-white/40 text-sm text-center mb-8 leading-relaxed">Enter your Student ID to acquire your mission target.</p>

            <form onSubmit={handleSubmit} className="space-y-4">
              <div>
                <input
                  type="text"
                  inputMode="numeric"
                  value={studentId}
                  onChange={(e) => { setStudentId(e.target.value); setError(''); }}
                  placeholder="Student ID"
                  className={`control-input ${error ? 'border-red-500' : ''} !text-center font-mono`}
                  autoFocus
                />
                {error && <p className="text-red-400 text-xs mt-3 text-center font-bold">{error}</p>}
              </div>
              <Button type="submit" variant="primary" className="w-full mt-2" disabled={busy}>
                {busy ? 'Authenticating...' : 'Enter the Hunt'}
              </Button>
            </form>

            <div className="mt-8 pt-6 border-t border-white/10">
              <button 
                type="button" 
                onClick={onAdminClick} 
                className="text-[10px] text-white/30 hover:text-white transition-colors uppercase font-bold tracking-widest flex items-center justify-center gap-1.5 mx-auto"
              >
                <Settings size={12} /> Staff / Admin Login
              </button>
            </div>
          </div>
        </div>
      );
    };

    const DashboardView = ({ currentUser, players, onEliminate, onUseGoldenDart, onLogout }) => {
      const [isModalOpen, setIsModalOpen] = useState(false);
      const [isDartModalOpen, setIsDartModalOpen] = useState(false);
      const [isRevealing, setIsRevealing] = useState(false);
      const [spinDisplay, setSpinDisplay] = useState(null);
      const [timeLeft, setTimeLeft] = useState(null);
      const [reviveTargetId, setReviveTargetId] = useState("");

      const target = useMemo(() => players.find(p => p.id === currentUser?.targetId), [players, currentUser]);
      const eliminatedPlayers = useMemo(() => players.filter(p => p.status === 'eliminated'), [players]);
      const aliveCount = useMemo(() => players.filter(p => p.status === 'alive').length, [players]);
      const isTrueWinner = currentUser && currentUser.targetId === currentUser.id && aliveCount <= 1;

      // Target Reveal Spin Animation
      useEffect(() => {
        if (!currentUser) return;
        const key = `target_seen_${currentUser.id}_${currentUser.targetId}`;
        
        // Trigger if they haven't seen this target AND it's not themselves (Victory state)
        if (currentUser.targetId && currentUser.targetId !== currentUser.id && !localStorage.getItem(key)) {
          setIsRevealing(true);
          
          const pool = players.filter(p => p.id !== currentUser.id);
          if (pool.length === 0 && target) pool.push(target);
          if (pool.length === 0) pool.push(currentUser);

          let spins = 0;
          const maxSpins = 25;
          let currentDelay = 50;

          const spin = () => {
            spins++;
            if (spins >= maxSpins) {
              setSpinDisplay(target);
              setIsRevealing(false);
              localStorage.setItem(key, 'true'); 
            } else {
              setSpinDisplay(pool[Math.floor(Math.random() * pool.length)]);
              if (spins > maxSpins * 0.6) currentDelay = currentDelay * 1.2;
              setTimeout(spin, currentDelay);
            }
          };
          spin();
          return () => {};
        }
      }, [currentUser, target, players]);

      // Server-backed 24-hour Expiration Timer
      useEffect(() => {
        if (!currentUser || !currentUser.targetId || currentUser.targetId === currentUser.id || isRevealing || !currentUser.targetAssignedAt) {
          setTimeLeft(null);
          return;
        }

        const deadline = new Date(currentUser.targetAssignedAt).getTime() + (24 * 60 * 60 * 1000);

        const updateTimer = () => {
          const now = Date.now();
          const diff = deadline - now;
          
          if (diff <= 0) {
            setTimeLeft("00:00:00");
            return false;
          } else {
            const h = Math.floor(diff / (1000 * 60 * 60)).toString().padStart(2, '0');
            const m = Math.floor((diff % (1000 * 60 * 60)) / (1000 * 60)).toString().padStart(2, '0');
            const s = Math.floor((diff % (1000 * 60)) / 1000).toString().padStart(2, '0');
            setTimeLeft(`${h}:${m}:${s}`);
            return true;
          }
        };

        const keepGoing = updateTimer();
        if (!keepGoing) return;

        const timerId = setInterval(() => {
          if (!updateTimer()) clearInterval(timerId);
        }, 1000);

        return () => clearInterval(timerId);
      }, [currentUser, isRevealing]);

      if (!currentUser) return null;

      return (
        <div className="max-w-2xl mx-auto space-y-4 sm:space-y-6 pb-12">
          
          {/* Player Identity Bar - Compact on Mobile */}
          <div className="black-glass-card rounded-[28px] sm:rounded-[36px] p-4 sm:p-6 flex items-center justify-between gap-4">
            <div className="flex items-center gap-3 sm:gap-5 w-full">
              <PlayerAvatar player={currentUser} size={64} className="sm:!w-24 sm:!h-24" />
              <div className="flex-1 min-w-0">
                <h1 className="text-xl sm:text-3xl font-black text-white tracking-tight truncate pr-2">{currentUser.name}</h1>
                <div className="flex items-center gap-2 mt-1 sm:mt-2">
                  <span className="text-[10px] sm:text-xs font-bold text-white/50 bg-white/5 border border-white/10 px-2 sm:px-3 py-1 rounded-full whitespace-nowrap">
                    {currentUser.house}
                  </span>
                  {currentUser.status === 'alive' ? (
                    <span className="text-[10px] sm:text-xs font-bold text-emerald-400 bg-emerald-500/10 border border-emerald-500/20 px-2 sm:px-3 py-1 rounded-full flex items-center gap-1.5 whitespace-nowrap">
                      <span className="w-1.5 h-1.5 rounded-full bg-emerald-400 animate-pulse shrink-0"></span> ACTIVE
                    </span>
                  ) : (
                    <span className="text-[10px] sm:text-xs font-bold text-red-400 bg-red-500/10 border border-red-500/20 px-2 sm:px-3 py-1 rounded-full flex items-center gap-1 whitespace-nowrap">
                      <AlertCircle size={10} className="shrink-0" /> ELIMINATED
                    </span>
                  )}
                </div>
              </div>
            </div>
            <div className="text-right shrink-0">
              <div className="text-[10px] text-white/40 font-bold uppercase tracking-widest mb-0.5 sm:mb-1">Tags</div>
              <div className="text-3xl sm:text-5xl font-black text-white leading-none">{currentUser.eliminations}</div>
              <button onClick={onLogout} className="text-[9px] sm:text-xs text-white/30 hover:text-white mt-2 transition-colors uppercase tracking-widest font-bold">Logout</button>
            </div>
          </div>

          {/* Golden Dart UI */}
          {currentUser.hasGoldenDart && (
            <div className="bg-white text-black p-5 sm:p-6 rounded-[28px] sm:rounded-[36px] flex flex-col sm:flex-row items-center gap-4 sm:gap-6 shadow-[0_0_30px_rgba(255,255,255,0.2)]">
              <div className="bg-black/5 p-3 sm:p-4 rounded-2xl shrink-0"><Star size={32} className="text-black" fill="currentColor" /></div>
              <div className="text-center sm:text-left flex-1">
                <h3 className="font-black text-lg sm:text-xl tracking-tight">Golden Dart Secured</h3>
                <p className="text-sm text-black/60 font-medium leading-relaxed mt-1">You possess a rare Golden Dart. Use it to immediately revive yourself or an eliminated friend.</p>

                        <td className="p-4 text-white/50">{players.find(t => t.id === p.targetId)?.name || 'None'}</td>
                        <td className="p-4">
                          {p.status === 'alive' ? <span className="text-emerald-400 text-[10px] font-bold bg-emerald-500/10 px-3 py-1.5 rounded-full uppercase tracking-wider">ALIVE</span> : <span className="text-red-400 text-[10px] font-bold bg-red-500/10 px-3 py-1.5 rounded-full uppercase tracking-wider">ELIMINATED</span>}
                        </td>
                        <td className="p-4 text-right pr-8">
                          <Button variant="secondary" className="!py-2 !px-4 text-xs inline-flex" onClick={() => setManagingPlayerId(p.id)}>Manage</Button>
                        </td>
                      </tr>
                    ))}
                  </tbody>
                </table>
              </div>

              {/* Mobile Stacked List */}
              <div className="md:hidden divide-y divide-white/5">
                {players.map(p => (
                  <div key={p.id} className="p-4 flex items-center justify-between gap-3">
                    <label className="cursor-pointer relative shrink-0">
                      <PlayerAvatar player={p} size={48} />
                      <input type="file" accept="image/*" className="hidden" onChange={(e) => handlePhotoChange(p.id, e.target.files[0])} />
                    </label>
                    <div className="flex-1 min-w-0">
                       <div className="font-bold text-white text-sm truncate">{p.name} {p.hasGoldenDart && <span>★</span>}</div>
                       <div className="text-[10px] text-white/50 mt-0.5 truncate">Target: {players.find(t => t.id === p.targetId)?.name || 'None'}</div>
                    </div>
                    <Button variant="secondary" className="!py-2 !px-3 text-[10px] shrink-0" onClick={() => setManagingPlayerId(p.id)}>Manage</Button>
                  </div>
                ))}
              </div>
            </div>
          )}

          {/* Manage Player Modal */}
          <Modal isOpen={!!managingPlayerId} onClose={() => { setManagingPlayerId(null); setIsDeletingPlayer(false); }} title={`Manage: ${managingPlayer?.name}`}>
            {managingPlayer && (
              <div className="space-y-6">
                <div className="flex items-center gap-4 bg-white/5 p-4 rounded-2xl border border-white/10">
                  <PlayerAvatar player={managingPlayer} size={56} />
                  <div>
                    <div className="font-bold text-white">{managingPlayer.name}</div>
                    <div className="text-xs text-white/50">{managingPlayer.house} • {managingPlayer.status.toUpperCase()}</div>
                  </div>
                </div>

                {isDeletingPlayer ? (
                  <div className="bg-red-500/10 border border-red-500/20 p-5 rounded-3xl space-y-4">
                    <p className="text-sm text-red-200/80 font-medium">Permanently remove this player? Their target will be seamlessly passed to whoever is hunting them to maintain the chain.</p>
                    <div className="flex gap-2">
                      <Button variant="secondary" className="flex-1 !py-3" onClick={() => setIsDeletingPlayer(false)}>Cancel</Button>
                      <Button variant="danger" className="flex-1 !py-3" onClick={() => { onRemovePlayer(managingPlayer.id); setManagingPlayerId(null); setIsDeletingPlayer(false); }}>Remove</Button>
                    </div>
                  </div>
                ) : (
                  <div className="space-y-4">
                    <div className="space-y-2">
                      <label className="text-xs font-bold text-white/40 uppercase tracking-widest ml-1">Override Target</label>
                      <select 
                        className="control-input !rounded-2xl appearance-none"
                        value={managingPlayer.targetId || ""}
                        onChange={(e) => onUpdateTarget(managingPlayer.id, e.target.value)}
                      >
                        <option value="">-- No Target --</option>
                        {players.filter(p => p.id !== managingPlayer.id).map(p => (
                          <option key={p.id} value={p.id}>{p.name} ({p.status})</option>
                        ))}
                      </select>
                      <p className="text-[10px] text-white/30 ml-1">Note: This resets their 24h timer automatically.</p>
                    </div>

                    <div className="grid grid-cols-2 gap-3 pt-4 border-t border-white/10">
                      {managingPlayer.status === 'eliminated' ? (
                        <Button variant="secondary" className="!py-3 text-xs" onClick={() => { onRevivePlayer(managingPlayer.id); setManagingPlayerId(null); }}>
                          <HeartPulse size={14}/> Revive Player
                        </Button>
                      ) : (
                        <Button variant="secondary" className="!py-3 text-xs opacity-50 cursor-not-allowed">
                          Already Alive
                        </Button>
                      )}

                      {managingPlayer.hasGoldenDart ? (
                        <Button variant="secondary" className="!py-3 text-xs" onClick={() => onRemoveGoldenDart(managingPlayer.id)}>
                          <Trash2 size={14}/> Remove Dart
                        </Button>
                      ) : (
                        <Button variant="secondary" className="!py-3 text-xs" onClick={() => onGoldenDart(managingPlayer.id)}>
                          <Star size={14}/> Give Dart
                        </Button>
                      )}
                    </div>

                    <div className="pt-2">
                      <Button variant="secondary" className="w-full !py-3 text-xs !text-red-400 hover:!bg-red-500/10 border-red-500/20" onClick={() => setIsDeletingPlayer(true)}>
                        <UserMinus size={14}/> Permanently Remove
                      </Button>
                    </div>
                  </div>
                )}
              </div>
            )}
          </Modal>

        </div>
      );
    };

    const App = () => {
      const [activeTab, setActiveTab] = useState('dashboard');
      const [players, setPlayers] = useState([]);
      const [houses, setHouses] = useState(DEFAULT_HOUSES);
      const [loggedInStudentId, setLoggedInStudentId] = useState(() => localStorage.getItem(PLAYER_LOGIN_KEY) || null);
      const [gameActive, setGameActive] = useState(false);
      const [isAdminAuthenticated, setIsAdminAuthenticated] = useState(false);

      const currentUser = players.find(p => p.studentId && p.studentId === loggedInStudentId) || null;

      useEffect(() => {
        let cancelled = false;
        const loadAll = async () => {
          const [h, p, g] = await Promise.all([fetchHouses(), fetchPlayers(), fetchGameActive()]);
          if (cancelled) return;
          setHouses(h.length ? h : DEFAULT_HOUSES);
          setPlayers(p);
          setGameActive(g);
        };
        loadAll();
        const pollInterval = setInterval(() => { if (!cancelled) loadAll(); }, 5000);
        return () => { cancelled = true; clearInterval(pollInterval); };
      }, []);

      const handleLoadRoster = async (newPlayers, houseNames) => {
        await supabase.from('players').delete().neq('id', 0);
        await supabase.from('houses').delete().neq('id', 0);
        await supabase.from('houses').insert(houseNames.map(name => ({ name, points: 0 })));
        await supabase.from('players').insert(newPlayers.map(p => ({
          student_id: p.studentId, name: p.name, house: p.house, status: p.status, eliminations: p.eliminations, has_golden_dart: p.hasGoldenDart
        })));
      };

      const handleSyncTimesheetRoster = async () => {
        try {
          const { players: rosterPlayers } = await fetchTimesheetRoster();
          const discoveredHouses = Array.from(new Set(rosterPlayers.map(p => p.house)));
          await handleLoadRoster(rosterPlayers, discoveredHouses);
          return { success: true };
        } catch (err) {
          return { success: false };
        }
      };

      // Game State Methods
      const startGame = async () => {
        if (players.length < 2) return;
        const shuffled = [...players].sort(() => Math.random() - 0.5);
        const now = new Date().toISOString();

        await Promise.all(shuffled.map((player, index) =>
          supabase.from('players').update({
            status: 'alive', target_id: shuffled[(index + 1) % shuffled.length].id, eliminations: 0, target_assigned_at: now
          }).eq('id', player.id)
        ));
        await supabase.from('houses').update({ points: 0 }).neq('id', 0);
        await supabase.from('game_state').update({ active: true }).eq('id', 1);
      };

      const endGame = async () => await supabase.from('game_state').update({ active: false }).eq('id', 1);

      const resetGame = async () => {
        await supabase.from('game_state').update({ active: false }).eq('id', 1);
        await supabase.from('houses').update({ points: 0 }).neq('id', 0);
        await supabase.from('players').update({ status: 'alive', target_id: null, eliminations: 0, has_golden_dart: false, target_assigned_at: null }).neq('id', 0);
      };

      const handleElimination = async (eliminatorId, targetId) => {
        const eliminator = players.find(p => p.id === eliminatorId);
        const target = players.find(p => p.id === targetId);
        if (!eliminator || !target || target.status !== 'alive') return;
        const now = new Date().toISOString();

        await supabase.from('players').update({ target_id: target.targetId, eliminations: eliminator.eliminations + 1, target_assigned_at: now }).eq('id', eliminator.id);
        await supabase.from('players').update({ status: 'eliminated', target_id: null }).eq('id', target.id);
        const house = houses.find(h => h.name === eliminator.house);
        if (house) await supabase.from('houses').update({ points: house.points + 10 }).eq('id', house.id);
      };

      const handleGoldenDart = async (playerId) => await supabase.from('players').update({ has_golden_dart: true }).eq('id', playerId);
      const handleRemoveGoldenDart = async (playerId) => await supabase.from('players').update({ has_golden_dart: false }).eq('id', playerId);

      const handleUpdateTarget = async (playerId, newTargetId) => {
        const now = new Date().toISOString();
        await supabase.from('players').update({ target_id: newTargetId, target_assigned_at: now }).eq('id', playerId);
      };

      const stitchRevivedPlayer = async (revivedPlayerId, currentPlayers, dartOwnerId = null) => {
        const alivePlayers = currentPlayers.filter(p => p.status === 'alive' && p.id !== revivedPlayerId);
        if (alivePlayers.length === 0) return currentPlayers;

        let hunter = dartOwnerId && dartOwnerId !== revivedPlayerId ? alivePlayers.find(p => p.id === dartOwnerId) : alivePlayers[Math.floor(Math.random() * alivePlayers.length)];
        if (!hunter) hunter = alivePlayers[0];

        const newTargetForRevived = hunter.targetId;
        const nowStr = new Date().toISOString();

        await supabase.from('players').update({ status: 'alive', target_id: newTargetForRevived, target_assigned_at: nowStr }).eq('id', revivedPlayerId);
        await supabase.from('players').update({ target_id: revivedPlayerId, target_assigned_at: nowStr }).eq('id', hunter.id);
        
        return currentPlayers.map(p => {
            if (p.id === revivedPlayerId) return { ...p, status: 'alive', targetId: newTargetForRevived, targetAssignedAt: nowStr };
            if (p.id === hunter.id) return { ...p, targetId: revivedPlayerId, targetAssignedAt: nowStr };
            return p;
        });
      };

      const handleRevivePlayer = async (playerId) => await stitchRevivedPlayer(playerId, players);
      
      const handleUseGoldenDart = async (ownerId, reviveeId) => {
        await supabase.from('players').update({ has_golden_dart: false }).eq('id', ownerId);
        let currentPlayers = players.map(p => p.id === ownerId ? { ...p, hasGoldenDart: false } : p);
        currentPlayers = await stitchRevivedPlayer(reviveeId, currentPlayers, ownerId);
        setPlayers(currentPlayers);
      };

      const handleRemovePlayer = async (playerId) => {
        const playerToRemove = players.find(p => p.id === playerId);
        if (!playerToRemove) return;
        if (playerToRemove.status === 'alive') {
            const hunter = players.find(p => p.targetId === playerId);
            if (hunter) await supabase.from('players').update({ target_id: playerToRemove.targetId, target_assigned_at: new Date().toISOString() }).eq('id', hunter.id);
        }
        await supabase.from('players').delete().eq('id', playerId);
      };

      const handleSweepExpired = async () => {
          const now = new Date();
          const expired = players.filter(p => {
              if (p.status !== 'alive' || !p.targetAssignedAt) return false;
              return (now - new Date(p.targetAssignedAt)) > 24 * 60 * 60 * 1000;
          });
          if (expired.length === 0) return;
          let currentPlayers = [...players];
          for (const player of expired) {
              const hunter = currentPlayers.find(p => p.targetId === player.id);
              if (hunter) {
                  await supabase.from('players').update({ target_id: player.targetId, target_assigned_at: new Date().toISOString() }).eq('id', hunter.id);
                  currentPlayers = currentPlayers.map(p => p.id === hunter.id ? { ...p, targetId: player.targetId, targetAssignedAt: new Date().toISOString() } : p);
              }
              await supabase.from('players').update({ status: 'eliminated', target_id: null }).eq('id', player.id);
              currentPlayers = currentPlayers.map(p => p.id === player.id ? { ...p, status: 'eliminated', targetId: null } : p);
          }
          setPlayers(currentPlayers);
      };

      const handlePlayerLogin = async (studentId) => {
        const match = players.find(p => p.studentId && p.studentId.toString().trim() === studentId);
        if (!match) return { success: false, message: 'ID not found. See staff.' };
        localStorage.setItem(PLAYER_LOGIN_KEY, studentId);
        setLoggedInStudentId(studentId);
        return { success: true };
      };

      const handlePlayerLogout = () => { localStorage.removeItem(PLAYER_LOGIN_KEY); setLoggedInStudentId(null); };

      const handlePhotoUpload = async (playerId, file) => {
        const ext = (file.name.split('.').pop() || 'jpg').toLowerCase();
        const path = `${playerId}-${Date.now()}.${ext}`;
        const { error: uploadError } = await supabase.storage.from('player-photos').upload(path, file, { upsert: true, contentType: file.type });
        if (uploadError) return { success: false };
        const { data } = supabase.storage.from('player-photos').getPublicUrl(path);
        await supabase.from('players').update({ photo_url: data.publicUrl }).eq('id', playerId);
        return { success: true };
      };

      const renderTabContent = () => {
        switch (activeTab) {
          case 'dashboard': return <DashboardView currentUser={currentUser} players={players} onEliminate={handleElimination} onUseGoldenDart={handleUseGoldenDart} onLogout={handlePlayerLogout} />;
          case 'leaderboard': return <LeaderboardView houses={houses} players={players} />;
          case 'rules': return <RulesView />;
          case 'admin': return isAdminAuthenticated ? (
              <AdminView players={players} houses={houses} gameActive={gameActive} onLoadRoster={handleLoadRoster} onSyncRoster={handleSyncTimesheetRoster} onStartGame={startGame} onEndGame={endGame} onResetGame={resetGame} onGoldenDart={handleGoldenDart} onRemoveGoldenDart={handleRemoveGoldenDart} onPhotoUpload={handlePhotoUpload} onUpdateTarget={handleUpdateTarget} onRevivePlayer={handleRevivePlayer} onRemovePlayer={handleRemovePlayer} onSweepExpired={handleSweepExpired} />
            ) : <AdminLogin onLogin={() => setIsAdminAuthenticated(true)} />;
          default: return null;
        }
      };

      if (!currentUser && activeTab === 'dashboard') {
          return (
             <div className="min-h-screen relative overflow-x-hidden pt-8 md:pt-16 pb-28 md:pb-36 z-10">
                 <PlayerLogin onLogin={handlePlayerLogin} onAdminClick={() => setActiveTab('admin')} />
             </div>
          );
      }

      return (
        <div className="min-h-screen font-sans relative overflow-x-hidden">
          <main className="max-w-6xl mx-auto w-full px-4 pt-6 relative z-10 min-h-[90vh]" style={{ paddingBottom: 'calc(180px + env(safe-area-inset-bottom))' }}>
            {renderTabContent()}
          </main>

          {/* Floating Pill Navigation */}
          <nav className="fixed left-4 right-4 z-50 pointer-events-none flex justify-center" style={{ bottom: 'calc(1.5rem + env(safe-area-inset-bottom))' }}>
            <div className="bg-black/80 backdrop-blur-3xl border border-white/10 p-1.5 md:p-2 rounded-full flex shadow-[0_20px_40px_rgba(0,0,0,0.8)] pointer-events-auto max-w-full overflow-x-auto no-scrollbar">
              {[
                { id: 'dashboard', label: 'Mission', icon: Crosshair },
                { id: 'leaderboard', label: 'Standings', icon: Trophy },
                { id: 'rules', label: 'Rules', icon: ShieldAlert },
                { id: 'admin', label: 'Admin', icon: Settings }
              ].map(tab => (
                <button
                  key={tab.id}
                  onClick={() => setActiveTab(tab.id)}
                  className={`flex items-center gap-1.5 md:gap-2 px-3 md:px-6 py-3 md:py-3.5 font-bold transition-all rounded-full whitespace-nowrap ${
                    activeTab === tab.id
                      ? 'bg-white text-black shadow-lg scale-[1.02]'
                      : 'text-white/80 hover:text-white hover:bg-white/10'
                  }`}
                >
                  <tab.icon size={18} className="shrink-0" />
                  <span className="text-[11px] md:text-sm tracking-wide block">{tab.label}</span>
                </button>
              ))}
            </div>
          </nav>
        </div>
      );
    };

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
