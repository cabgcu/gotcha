<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GOTCHA App</title>

  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- React & ReactDOM -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>

  <!-- Babel for JSX -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>

  <!-- Supabase -->
  <script src="https://unpkg.com/@supabase/supabase-js@2"></script>

  <style>
    body {
      margin: 0;
      background-color: #050505;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      color: #e2e8f0;
      -webkit-font-smoothing: antialiased;
    }

    /* Hide scrollbar for Chrome, Safari and Opera */
    .no-scrollbar::-webkit-scrollbar {
      display: none;
    }
    /* Hide scrollbar for IE, Edge and Firefox */
    .no-scrollbar {
      -ms-overflow-style: none;  /* IE and Edge */
      scrollbar-width: none;  /* Firefox */
    }
  </style>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useMemo } = React;

    // --- Supabase ---
    // Only the publishable (anon) key belongs here: this page is a static,
    // publicly-served file with no backend, so anything embedded in it is
    // visible to anyone. Table access is governed by RLS policies instead.
    const SUPABASE_URL = 'https://nmmshjdknmuzpgpquwec.supabase.co';
    const SUPABASE_ANON_KEY = 'sb_publishable_PCxlxywY7W6K3TmMrSnSsw_NPXKugoZ';
    const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    const PLAYER_LOGIN_KEY = 'gotcha_student_id';

    const fetchHouses = async () => {
      const { data, error } = await supabase.from('houses').select('*').order('name');
      if (error) { console.error('fetchHouses', error); return []; }
      return data.map(h => ({ id: h.id, name: h.name, points: h.points }));
    };

    const fetchPlayers = async () => {
      const { data, error } = await supabase.from('players').select('*').order('name');
      if (error) { console.error('fetchPlayers', error); return []; }
      return data.map(p => ({
        id: p.id,
        name: p.name,
        house: p.house,
        status: p.status,
        targetId: p.target_id,
        eliminations: p.eliminations,
        hasGoldenDart: p.has_golden_dart,
        studentId: p.student_id,
        photoUrl: p.photo_url
      }));
    };

    const fetchGameActive = async () => {
      const { data, error } = await supabase.from('game_state').select('active').eq('id', 1).maybeSingle();
      if (error) { console.error('fetchGameActive', error); return false; }
      return data ? data.active : false;
    };

    // --- Lucide React Components (Manual implementation for CDN usage) ---
    // Normally we'd import these, but via CDN we render SVG strings or use the lucide script.
    // To keep the React component structure clean, we'll wrap the raw SVGs in simple functional components.

    const IconWrapper = ({ name, size = 24, className = '', color = 'currentColor' }) => {
      const iconRef = React.useRef(null);

      React.useEffect(() => {
        if (iconRef.current && window.lucide) {
           window.lucide.createIcons({
             icons: { [name]: window.lucide.icons[name] },
             nameAttr: 'data-lucide',
             attrs: {
               class: className,
               width: size,
               height: size,
               stroke: color
             }
           });
        }
      }, [name, size, className, color]);

      return <i ref={iconRef} data-lucide={name} className={className} style={{ width: size, height: size }}></i>;
    };

    const Crosshair = (props) => <IconWrapper name="crosshair" {...props} />;
    const ShieldAlert = (props) => <IconWrapper name="shield-alert" {...props} />;
    const Trophy = (props) => <IconWrapper name="trophy" {...props} />;
    const Users = (props) => <IconWrapper name="users" {...props} />;
    const Settings = (props) => <IconWrapper name="settings" {...props} />;
    const User = (props) => <IconWrapper name="user" {...props} />;
    const MapPin = (props) => <IconWrapper name="map-pin" {...props} />;
    const Clock = (props) => <IconWrapper name="clock" {...props} />;
    const AlertCircle = (props) => <IconWrapper name="alert-circle" {...props} />;
    const CheckCircle2 = (props) => <IconWrapper name="check-circle-2" {...props} />;
    const Target = (props) => <IconWrapper name="target" {...props} />;
    const Camera = (props) => <IconWrapper name="camera" {...props} />;
    const Star = (props) => <IconWrapper name="star" {...props} />;
    const Upload = (props) => <IconWrapper name="upload" {...props} />;
    const LogOut = (props) => <IconWrapper name="log-out" {...props} />;

    // --- End Icons ---

    const DEFAULT_HOUSES = [
      { id: 'H1', name: 'Gryffindor', points: 0 },
      { id: 'H2', name: 'Slytherin', points: 0 },
      { id: 'H3', name: 'Ravenclaw', points: 0 },
      { id: 'H4', name: 'Hufflepuff', points: 0 }
    ];

    const Button = ({ children, onClick, variant = 'primary', className = '', disabled = false, type = 'button' }) => {
      const baseStyle = "px-4 py-3 rounded-xl font-bold transition-all duration-300 flex items-center justify-center gap-2 backdrop-blur-md";
      const variants = {
        primary: "bg-orange-500/90 hover:bg-orange-500 text-white shadow-[0_0_20px_rgba(249,115,22,0.3)] hover:shadow-[0_0_30px_rgba(249,115,22,0.5)] border border-orange-400/50",
        secondary: "bg-white/10 hover:bg-white/20 text-white border border-white/10",
        danger: "bg-red-500/80 hover:bg-red-500 text-white shadow-[0_0_20px_rgba(239,68,68,0.3)] border border-red-400/50",
        outline: "border-2 border-orange-500/50 text-orange-400 hover:bg-orange-500/20"
      };

      return (
        <button
          type={type}
          onClick={onClick}
          disabled={disabled}
          className={`${baseStyle} ${variants[variant]} ${disabled ? 'opacity-50 cursor-not-allowed shadow-none' : 'active:scale-95'} ${className}`}
        >
          {children}
        </button>
      );
    };

    const Modal = ({ isOpen, onClose, title, children }) => {
      if (!isOpen) return null;
      return (
        <div className="fixed inset-0 bg-black/60 flex items-center justify-center p-4 z-[60] backdrop-blur-md">
          <div className="bg-zinc-900/80 backdrop-blur-2xl border border-white/10 rounded-3xl w-full max-w-md overflow-hidden shadow-2xl">
            <div className="p-5 border-b border-white/10 flex justify-between items-center bg-white/5">
              <h3 className="font-bold text-lg text-white">{title}</h3>
              <button onClick={onClose} className="text-slate-400 hover:text-white transition-colors bg-white/5 w-8 h-8 rounded-full flex items-center justify-center">&times;</button>
            </div>
            <div className="p-6">
              {children}
            </div>
          </div>
        </div>
      );
    };

    const AdminLogin = ({ onLogin }) => {
      const [password, setPassword] = useState('');
      const [error, setError] = useState(false);

      const handleSubmit = (e) => {
        e.preventDefault();
        if (password === 'Staff49!') {
          onLogin();
        } else {
          setError(true);
          setPassword('');
        }
      };

      return (
        <div className="flex flex-col items-center justify-center py-12 px-4">
          <div className="bg-white/5 backdrop-blur-xl border border-white/10 p-8 rounded-3xl w-full max-w-sm shadow-2xl relative overflow-hidden">
            <div className="absolute top-0 left-0 w-full h-1 bg-gradient-to-r from-orange-500 to-red-500"></div>
            <div className="flex justify-center mb-6">
              <div className="p-4 bg-white/5 rounded-full border border-white/10 shadow-[0_0_30px_rgba(249,115,22,0.15)]">
                <ShieldAlert size={36} className="text-orange-500" />
              </div>
            </div>
            <h2 className="text-2xl font-black text-white text-center mb-2">Admin Access</h2>
            <p className="text-slate-400 text-sm text-center mb-8">Enter the staff password to manage the game.</p>

            <form onSubmit={handleSubmit} className="space-y-4">
              <div>
                <input
                  type="password"
                  value={password}
                  onChange={(e) => { setPassword(e.target.value); setError(false); }}
                  placeholder="Enter Password"
                  className={`w-full bg-black/50 border ${error ? 'border-red-500' : 'border-white/10'} rounded-xl p-4 text-white focus:outline-none focus:border-orange-500 transition-colors text-center font-mono`}
                  autoFocus
                />
                {error && <p className="text-red-400 text-xs mt-2 text-center font-bold">Incorrect password.</p>}
              </div>
              <Button type="submit" variant="primary" className="w-full py-4 text-lg mt-2">Authenticate</Button>
            </form>
          </div>
        </div>
      );
    };

    const PlayerLogin = ({ onLogin }) => {
      const [studentId, setStudentId] = useState('');
      const [error, setError] = useState('');
      const [busy, setBusy] = useState(false);

      const handleSubmit = async (e) => {
        e.preventDefault();
        if (!studentId.trim()) return;
        setBusy(true);
        setError('');
        const result = await onLogin(studentId.trim());
        setBusy(false);
        if (!result.success) {
          setError(result.message);
          setStudentId('');
        }
      };

      return (
        <div className="flex flex-col items-center justify-center py-12 px-4">
          <div className="bg-white/5 backdrop-blur-xl border border-white/10 p-8 rounded-3xl w-full max-w-sm shadow-2xl relative overflow-hidden">
            <div className="absolute top-0 left-0 w-full h-1 bg-gradient-to-r from-orange-500 to-red-500"></div>
            <div className="flex justify-center mb-6">
              <div className="p-4 bg-white/5 rounded-full border border-white/10 shadow-[0_0_30px_rgba(249,115,22,0.15)]">
                <Crosshair size={36} className="text-orange-500" />
              </div>
            </div>
            <h2 className="text-2xl font-black text-white text-center mb-2">Enter the Hunt</h2>
            <p className="text-slate-400 text-sm text-center mb-8">Enter your Student ID to start the game and see your target.</p>

            <form onSubmit={handleSubmit} className="space-y-4">
              <div>
                <input
                  type="text"
                  inputMode="numeric"
                  value={studentId}
                  onChange={(e) => { setStudentId(e.target.value); setError(''); }}
                  placeholder="Student ID"
                  className={`w-full bg-black/50 border ${error ? 'border-red-500' : 'border-white/10'} rounded-xl p-4 text-white focus:outline-none focus:border-orange-500 transition-colors text-center font-mono`}
                  autoFocus
                />
                {error && <p className="text-red-400 text-xs mt-2 text-center font-bold">{error}</p>}
              </div>
              <Button type="submit" variant="primary" className="w-full py-4 text-lg mt-2" disabled={busy}>
                {busy ? 'Checking...' : 'Continue'}
              </Button>
            </form>
          </div>
        </div>
      );
    };

    const RulesView = () => (
      <div className="space-y-6 text-slate-300 pb-8">
        <div className="bg-white/5 backdrop-blur-xl p-6 rounded-3xl border border-white/10 shadow-xl">
          <h2 className="text-2xl font-black text-orange-500 mb-4 flex items-center gap-2"><Target /> Objective</h2>
          <p className="leading-relaxed">Each participant begins the game with one assigned target, one official GOTCHA Nerf dart, and a house assignment. Your goal is to eliminate your assigned target, stay in the game, earn points for yourself and your house, and help your house climb the leaderboard. The last two players remaining will win individual prizes, while houses compete for the overall CAB cup.</p>
        </div>

        <div className="grid grid-cols-1 md:grid-cols-2 gap-6">
          <div className="bg-white/5 backdrop-blur-xl p-6 rounded-3xl border border-white/10 shadow-xl">
            <h3 className="text-xl font-bold text-white mb-4 flex items-center gap-2"><Crosshair className="text-orange-500"/> Eliminations</h3>
            <ul className="list-disc pl-5 space-y-3 text-sm">
              <li>Eliminated when struck by the official GOTCHA Nerf dart provided by CAB.</li>
              <li>Dart must be thrown by hand. No blasters/launchers.</li>
              <li>Only the official dart may be used. No replacements.</li>
              <li>Friendly fire does not count.</li>
              <li>Must post elimination in official GroupMe within 15 mins (include photo/proof).</li>
              <li>Once verified, you inherit the target of the person you eliminated.</li>
            </ul>
          </div>

          <div className="bg-white/5 backdrop-blur-xl p-6 rounded-3xl border border-white/10 shadow-xl">
            <h3 className="text-xl font-bold text-white mb-4 flex items-center gap-2"><ShieldAlert className="text-blue-400"/> Safe Zones</h3>
            <p className="text-sm mb-3 font-bold text-blue-300 bg-blue-500/10 inline-block px-3 py-1 rounded-full border border-blue-500/20">Players may NOT be eliminated inside:</p>
            <ul className="grid grid-cols-2 gap-x-4 gap-y-2 text-sm list-disc pl-5">
              <li>Academic buildings</li>
              <li>Classrooms/Lecture halls</li>
              <li>Residence halls/Apts</li>
              <li>Dorm rooms</li>
              <li>Bathrooms</li>
              <li>Library</li>
              <li>Religious services</li>
              <li>Medical appts</li>
              <li>Vehicles</li>
              <li>Dining facilities</li>
            </ul>
            <p className="text-xs mt-4 p-3 bg-white/5 rounded-lg border border-white/10 text-slate-400 text-center">Outdoor campus spaces remain active. Should not interfere with training!</p>
          </div>
        </div>

        <div className="bg-white/5 backdrop-blur-xl p-6 rounded-3xl border border-white/10 shadow-xl">
          <h3 className="text-xl font-bold text-white mb-4 flex items-center gap-2"><AlertCircle className="text-red-500"/> Code of Conduct</h3>
          <div className="grid grid-cols-1 md:grid-cols-2 gap-6 text-sm">
            <div>
              <h4 className="font-bold text-red-400 mb-2 flex items-center gap-2"><span className="w-2 h-2 rounded-full bg-red-500"></span> Respect Rule</h4>
              <ul className="list-disc pl-5 space-y-1.5 text-slate-400">
                <li>No physical contact.</li>
                <li>Do not block entrances/exits.</li>
                <li>Do not follow into restricted areas.</li>
                <li>No harassment or intimidation.</li>
                <li>Must obey staff stop requests immediately.</li>
              </ul>
            </div>
            <div>
              <h4 className="font-bold text-red-400 mb-2 flex items-center gap-2"><span className="w-2 h-2 rounded-full bg-red-500"></span> No Camping</h4>
              <p className="text-slate-400 leading-relaxed">Players may not wait outside residence halls, classroom exits, or workplaces for more than 10 consecutive minutes to eliminate a player.</p>
            </div>
          </div>
        </div>

        <div className="grid grid-cols-1 md:grid-cols-2 gap-6">
           <div className="bg-gradient-to-br from-yellow-500/10 to-transparent backdrop-blur-xl p-6 rounded-3xl border border-yellow-500/20 shadow-xl">
            <h3 className="text-xl font-bold text-white mb-3 flex items-center gap-2"><Star className="text-yellow-400 text-yellow-400" fill="currentColor"/> Golden Dart</h3>
            <p className="text-sm mb-3 text-yellow-200/70">Somewhere on campus... A player who finds it gets:</p>
            <ul className="space-y-2 text-sm text-slate-300">
              <li className="flex items-start gap-2"><div className="mt-1 w-1.5 h-1.5 rounded-full bg-yellow-500 shrink-0"/> <strong>If alive:</strong> Gain one Bonus Life (revive yourself once, or revive another).</li>
              <li className="flex items-start gap-2"><div className="mt-1 w-1.5 h-1.5 rounded-full bg-yellow-500 shrink-0"/> <strong>If eliminated:</strong> Immediately revive and re-enter. Target assigned next morning.</li>
            </ul>
            <div className="mt-4 p-2 bg-yellow-500/20 rounded-lg text-center border border-yellow-500/30">
               <p className="text-xs text-yellow-400 font-bold uppercase tracking-wider">Claimable once per cabbie</p>
            </div>
          </div>

          <div className="bg-white/5 backdrop-blur-xl p-6 rounded-3xl border border-white/10 shadow-xl">
            <h3 className="text-xl font-bold text-white mb-4 flex items-center gap-2"><Clock className="text-green-400"/> Activity & Hours</h3>
            <ul className="list-disc pl-5 space-y-3 text-sm">
              <li><strong>Active Hours:</strong> 8:00 AM – 11:00 PM daily.</li>
              <li><strong>Activity Requirement:</strong> Must eliminate someone within 24 hours of receiving current target, or be eliminated.</li>
              <li>Staff may become active participants to keep game moving.</li>
            </ul>
          </div>
        </div>
      </div>
    );

    const PlayerAvatar = ({ player, size = 96 }) => {
      if (player && player.photoUrl) {
        return (
          <img
            src={player.photoUrl}
            alt={player.name}
            className="rounded-full object-cover border-4 border-white/10 shadow-[0_0_20px_rgba(0,0,0,0.5)]"
            style={{ width: size, height: size }}
          />
        );
      }
      return (
        <div className="bg-black/50 rounded-full flex items-center justify-center border-4 border-white/10 shadow-[0_0_20px_rgba(0,0,0,0.5)]" style={{ width: size, height: size }}>
          <User size={Math.round(size * 0.42)} className="text-slate-400" />
        </div>
      );
    };

    const LeaderboardView = ({ houses, players }) => {
      const sortedHouses = [...houses].sort((a, b) => b.points - a.points);
      const sortedPlayers = [...players].sort((a, b) => b.eliminations - a.eliminations);

      return (
        <div className="space-y-8 pb-8">
          <div>
            <h2 className="text-2xl font-black text-white mb-6 flex items-center gap-3"><Trophy className="text-yellow-500" size={28} /> House Standings</h2>
            <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4">
              {sortedHouses.map((house, idx) => (
                <div key={house.id} className="bg-white/5 backdrop-blur-xl border border-white/10 shadow-xl rounded-3xl p-6 relative overflow-hidden group hover:bg-white/10 transition-colors">
                  <div className="absolute -right-4 -top-4 text-white/5 group-hover:text-white/10 transition-colors duration-500">
                    <Trophy size={100} />
                  </div>
                  <div className="relative z-10">
                    <div className="inline-block px-2 py-1 bg-white/10 rounded-md text-slate-300 font-bold text-xs mb-3 tracking-widest uppercase">Rank #{idx + 1}</div>
                    <div className="text-2xl font-black text-white mb-1">{house.name}</div>
                    <div className="text-4xl font-black text-orange-500 drop-shadow-[0_0_10px_rgba(249,115,22,0.3)]">{house.points} <span className="text-sm font-normal text-slate-400">pts</span></div>
                  </div>
                </div>
              ))}
            </div>
          </div>

          <div>
            <h2 className="text-2xl font-black text-white mb-6 flex items-center gap-3"><Users className="text-blue-400" size={28} /> Top Hunters</h2>
            <div className="bg-white/5 backdrop-blur-xl border border-white/10 rounded-3xl overflow-hidden shadow-xl">
              <div className="overflow-x-auto no-scrollbar">
                <table className="w-full text-left text-sm text-slate-300 min-w-[600px]">
                  <thead className="bg-black/40 text-xs uppercase text-slate-400 font-bold tracking-wider">
                    <tr>
                      <th className="px-6 py-5">Player</th>
                      <th className="px-6 py-5">House</th>
                      <th className="px-6 py-5 text-center">Status</th>
                      <th className="px-6 py-5 text-right">Eliminations</th>
                    </tr>
                  </thead>
                  <tbody className="divide-y divide-white/5">
                    {sortedPlayers.slice(0, 10).map((player, idx) => (
                      <tr key={player.id} className="hover:bg-white/5 transition-colors">
                        <td className="px-6 py-4 font-bold text-white flex items-center gap-3">
                          <span className="flex items-center justify-center w-6 h-6 rounded-full bg-white/10 text-slate-400 text-xs">{idx + 1}</span>
                          <PlayerAvatar player={player} size={32} />
                          <span className="text-base">{player.name}</span>
                        </td>
                        <td className="px-6 py-4 text-slate-300">{player.house}</td>
                        <td className="px-6 py-4 text-center">
                          {player.status === 'alive' ? (
                            <span className="bg-green-500/10 border border-green-500/20 text-green-400 px-3 py-1.5 rounded-full text-xs font-bold inline-block w-24">ALIVE</span>
                          ) : (
                            <span className="bg-red-500/10 border border-red-500/20 text-red-400 px-3 py-1.5 rounded-full text-xs font-bold inline-block w-24">ELIMINATED</span>
                          )}
                        </td>
                        <td className="px-6 py-4 text-right font-black text-orange-500 text-xl">{player.eliminations}</td>
                      </tr>
                    ))}
                    {sortedPlayers.length === 0 && (
                      <tr>
                        <td colSpan="4" className="px-6 py-12 text-center text-slate-500">No players registered yet. The hunt begins soon!</td>
                      </tr>
                    )}
                  </tbody>
                </table>
              </div>
            </div>
          </div>
        </div>
      );
    };

    const DashboardView = ({ currentUser, players, onEliminate, onLogin, onLogout }) => {
      const [isModalOpen, setIsModalOpen] = useState(false);

      if (!currentUser) {
        return <PlayerLogin onLogin={onLogin} />;
      }

      const target = players.find(p => p.id === currentUser.targetId);

      return (
        <div className="max-w-3xl mx-auto space-y-6 pb-12">
          {/* Player Identity Card */}
          <div className="bg-white/5 backdrop-blur-xl rounded-3xl border border-white/10 p-6 flex flex-col md:flex-row items-center justify-between gap-6 relative overflow-hidden shadow-2xl">
            <div className="absolute top-0 left-0 w-full h-1 md:w-2 md:h-full bg-gradient-to-b from-orange-400 to-orange-600"></div>
            <div className="flex flex-col md:flex-row items-center gap-6 z-10 w-full md:w-auto text-center md:text-left">
              <PlayerAvatar player={currentUser} size={96} />
              <div>
                <h1 className="text-3xl font-black text-white tracking-tight">{currentUser.name}</h1>
                <div className="flex flex-wrap justify-center md:justify-start items-center gap-3 mt-3">
                  <span className="bg-white/10 border border-white/10 px-4 py-1.5 rounded-full text-sm font-bold text-slate-200">
                    House {currentUser.house}
                  </span>
                  {currentUser.status === 'alive' ? (
                    <span className="bg-green-500/10 border border-green-500/30 text-green-400 px-4 py-1.5 rounded-full text-sm font-bold flex items-center gap-1.5">
                      <span className="w-2 h-2 rounded-full bg-green-400 animate-pulse"></span> ACTIVE
                    </span>
                  ) : (
                    <span className="bg-red-500/10 border border-red-500/30 text-red-400 px-4 py-1.5 rounded-full text-sm font-bold flex items-center gap-1.5">
                      <AlertCircle size={14} /> ELIMINATED
                    </span>
                  )}
                  <button onClick={onLogout} className="bg-white/5 hover:bg-white/10 border border-white/10 px-3 py-1.5 rounded-full text-xs font-bold text-slate-400 hover:text-white flex items-center gap-1.5 transition-colors">
                    <LogOut size={12} /> Not you?
                  </button>
                </div>
              </div>
            </div>

            <div className="text-center md:text-right z-10 bg-black/30 p-4 rounded-2xl border border-white/5 w-full md:w-auto">
              <div className="text-xs text-slate-400 font-bold uppercase tracking-widest mb-1">Total Kills</div>
              <div className="text-5xl font-black text-orange-500 drop-shadow-[0_0_15px_rgba(249,115,22,0.4)]">{currentUser.eliminations}</div>
            </div>
          </div>

          {currentUser.hasGoldenDart && (
            <div className="bg-gradient-to-r from-yellow-500/20 to-transparent border border-yellow-500/30 p-5 rounded-3xl flex items-center gap-5 shadow-xl backdrop-blur-md">
              <div className="bg-yellow-500/20 text-yellow-400 p-3 rounded-2xl border border-yellow-500/30"><Star size={28} className="text-yellow-400" fill="currentColor" /></div>
              <div>
                <h3 className="text-yellow-400 font-black text-lg">Golden Dart Secured</h3>
                <p className="text-sm text-yellow-100/70 mt-1">You possess a rare Golden Dart. One bonus life is available.</p>
              </div>
            </div>
          )}

          {/* Target Card */}
          {currentUser.status === 'alive' ? (
            <div className="bg-black/40 backdrop-blur-xl rounded-3xl border border-orange-500/30 p-1 shadow-[0_0_30px_rgba(249,115,22,0.15)] relative overflow-hidden group">
              <div className="absolute inset-0 bg-gradient-to-b from-orange-500/5 to-transparent pointer-events-none"></div>
              <div className="bg-white/5 rounded-[22px] p-8 relative overflow-hidden">
                <div className="absolute right-0 top-0 opacity-[0.03] pointer-events-none group-hover:scale-110 transition-transform duration-700">
                  <Target size={280} className="text-white transform translate-x-1/4 -translate-y-1/4" />
                </div>

                <h2 className="text-sm font-bold text-orange-500/80 uppercase tracking-widest mb-6 flex items-center gap-2">
                  <Crosshair size={18} /> Mission Objective
                </h2>

                {target ? (
                  <div className="flex flex-col items-center justify-center py-8 relative z-10">
                    <div className="text-sm text-red-500/80 bg-red-500/10 px-4 py-1 rounded-full border border-red-500/20 uppercase tracking-[0.3em] mb-4 font-bold animate-pulse">WANTED</div>
                    <PlayerAvatar player={target} size={112} />
                    <h3 className="text-5xl md:text-6xl font-black text-white mt-6 mb-3 text-center tracking-tight">{target.name}</h3>
                    <p className="text-xl text-slate-400 mb-10 flex items-center gap-2">
                      <span className="w-1.5 h-1.5 bg-slate-400 rounded-full"></span> House {target.house} <span className="w-1.5 h-1.5 bg-slate-400 rounded-full"></span>
                    </p>

                    <Button variant="primary" className="w-full md:w-auto px-12 py-5 text-lg rounded-2xl" onClick={() => setIsModalOpen(true)}>
                      Confirm Elimination
                    </Button>
                  </div>
                ) : (
                  <div className="text-center py-16 text-slate-500 italic bg-black/20 rounded-2xl border border-white/5 relative z-10">
                    Connecting to network... Awaiting target assignment.
                  </div>
                )}
              </div>
            </div>
          ) : (
            <div className="bg-red-500/10 backdrop-blur-xl rounded-3xl border border-red-500/20 p-10 text-center shadow-xl">
              <div className="w-20 h-20 bg-red-500/20 rounded-full flex items-center justify-center mx-auto mb-6">
                <AlertCircle size={40} className="text-red-400" />
              </div>
              <h2 className="text-3xl font-black text-white mb-3">Eliminated</h2>
              <p className="text-slate-400 max-w-sm mx-auto">Your watch has ended. Better luck next year, or stay alert for a Golden Dart!</p>
            </div>
          )}

          {/* Elimination Modal */}
          <Modal isOpen={isModalOpen} onClose={() => setIsModalOpen(false)} title="Mission Success?">
            <div className="space-y-5">
              <div className="bg-orange-500/10 border border-orange-500/20 p-5 rounded-2xl">
                <p className="text-sm text-orange-200 leading-relaxed">
                  Confirm you have eliminated <strong className="text-white text-base">{target?.name}</strong> using an official hand-thrown dart outside of all designated safe zones.
                </p>
              </div>

              <div className="space-y-2">
                <label className="text-sm font-bold text-slate-400 pl-1">After-Action Report (Optional)</label>
                <textarea
                  className="w-full bg-black/50 border border-white/10 rounded-xl p-4 text-white focus:border-orange-500 focus:ring-1 focus:ring-orange-500 focus:outline-none h-28 resize-none transition-colors"
                  placeholder="E.g., Tagged them leaving the student union..."
                ></textarea>
              </div>

              <div className="bg-white/5 border border-white/10 p-4 rounded-xl flex items-center justify-between">
                 <div className="flex items-center gap-3 text-sm text-slate-300">
                   <Camera size={20} className="text-slate-400" /> Photo proof in GroupMe
                 </div>
                 <span className="text-[10px] bg-orange-500/20 text-orange-400 px-2 py-1 rounded font-bold uppercase tracking-widest border border-orange-500/20">Required</span>
              </div>

              <div className="flex gap-3 pt-2">
                <Button variant="secondary" className="flex-1 py-4" onClick={() => setIsModalOpen(false)}>Cancel</Button>
                <Button variant="primary" className="flex-1 py-4" onClick={() => {
                  onEliminate(currentUser.id, target.id);
                  setIsModalOpen(false);
                }}>Confirm Tag</Button>
              </div>
            </div>
          </Modal>
        </div>
      );
    };

    const AdminView = ({ players, houses, onLoadRoster, startGame, onGoldenDart, onPhotoUpload }) => {
      const [rosterText, setRosterText] = useState("");
      const [message, setMessage] = useState("");
      const [busy, setBusy] = useState(false);
      const [uploadingId, setUploadingId] = useState(null);

      const handleParseRoster = async () => {
        if (!rosterText.trim()) return;

        const lines = rosterText.split('\n');
        const newPlayers = [];
        const discoveredHouses = new Set();

        lines.forEach((line) => {
          if (!line.trim()) return;
          const parts = line.split(',');
          if (parts.length >= 3) {
            const studentId = parts[0].trim();
            const name = parts[1].trim();
            const houseName = parts[2].trim();
            discoveredHouses.add(houseName);

            newPlayers.push({
              studentId,
              name,
              house: houseName,
              status: 'alive',
              eliminations: 0,
              hasGoldenDart: false
            });
          }
        });

        if (newPlayers.length > 0) {
          setBusy(true);
          await onLoadRoster(newPlayers, Array.from(discoveredHouses));
          setBusy(false);
          setMessage(`Successfully loaded ${newPlayers.length} players across ${discoveredHouses.size} houses.`);
        } else {
          setMessage("Failed to parse roster. Please ensure 'Student ID, Name, House' format.");
        }
      };

      const handleGoldenDart = async (playerId) => {
        await onGoldenDart(playerId);
        setMessage(`Golden dart awarded!`);
      };

      const handlePhotoChange = async (playerId, file) => {
        if (!file) return;
        setUploadingId(playerId);
        const result = await onPhotoUpload(playerId, file);
        setUploadingId(null);
        setMessage(result.success ? 'Photo uploaded.' : `Photo upload failed: ${result.message}`);
      };

      return (
        <div className="space-y-8 pb-12">
          <div className="bg-white/5 backdrop-blur-xl p-8 rounded-3xl border border-white/10 shadow-2xl">
            <h2 className="text-2xl font-black text-white mb-6 flex items-center gap-3"><Settings className="text-slate-400"/> Game Setup</h2>
            <div className="space-y-5">
              <div>
                <label className="block text-sm font-bold text-slate-400 mb-3 ml-1">Upload Roster (Format: Student ID, Name, House per line)</label>
                <textarea
                  value={rosterText}
                  onChange={(e) => setRosterText(e.target.value)}
                  placeholder="10234567, John Doe, Gryffindor&#10;10298765, Jane Smith, Slytherin"
                  className="w-full h-40 bg-black/50 border border-white/10 rounded-2xl p-5 text-white focus:border-orange-500 focus:outline-none font-mono text-sm shadow-inner transition-colors"
                ></textarea>
                <p className="text-xs text-slate-500 mt-2 ml-1">Loading a roster resets all players and targets. Upload player photos below afterward.</p>
              </div>

              <div className="flex flex-col sm:flex-row gap-4">
                <Button variant="secondary" onClick={handleParseRoster} disabled={busy} className="flex-1 py-4">
                  {busy ? 'Loading...' : 'Load Roster'}
                </Button>
                <Button variant="primary" onClick={startGame} disabled={players.length < 2} className="flex-1 py-4">
                  Initialize Targets
                </Button>
              </div>

              {message && <div className="p-4 bg-orange-500/10 text-orange-400 rounded-xl border border-orange-500/20 text-sm font-bold text-center">{message}</div>}
            </div>
          </div>

          {players.length > 0 && (
            <div className="bg-white/5 backdrop-blur-xl p-8 rounded-3xl border border-white/10 shadow-2xl overflow-hidden">
              <h2 className="text-xl font-black text-white mb-6">Active Roster</h2>
              <div className="overflow-x-auto -mx-8 px-8 no-scrollbar">
                 <table className="w-full text-left text-sm text-slate-300 min-w-[820px]">
                  <thead className="bg-black/30 text-slate-400 uppercase text-xs tracking-wider">
                    <tr>
                      <th className="p-4 rounded-tl-xl">Photo</th>
                      <th className="p-4">Student ID</th>
                      <th className="p-4">Name</th>
                      <th className="p-4">House</th>
                      <th className="p-4">Target</th>
                      <th className="p-4">Status</th>
                      <th className="p-4 text-right rounded-tr-xl">Actions</th>
                    </tr>
                  </thead>
                  <tbody className="divide-y divide-white/5">
                    {players.map(p => (
                      <tr key={p.id} className="hover:bg-white/5 transition-colors">
                        <td className="p-4">
                          <label className="cursor-pointer inline-flex items-center gap-2 group">
                            <PlayerAvatar player={p} size={40} />
                            <span className="text-slate-500 group-hover:text-orange-400 transition-colors">
                              {uploadingId === p.id ? <span className="text-xs">...</span> : <Upload size={16} />}
                            </span>
                            <input
                              type="file"
                              accept="image/*"
                              className="hidden"
                              disabled={uploadingId === p.id}
                              onChange={(e) => handlePhotoChange(p.id, e.target.files[0])}
                            />
                          </label>
                        </td>
                        <td className="p-4 font-mono text-slate-400">{p.studentId || '—'}</td>
                        <td className="p-4 font-bold text-white">{p.name} {p.hasGoldenDart && <span className="ml-2 text-yellow-500" title="Has Golden Dart">★</span>}</td>
                        <td className="p-4">{p.house}</td>
                        <td className="p-4 font-medium text-orange-400/80">{players.find(t => t.id === p.targetId)?.name || 'Unassigned'}</td>
                        <td className="p-4">
                          {p.status === 'alive' ? <span className="text-green-400 text-xs font-bold bg-green-500/10 px-2 py-1 rounded">ALIVE</span> : <span className="text-red-400 text-xs font-bold bg-red-500/10 px-2 py-1 rounded">DEAD</span>}
                        </td>
                        <td className="p-4 text-right">
                          {!p.hasGoldenDart && p.status === 'alive' && (
                            <button onClick={() => handleGoldenDart(p.id)} className="text-xs bg-yellow-500/10 text-yellow-500 border border-yellow-500/30 px-3 py-1.5 rounded-lg hover:bg-yellow-500/20 transition-colors font-bold uppercase tracking-wider">
                              Give Dart
                            </button>
                          )}
                        </td>
                      </tr>
                    ))}
                  </tbody>
                </table>
              </div>
            </div>
          )}
        </div>
      );
    };

    const App = () => {
      const [activeTab, setActiveTab] = useState('dashboard');
      const [players, setPlayers] = useState([]);
      const [houses, setHouses] = useState(DEFAULT_HOUSES);
      const [loggedInStudentId, setLoggedInStudentId] = useState(() => localStorage.getItem(PLAYER_LOGIN_KEY) || null);
      const [gameActive, setGameActive] = useState(false);
      const [isAdminAuthenticated, setIsAdminAuthenticated] = useState(false);

      const currentUser = players.find(p => p.studentId && p.studentId === loggedInStudentId) || null;

      useEffect(() => {
        let cancelled = false;

        const loadAll = async () => {
          const [h, p, g] = await Promise.all([fetchHouses(), fetchPlayers(), fetchGameActive()]);
          if (cancelled) return;
          setHouses(h.length ? h : DEFAULT_HOUSES);
          setPlayers(p);
          setGameActive(g);
        };
        loadAll();

        const channel = supabase
          .channel('gotcha-sync')
          .on('postgres_changes', { event: '*', schema: 'public', table: 'players' }, () => fetchPlayers().then(p => !cancelled && setPlayers(p)))
          .on('postgres_changes', { event: '*', schema: 'public', table: 'houses' }, () => fetchHouses().then(h => !cancelled && setHouses(h.length ? h : DEFAULT_HOUSES)))
          .on('postgres_changes', { event: '*', schema: 'public', table: 'game_state' }, () => fetchGameActive().then(g => !cancelled && setGameActive(g)))
          .subscribe();

        return () => {
          cancelled = true;
          supabase.removeChannel(channel);
        };
      }, []);

      const handleLoadRoster = async (newPlayers, houseNames) => {
        await supabase.from('players').delete().neq('id', 0);
        await supabase.from('houses').delete().neq('id', 0);
        await supabase.from('houses').insert(houseNames.map(name => ({ name, points: 0 })));
        await supabase.from('players').insert(newPlayers.map(p => ({
          student_id: p.studentId,
          name: p.name,
          house: p.house,
          status: p.status,
          eliminations: p.eliminations,
          has_golden_dart: p.hasGoldenDart
        })));
      };

      const startGame = async () => {
        if (players.length < 2) return;
        const shuffled = [...players].sort(() => Math.random() - 0.5);
        await Promise.all(shuffled.map((player, index) =>
          supabase.from('players').update({
            status: 'alive',
            target_id: shuffled[(index + 1) % shuffled.length].id,
            eliminations: 0
          }).eq('id', player.id)
        ));
        await supabase.from('houses').update({ points: 0 }).neq('id', 0);
        await supabase.from('game_state').update({ active: true }).eq('id', 1);
      };

      const handleElimination = async (eliminatorId, targetId) => {
        const eliminator = players.find(p => p.id === eliminatorId);
        const target = players.find(p => p.id === targetId);
        if (!eliminator || !target || target.status !== 'alive') return;

        await supabase.from('players').update({
          target_id: target.targetId,
          eliminations: eliminator.eliminations + 1
        }).eq('id', eliminator.id);

        await supabase.from('players').update({
          status: 'eliminated',
          target_id: null
        }).eq('id', target.id);

        const house = houses.find(h => h.name === eliminator.house);
        if (house) {
          await supabase.from('houses').update({ points: house.points + 10 }).eq('id', house.id);
        }
      };

      const handleGoldenDart = async (playerId) => {
        await supabase.from('players').update({ has_golden_dart: true }).eq('id', playerId);
      };

      const handlePlayerLogin = async (studentId) => {
        const match = players.find(p => p.studentId && p.studentId.toString().trim() === studentId);
        if (!match) {
          return { success: false, message: 'Student ID not found. See a staff member if you believe this is an error.' };
        }
        localStorage.setItem(PLAYER_LOGIN_KEY, studentId);
        setLoggedInStudentId(studentId);
        return { success: true };
      };

      const handlePlayerLogout = () => {
        localStorage.removeItem(PLAYER_LOGIN_KEY);
        setLoggedInStudentId(null);
      };

      const handlePhotoUpload = async (playerId, file) => {
        const ext = (file.name.split('.').pop() || 'jpg').toLowerCase();
        const path = `${playerId}-${Date.now()}.${ext}`;
        const { error: uploadError } = await supabase.storage.from('player-photos').upload(path, file, { upsert: true, contentType: file.type });
        if (uploadError) return { success: false, message: uploadError.message };
        const { data } = supabase.storage.from('player-photos').getPublicUrl(path);
        const { error: updateError } = await supabase.from('players').update({ photo_url: data.publicUrl }).eq('id', playerId);
        if (updateError) return { success: false, message: updateError.message };
        return { success: true };
      };

      const renderTabContent = () => {
        switch (activeTab) {
          case 'dashboard':
            return <DashboardView currentUser={currentUser} players={players} onEliminate={handleElimination} onLogin={handlePlayerLogin} onLogout={handlePlayerLogout} />;
          case 'leaderboard':
            return <LeaderboardView houses={houses} players={players} />;
          case 'rules':
            return <RulesView />;
          case 'admin':
            return isAdminAuthenticated ? (
              <AdminView players={players} houses={houses} onLoadRoster={handleLoadRoster} startGame={startGame} onGoldenDart={handleGoldenDart} onPhotoUpload={handlePhotoUpload} />
            ) : (
              <AdminLogin onLogin={() => setIsAdminAuthenticated(true)} />
            );
          default:
            return null;
        }
      };

      return (
        <div className="min-h-screen bg-[#050505] font-sans text-slate-200 relative selection:bg-orange-500/30 overflow-x-hidden">
          {/* Ambient glowing orbs for frosted glass effect */}
          <div className="fixed top-[-10%] left-[-10%] w-[60vw] h-[60vw] rounded-full bg-orange-600/10 blur-[120px] pointer-events-none"></div>
          <div className="fixed bottom-[-10%] right-[-10%] w-[60vw] h-[60vw] rounded-full bg-blue-600/10 blur-[120px] pointer-events-none"></div>
          <div className="fixed top-[40%] left-[30%] w-[40vw] h-[40vw] rounded-full bg-purple-600/5 blur-[120px] pointer-events-none"></div>

          <div className="relative z-10 flex flex-col min-h-screen">
            {/* Header - Glassmorphism */}
            <header className="bg-white/[0.02] backdrop-blur-2xl border-b border-white/10 sticky top-0 z-40">
              <div className="max-w-6xl mx-auto px-4 h-16 md:h-20 flex items-center justify-between">
                <div className="flex items-center gap-3">
                  <img
                    src="https://i.imgur.com/p2qZOL5.png"
                    alt="GOTCHA Logo"
                    className="h-10 w-10 md:h-12 md:w-12 rounded-xl object-contain drop-shadow-[0_0_10px_rgba(249,115,22,0.5)]"
                  />
                  <span className="text-2xl md:text-3xl font-black tracking-tight text-white drop-shadow-md">GOTCHA</span>
                </div>

                {currentUser ? (
                  <div className="flex items-center gap-3 bg-black/40 py-1.5 pl-2 pr-4 rounded-xl border border-white/10 shadow-inner">
                    <PlayerAvatar player={currentUser} size={32} />
                    <span className="text-sm font-bold text-white hidden sm:inline">{currentUser.name}</span>
                    <button onClick={handlePlayerLogout} title="Log out" className="text-slate-400 hover:text-white transition-colors">
                      <LogOut size={16} />
                    </button>
                  </div>
                ) : (
                  <div className="text-xs font-bold text-slate-500 uppercase tracking-widest hidden sm:block">Enter your Student ID on Mission tab</div>
                )}
              </div>
            </header>

            {/* Navigation - Fixed bottom on mobile, sticky top on desktop */}
            <nav className="fixed bottom-0 left-0 right-0 z-50 bg-black/70 backdrop-blur-2xl border-t border-white/10 md:sticky md:top-20 md:bg-white/[0.02] md:border-b md:border-t-0 md:backdrop-blur-xl">
              <div className="max-w-6xl mx-auto flex justify-around md:justify-start px-2 py-2 md:py-0 md:px-4">
                {[
                  { id: 'dashboard', label: 'Mission', icon: User },
                  { id: 'leaderboard', label: 'Standings', icon: Trophy },
                  { id: 'rules', label: 'Rules', icon: ShieldAlert },
                  { id: 'admin', label: 'Admin', icon: Settings }
                ].map(tab => (
                  <button
                    key={tab.id}
                    onClick={() => setActiveTab(tab.id)}
                    className={`flex flex-col md:flex-row items-center justify-center gap-1 md:gap-3 px-3 py-3 md:px-6 md:py-5 font-bold transition-all w-full md:w-auto md:border-b-2 ${
                      activeTab === tab.id
                        ? 'text-orange-400 md:border-orange-500 bg-white/5 md:bg-orange-500/10 rounded-xl md:rounded-none'
                        : 'text-slate-400 hover:text-white border-transparent hover:bg-white/5 rounded-xl md:rounded-none'
                    }`}
                  >
                    <tab.icon size={20} className={activeTab === tab.id ? 'drop-shadow-[0_0_8px_rgba(249,115,22,0.6)]' : ''} />
                    <span className="text-[10px] md:text-sm tracking-wide">{tab.label}</span>
                  </button>
                ))}
              </div>
            </nav>

            {/* Main Content Area - Padding bottom applied for mobile nav */}
            <main className="flex-1 max-w-6xl mx-auto w-full px-4 pt-8 pb-28 md:pb-12 relative z-10">
              {renderTabContent()}
            </main>
          </div>
        </div>
      );
    };

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
