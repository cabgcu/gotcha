  <style>
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

    body {
      margin: 0;
      font-family: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: #000000;
      color: #e5e5e5;
      -webkit-font-smoothing: antialiased;
    }

    /* Hide scrollbar for Chrome, Safari and Opera */
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

    /* Custom scrollbar */
    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-track { background: rgba(255,255,255,0.05); }
    ::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.2); border-radius: 10px; }
    ::-webkit-scrollbar-thumb:hover { background: rgba(255,255,255,0.4); }

    /* BLACK MONOCHROMATIC BACKGROUND */
    .black-bg {
        position: fixed;
        inset: 0;
        width: 100vw;
        height: 100vh;
        background: radial-gradient(circle at 50% 0%, #111111 0%, #000000 70%);
        z-index: -2;
    }

    /* BLACK GLASS CARDS */
    .black-glass-card {
        background: rgba(20, 20, 20, 0.4);
        backdrop-filter: blur(40px);
        -webkit-backdrop-filter: blur(40px);
        border: 1px solid rgba(255, 255, 255, 0.1);
        border-top: 1px solid rgba(255, 255, 255, 0.15);
        box-shadow: 0 30px 60px rgba(0, 0, 0, 0.8), inset 0 1px 0 rgba(255, 255, 255, 0.05);
    }

    .black-glass-card-subtle {
        background: rgba(30, 30, 30, 0.3);
        backdrop-filter: blur(25px);
        -webkit-backdrop-filter: blur(25px);
        border: 1px solid rgba(255, 255, 255, 0.08);
        border-top: 1px solid rgba(255, 255, 255, 0.12);
    }

    /* LOGO RADIAL GLOW */
    .logo-box {
        position: relative;
        display: flex;
        justify-content: center;
        align-items: center;
    }

    .logo-box::before {
        content: "";
        position: absolute;
        width: 120px;
        height: 120px;
        border-radius: 50%;
        background: radial-gradient(circle, rgba(255, 255, 255, 0.2), transparent 70%);
        filter: blur(25px);
        animation: logoGlowPulse 4s infinite ease-in-out;
        pointer-events: none;
    }

    @keyframes logoGlowPulse {
        0%, 100% { transform: scale(1); opacity: 0.5; }
        50% { transform: scale(1.1); opacity: 0.8; }
    }

    /* SOLID WHITE BUTTONS */
    .black-btn-primary {
        background: #ffffff;
        color: #000000;
        box-shadow: 0 10px 25px rgba(255, 255, 255, 0.15);
        transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    }
    .black-btn-primary:hover:not(:disabled) {
        transform: translateY(-2px);
        box-shadow: 0 15px 35px rgba(255, 255, 255, 0.25);
        background: #f0f0f0;
    }

    /* SECONDARY BUTTONS */
    .black-btn-link {
        background: rgba(255, 255, 255, 0.05);
        backdrop-filter: blur(12px);
        -webkit-backdrop-filter: blur(12px);
        border: 1px solid rgba(255, 255, 255, 0.1);
        color: #ffffff;
        transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    }
    .black-btn-link:hover:not(:disabled) {
        background: rgba(255, 255, 255, 0.1);
        border-color: rgba(255, 255, 255, 0.2);
    }

    /* INPUT STYLES */
    .control-input {
        width: 100%;
        background: rgba(0, 0, 0, 0.4);
        border: 1px solid rgba(255, 255, 255, 0.15);
        color: #ffffff;
        border-radius: 9999px;
        padding: 1rem 1.25rem;
        outline: none;
        transition: all 0.3s ease;
        font-size: 1rem;
    }
    .control-input::placeholder { color: rgba(255, 255, 255, 0.3); }
    .control-input:focus {
        border-color: rgba(255, 255, 255, 0.5);
        background: rgba(20, 20, 20, 0.8);
        box-shadow: 0 0 20px rgba(255, 255, 255, 0.1);
    }
    .control-input.border-red-500 { border-color: #ef4444; }

    /* Bottom Sheet Animation for Mobile */
    @keyframes slideUp {
        from { transform: translateY(100%); opacity: 0; }
        to { transform: translateY(0); opacity: 1; }
    }
    .animate-slide-up { animation: slideUp 0.4s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
    
    /* Target Reveal Blur Animation */
    .motion-blur { filter: blur(2px); transform: scale(1.02); opacity: 0.8; }

    /* Taunt Emoji Pop */
    @keyframes tauntPop {
        0% { opacity: 0; transform: scale(0.3) translateY(10px); }
        15% { opacity: 1; transform: scale(1.25) translateY(0); }
        25% { transform: scale(1) translateY(0); }
        80% { opacity: 1; transform: scale(1) translateY(-10px); }
        100% { opacity: 0; transform: scale(0.9) translateY(-40px); }
    }
    .animate-taunt-pop { animation: tauntPop 2.6s cubic-bezier(0.34, 1.56, 0.64, 1) forwards; }
  </style>

    const fetchGameActive = async () => {
      const { data, error } = await supabase.from('game_state').select('active').eq('id', 1).maybeSingle();

    const fetchTimesheetRoster = async () => {
      const { data: settingRow, error: settingsError } = await supabase.from('settings').select('value').eq('key', 'ActiveYear').maybeSingle();

      const activeYear = settingRow && settingRow.value;

      const { data: rosterRows, error: rosterError } = await supabase.from('roster').select('student_id, name, team').eq('academic_year', activeYear).order('name');

        activeYear,
        players: rosterRows.map(r => ({
          studentId: r.student_id,

          house: r.team,
          status: 'alive',
          eliminations: 0,

    const IconWrapper = ({ name, size = 24, className = '', color = 'currentColor' }) => {
      const iconRef = useRef(null);
      useEffect(() => {
        if (iconRef.current && window.lucide && window.lucide.icons) {
           const pascalName = name.replace(/(^\w|-\w)/g, c => c.replace('-', '').toUpperCase());
           const iconData = window.lucide.icons[pascalName] || window.lucide.icons[name];
           if (!iconData) return;
           window.lucide.createIcons({
             icons: { [name]: iconData },
             nameAttr: 'data-lucide',
             attrs: { class: className, width: size, height: size, stroke: color }
           });

      }, [name, size, className, color]);
      return <i ref={iconRef} data-lucide={name} className={className} style={{ width: size, height: size }}></i>;

    const DEFAULT_HOUSES = [

    const Button = ({ children, onClick, variant = 'primary', className = '', disabled = false, type = 'button' }) => {

    const Modal = ({ isOpen, onClose, title, children }) => {

              {children}
            </div>

        </div>,
        document.body
      );
    };

    const Fireworks = ({ onComplete }) => {
      const canvasRef = useRef(null);
      const onCompleteRef = useRef(onComplete);
      onCompleteRef.current = onComplete;

      useEffect(() => {
        const canvas = canvasRef.current;
        const ctx = canvas.getContext('2d');
        const dpr = window.devicePixelRatio || 1;

        const resize = () => {
          canvas.width = window.innerWidth * dpr;
          canvas.height = window.innerHeight * dpr;
          canvas.style.width = window.innerWidth + 'px';
          canvas.style.height = window.innerHeight + 'px';
          ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
        };
        resize();
        window.addEventListener('resize', resize);

        const COLORS = ['#ffffff', '#ffd23f', '#ff6b6b', '#4ecdc4', '#c77dff', '#ffa5ab'];
        const DURATION = 3200;
        let rockets = [];
        let particles = [];
        let lastLaunch = 0;
        let animationId;
        const startTime = performance.now();

        const spawnBurst = (x, y) => {
          const color = COLORS[Math.floor(Math.random() * COLORS.length)];
          const count = 40 + Math.floor(Math.random() * 20);
          for (let i = 0; i < count; i++) {
            const angle = (Math.PI * 2 * i) / count + Math.random() * 0.3;
            const speed = 2 + Math.random() * 4;
            particles.push({
              x, y,
              vx: Math.cos(angle) * speed,
              vy: Math.sin(angle) * speed,
              alpha: 1,
              color,
              size: 1.5 + Math.random() * 1.5
            });
          }
        };

        const launchRocket = () => {
          const x = window.innerWidth * (0.15 + Math.random() * 0.7);
          const targetY = window.innerHeight * (0.15 + Math.random() * 0.35);
          rockets.push({ x, y: window.innerHeight, targetY, vy: -(8 + Math.random() * 3) });
        };

        const tick = (now) => {
          const elapsed = now - startTime;
          ctx.clearRect(0, 0, window.innerWidth, window.innerHeight);

          if (elapsed < DURATION * 0.7 && now - lastLaunch > 220) {
            launchRocket();
            lastLaunch = now;
          }

          rockets = rockets.filter(r => {
            r.y += r.vy;
            ctx.globalAlpha = 0.9;
            ctx.fillStyle = '#ffffff';
            ctx.beginPath();
            ctx.arc(r.x, r.y, 2, 0, Math.PI * 2);
            ctx.fill();
            if (r.y <= r.targetY) {
              spawnBurst(r.x, r.y);
              return false;
            }
            return true;
          });

          particles = particles.filter(p => {
            p.x += p.vx;
            p.y += p.vy;
            p.vy += 0.05;
            p.vx *= 0.98;
            p.alpha -= 0.014;
            if (p.alpha <= 0) return false;
            ctx.globalAlpha = Math.max(p.alpha, 0);
            ctx.fillStyle = p.color;
            ctx.beginPath();
            ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
            ctx.fill();
            return true;
          });
          ctx.globalAlpha = 1;

          if (elapsed < DURATION || particles.length > 0 || rockets.length > 0) {
            animationId = requestAnimationFrame(tick);
          } else {
            onCompleteRef.current();
          }
        };
        animationId = requestAnimationFrame(tick);

        return () => {
          cancelAnimationFrame(animationId);
          window.removeEventListener('resize', resize);
        };
      }, []);

      return ReactDOM.createPortal(
        <canvas ref={canvasRef} className="fixed inset-0 z-[80] pointer-events-none" />,
        document.body
      );
    };

          <div className="black-glass-card p-8 sm:p-10 rounded-[40px] w-full max-w-sm shadow-2xl relative overflow-hidden text-center">
            <div className="logo-box mb-8 justify-center">
                <div className="relative z-10 flex items-center justify-center">
                  <img src="https://i.imgur.com/p2qZOL5.png" alt="GOTCHA Logo" className="w-28 h-28 object-contain drop-shadow-2xl" />

              <div className="mt-8 pt-6 border-t border-white/10">

    const DashboardView = ({ currentUser, players, onEliminate, onUseGoldenDart, onAcquireTarget, onLogout }) => {
      const [isModalOpen, setIsModalOpen] = useState(false);
      const [isDartModalOpen, setIsDartModalOpen] = useState(false);
      const [isRevealing, setIsRevealing] = useState(false);
      const [spinDisplay, setSpinDisplay] = useState(null);
      const [timeLeft, setTimeLeft] = useState(null);
      const [reviveTargetId, setReviveTargetId] = useState("");
      const [showFireworks, setShowFireworks] = useState(false);
      const [tauntSentFlash, setTauntSentFlash] = useState(false);
      const [floatingTaunts, setFloatingTaunts] = useState([]);

      const target = useMemo(() => players.find(p => p.id === currentUser?.targetId), [players, currentUser]);
      const eliminatedPlayers = useMemo(() => players.filter(p => p.status === 'eliminated'), [players]);
      const aliveCount = useMemo(() => players.filter(p => p.status === 'alive').length, [players]);
      const myHunter = useMemo(() => players.find(p => p.targetId === currentUser?.id && p.id !== currentUser?.id), [players, currentUser]);
      const isTrueWinner = currentUser && currentUser.targetId === currentUser.id && aliveCount <= 1;
      
      const needsAcquire = !!(currentUser && currentUser.status === 'alive' && currentUser.targetId && currentUser.targetId !== currentUser.id && !currentUser.targetAcquiredAt);

      // Target Reveal Spin Animation
      useEffect(() => {
        if (!currentUser) return;
        const key = `target_seen_${currentUser.id}_${currentUser.targetId}`;

        if (currentUser.targetId && currentUser.targetId !== currentUser.id && currentUser.targetAcquiredAt && !localStorage.getItem(key)) {
          setIsRevealing(true);
          
          const pool = players.filter(p => p.id !== currentUser.id);
          if (pool.length === 0 && target) pool.push(target);
          if (pool.length === 0) pool.push(currentUser);

          let spins = 0;
          const maxSpins = 25;
          let currentDelay = 50;

          const spin = () => {
            spins++;
            if (spins >= maxSpins) {
              setSpinDisplay(target);
              setIsRevealing(false);
              localStorage.setItem(key, 'true'); 
            } else {
              setSpinDisplay(pool[Math.floor(Math.random() * pool.length)]);
              if (spins > maxSpins * 0.6) currentDelay = currentDelay * 1.2;
              setTimeout(spin, currentDelay);
            }
          };
          spin();
          return () => {};
        }
      }, [currentUser, target, players]);

      // Server-backed 24-hour Expiration Timer
      useEffect(() => {
        if (!currentUser || !currentUser.targetId || currentUser.targetId === currentUser.id || isRevealing || !currentUser.targetAcquiredAt) {
          setTimeLeft(null);
          return;
        }

        const deadline = new Date(currentUser.targetAcquiredAt).getTime() + (24 * 60 * 60 * 1000);

        const updateTimer = () => {
          const now = Date.now();
          const diff = deadline - now;
          
          if (diff <= 0) {
            setTimeLeft("00:00:00");
            return false;
          } else {
            const h = Math.floor(diff / (1000 * 60 * 60)).toString().padStart(2, '0');
            const m = Math.floor((diff % (1000 * 60 * 60)) / (1000 * 60)).toString().padStart(2, '0');
            const s = Math.floor((diff % (1000 * 60)) / 1000).toString().padStart(2, '0');
            setTimeLeft(`${h}:${m}:${s}`);
            return true;
          }
        };

        const keepGoing = updateTimer();
        if (!keepGoing) return;

        const timerId = setInterval(() => {
          if (!updateTimer()) clearInterval(timerId);
        }, 1000);

        return () => clearInterval(timerId);
      }, [currentUser, isRevealing]);

      // Poll for anonymous taunts
      useEffect(() => {
        if (!currentUser) return;
        let cancelled = false;
        const checkTaunts = async () => {
          const { data } = await supabase.from('taunts').select('id, emoji').eq('recipient_id', currentUser.id).eq('seen', false).order('created_at', { ascending: true });
          if (cancelled || !data || data.length === 0) return;
          const newOnes = data.map(t => ({
            key: `${t.id}-${Math.random()}`,
            emoji: t.emoji,
            left: 5 + Math.random() * 80,
            top: 8 + Math.random() * 70,
            rotate: -20 + Math.random() * 40,
            delay: Math.random() * 500
          }));
          setFloatingTaunts(prev => [...prev, ...newOnes]);
          await supabase.from('taunts').update({ seen: true }).in('id', data.map(t => t.id));
          newOnes.forEach(item => {
            setTimeout(() => {
              setFloatingTaunts(prev => prev.filter(f => f.key !== item.key));
            }, item.delay + 2600);
          });
        };
        checkTaunts();
        const interval = setInterval(checkTaunts, 5000);
        return () => { cancelled = true; clearInterval(interval); };
      }, [currentUser?.id]);

      const sendTaunt = async (emoji) => {
        if (!myHunter) return;
        setTauntSentFlash(true);
        setTimeout(() => setTauntSentFlash(false), 1500);

                <AlertCircle size={32} className="text-red-500 sm:w-10 sm:h-10" />

              <h2 className="text-2xl sm:text-4xl font-black text-white mb-2 sm:mb-3 tracking-tight">Eliminated</h2>
              <p className="text-white/50 text-xs sm:text-base max-w-sm mx-auto leading-relaxed font-medium">Your watch has ended. Better luck next year, or stay alert for a Golden Dart.</p>
            </div>
          )}

          {/* Golden Dart Modal */}
          <Modal isOpen={isDartModalOpen} onClose={() => setIsDartModalOpen(false)} title="Deploy Golden Dart">
            <div className="space-y-6">
              <p className="text-sm text-white/60 leading-relaxed font-medium">

              <div className="space-y-4">

                <select 
                  className="control-input !rounded-2xl appearance-none bg-black/60"
                  value={reviveTargetId}
                  onChange={(e) => setReviveTargetId(e.target.value)}
                >
                  <option value="">-- Select an eliminated player --</option>
                  {currentUser.status === 'eliminated' && <option value={currentUser.id}>Myself ({currentUser.name})</option>}
                  {eliminatedPlayers.filter(p => p.id !== currentUser.id).map(p => (

                  ))}
                </select>

              <div className="flex gap-3 pt-2">
                <Button variant="secondary" className="flex-1" onClick={() => setIsDartModalOpen(false)}>Cancel</Button>
                <Button variant="primary" className="flex-1" disabled={!reviveTargetId} onClick={() => {
                  onUseGoldenDart(currentUser.id, reviveTargetId);

                  setReviveTargetId("");

                 <Camera size={18} className="text-white/50" />

                <Button variant="primary" className="flex-1" onClick={() => {
                  onEliminate(currentUser.id, target.id);

            {/* Mobile Stacked Cards */}
            <div className="md:hidden space-y-3">
              {sortedPlayers.slice(0, 10).map((player, idx) => (
                <div key={player.id} className="black-glass-card-subtle p-4 rounded-[24px] flex items-center gap-4">
                  <div className="text-white/30 text-[10px] font-black w-3 text-center">{idx + 1}</div>
                  <PlayerAvatar player={player} size={48} />

                    <div className="text-[10px] text-white/50 font-bold uppercase tracking-widest mt-0.5">{player.house}</div>
                  </div>
                  <div className="text-right">

                  </div>
                </div>
              ))}
            </div>
          </div>
        </div>
      );
    };

    const getPlayerTimerInfo = (player, now) => {
      if (player.status !== 'alive') return { label: '—', pct: null, tone: 'muted' };
      if (player.targetId === player.id) return { label: 'Winner', pct: 100, tone: 'win' };
      if (!player.targetId) return { label: 'No timer', pct: null, tone: 'muted' };
      if (!player.targetAcquiredAt) return { label: 'Awaiting acquire', pct: null, tone: 'muted' };
      const totalMs = 24 * 60 * 60 * 1000;
      const deadline = new Date(player.targetAcquiredAt).getTime() + totalMs;
      const diff = deadline - now;
      if (diff <= 0) return { label: 'Expired', pct: 100, tone: 'expired' };
      const pct = Math.min(100, Math.max(0, Math.round(((totalMs - diff) / totalMs) * 100)));
      const h = Math.floor(diff / (1000 * 60 * 60));
      const m = Math.floor((diff % (1000 * 60 * 60)) / (1000 * 60));
      const tone = diff < 2 * 60 * 60 * 1000 ? 'urgent' : 'normal';
      return { label: `${h}h ${m}m left`, pct, tone };
    };

    const TIMER_TONE_STYLES = {
      expired: { bar: 'bg-red-500', text: 'text-red-400' },
      urgent: { bar: 'bg-amber-400', text: 'text-amber-400' },
      win: { bar: 'bg-white', text: 'text-white' },
      normal: { bar: 'bg-emerald-400', text: 'text-white/60' },
      muted: { bar: 'bg-white/20', text: 'text-white/30' }
    };

    const TimerReadout = ({ player, now, className = '' }) => {
      const info = getPlayerTimerInfo(player, now);
      const style = TIMER_TONE_STYLES[info.tone];
      return (
        <div className={className}>
          <div className={`text-[10px] font-bold uppercase tracking-wider ${style.text}`}>{info.label}</div>
          {info.pct !== null && (
            <div className="h-1.5 w-24 bg-white/10 rounded-full overflow-hidden mt-1">
              <div className={`h-full ${style.bar} rounded-full`} style={{ width: `${info.pct}%` }}></div>
            </div>
          )}
        </div>
      );
    };

    const AdminView = ({ players, houses, gameActive, onLoadRoster, onSyncRoster, onStartGame, onEndGame, onResetGame, onGoldenDart, onRemoveGoldenDart, onPhotoUpload, onUpdateTarget, onRevivePlayer, onRemovePlayer, onEliminatePlayer, onSweepExpired }) => {
      const [syncing, setSyncing] = useState(false);
      const [isResetModalOpen, setIsResetModalOpen] = useState(false);
      const [managingPlayerId, setManagingPlayerId] = useState(null);
      const [isDeletingPlayer, setIsDeletingPlayer] = useState(false);
      const [eliminatingPlayerId, setEliminatingPlayerId] = useState(null);
      const [autoSweep, setAutoSweep] = useState(false);
      const [now, setNow] = useState(Date.now());

      const managingPlayer = useMemo(() => players.find(p => p.id === managingPlayerId), [players, managingPlayerId]);
      const eliminatingPlayer = useMemo(() => players.find(p => p.id === eliminatingPlayerId), [players, eliminatingPlayerId]);

      // Keep the 24h timer readouts below live
      useEffect(() => {
        const id = setInterval(() => setNow(Date.now()), 30000);
        return () => clearInterval(id);
      }, []);

      // Keep latest values available to the interval below without tearing it down on every poll
      const playersRef = useRef(players);
      useEffect(() => { playersRef.current = players; }, [players]);
      const gameActiveRef = useRef(gameActive);
      useEffect(() => { gameActiveRef.current = gameActive; }, [gameActive]);
      const onSweepExpiredRef = useRef(onSweepExpired);
      useEffect(() => { onSweepExpiredRef.current = onSweepExpired; }, [onSweepExpired]);
      const isSweepingRef = useRef(false);

      // Auto-Sweeper Engine
      useEffect(() => {
        if (!autoSweep) return;
        const interval = setInterval(async () => {
            if (isSweepingRef.current || !gameActiveRef.current || !playersRef.current.length) return;
            const now = new Date();
            const hasExpired = playersRef.current.some(p => {
                if (p.status !== 'alive' || !p.targetAcquiredAt) return false;
                return (now - new Date(p.targetAcquiredAt)) > 24 * 60 * 60 * 1000;
            });
            if (hasExpired) {
              isSweepingRef.current = true;
              try { await onSweepExpiredRef.current(); } finally { isSweepingRef.current = false; }
            }
        }, 30000); // Check every 30 seconds
        return () => clearInterval(interval);
      }, [autoSweep]);

      const handleSyncRoster = async () => {
        setSyncing(true);
        await onSyncRoster();
        setSyncing(false);
      };

      const handlePhotoChange = async (playerId, file) => {
        if (file) await onPhotoUpload(playerId, file);
      };

      return (
        <div className="space-y-6 sm:space-y-8 pb-12 max-w-6xl mx-auto">
          
          {/* Operations Panel */}
          <div className="black-glass-card p-6 sm:p-10 rounded-[32px] sm:rounded-[40px] shadow-2xl">
            <h2 className="text-2xl font-black text-white mb-6 sm:mb-8 tracking-tight flex items-center gap-3"><Settings/> Game Operations</h2>
            <div className="space-y-6">
              
              {/* Reset Game Modal */}
              <Modal isOpen={isResetModalOpen} onClose={() => setIsResetModalOpen(false)} title="CRITICAL: Factory Reset Game">
                <div className="space-y-6">
                  <div className="bg-red-500/10 border border-red-500/20 p-5 rounded-2xl flex gap-4">
                    <AlertCircle className="text-red-500 shrink-0 mt-0.5" />
                    <p className="text-sm text-red-200/80 font-medium leading-relaxed">
                      Are you absolutely sure you want to completely reset the game? This action will wipe all eliminations, remove current targets, revive all players, and reset house points to zero. This action cannot be undone.
                    </p>
                  </div>
                  <div className="flex gap-3 pt-2">
                    <Button variant="secondary" className="flex-1" onClick={() => setIsResetModalOpen(false)}>Cancel</Button>
                    <Button variant="danger" className="flex-1" onClick={() => { onResetGame(); setIsResetModalOpen(false); }}>Yes, Reset Game</Button>
                  </div>
                </div>
              </Modal>

              {/* Game Lifecycle Controls */}
              <div className="black-glass-card-subtle p-5 sm:p-6 rounded-[28px] sm:rounded-[32px]">
                <h3 className="text-[10px] sm:text-xs font-bold text-white/40 uppercase tracking-widest mb-4">Lifecycle Controls</h3>
                <div className="grid grid-cols-1 md:grid-cols-2 gap-3 sm:gap-4">
                  <Button variant={gameActive ? "secondary" : "primary"} onClick={onStartGame} disabled={players.length < 2 || gameActive}>
                    {gameActive ? 'Game is Active' : 'Start Game (Assign Targets)'}
                  </Button>
                  <Button variant="outline" onClick={onEndGame} disabled={!gameActive}>Pause / End Game</Button>
                  
                  <div className="md:col-span-2 mt-4 pt-4 border-t border-white/10 flex flex-col sm:flex-row items-center justify-between gap-4">
                    <div>
                      <h4 className="text-sm font-bold text-white flex items-center gap-2"><Clock size={16}/> Auto-Sweep Engine: {autoSweep ? <span className="text-emerald-400">ON</span> : <span className="text-white/40">OFF</span>}</h4>
                      <p className="text-xs text-white/50 mt-1 max-w-sm">Automatically scans and eliminates expired players every 30s while ON. Re-stitches hunters fairly.</p>
                    </div>
                    <Button variant={autoSweep ? "primary" : "secondary"} onClick={() => setAutoSweep(!autoSweep)} className="w-full sm:w-auto">
                      {autoSweep ? 'Disable Auto-Sweep' : 'Enable Auto-Sweep'}
                    </Button>
                  </div>

                  <div className="md:col-span-2 mt-4 pt-4 border-t border-white/10 flex justify-end">
                    <button onClick={() => setIsResetModalOpen(true)} className="text-xs font-bold text-red-500 hover:text-red-400 uppercase tracking-widest transition-colors py-2 px-4 rounded-full hover:bg-red-500/10">Factory Reset</button>
                  </div>
                </div>
              </div>

              {/* Roster Sync */}
              <div className="bg-white/5 border border-white/10 p-5 sm:p-6 rounded-[28px] sm:rounded-[32px] flex flex-col sm:flex-row items-center justify-between gap-4">
                <div>
                  <h3 className="text-white font-bold text-sm sm:text-base">Sync from Timesheet Roster</h3>
                  <p className="text-xs sm:text-sm text-white/50 mt-1 font-medium">Pulls the active year's roster (Student ID, name, team) directly from database.</p>
                </div>
                <Button variant="secondary" onClick={handleSyncRoster} disabled={syncing} className="w-full sm:w-auto">
                  {syncing ? 'Syncing...' : 'Sync Roster'}
                </Button>
              </div>
            </div>
          </div>

          {/* Active Roster List */}
          {players.length > 0 && (
            <div className="black-glass-card rounded-[32px] sm:rounded-[40px] shadow-2xl overflow-hidden pb-4">
              <div className="p-6 sm:p-10 pb-4 border-b border-white/5">
                <h2 className="text-xl sm:text-2xl font-black text-white tracking-tight">Player Management</h2>
              </div>
              
              {/* Desktop Table */}
              <div className="hidden md:block overflow-x-auto no-scrollbar">
                 <table className="w-full text-left text-sm text-white/80">
                  <thead className="bg-white/5 text-white/40 uppercase text-[10px] tracking-widest border-b border-white/5">
                    <tr>
                      <th className="p-5 pl-8">Photo</th>
                      <th className="p-5">Name</th>
                      <th className="p-5">Target</th>
                      <th className="p-5">24h Timer</th>
                      <th className="p-5">Status</th>
                      <th className="p-5 text-right pr-8">Actions</th>
                    </tr>
                  </thead>
                  <tbody className="divide-y divide-white/5 font-medium">
                    {players.map(p => (
                      <tr key={p.id} className="hover:bg-white/5 transition-colors">
                        <td className="p-4 pl-8">
                          <label className="cursor-pointer inline-flex items-center gap-3 group relative">
                            <PlayerAvatar player={p} size={44} />
                            <div className="absolute inset-0 bg-black/50 rounded-full flex items-center justify-center opacity-0 group-hover:opacity-100 transition-opacity">
                              <Upload size={16} className="text-white" />
                            </div>
                            <input type="file" accept="image/*" className="hidden" onChange={(e) => handlePhotoChange(p.id, e.target.files[0])} />
                          </label>
                        </td>
                        <td className="p-4">
                          <div className="font-bold text-white">{p.name} {p.hasGoldenDart && <span className="ml-2 text-white" title="Has Golden Dart">★</span>}</div>
                          <div className="text-[10px] text-white/40 mt-1">{p.studentId} • {p.house}</div>
                        </td>
                        <td className="p-4 text-white/50">{players.find(t => t.id === p.targetId)?.name || 'None'}</td>
                        <td className="p-4"><TimerReadout player={p} now={now} /></td>
                        <td className="p-4">
                          {p.status === 'alive' ? <span className="text-emerald-400 text-[10px] font-bold bg-emerald-500/10 px-3 py-1.5 rounded-full uppercase tracking-wider">ALIVE</span> : <span className="text-red-400 text-[10px] font-bold bg-red-500/10 px-3 py-1.5 rounded-full uppercase tracking-wider">ELIMINATED</span>}
                        </td>
                        <td className="p-4 text-right pr-8">
                          <div className="flex items-center justify-end gap-2">
                            {p.status === 'alive' && (
                              <Button variant="danger" className="!py-2 !px-3 text-xs" onClick={() => setEliminatingPlayerId(p.id)}>Eliminate</Button>
                            )}
                            <Button variant="secondary" className="!py-2 !px-4 text-xs inline-flex" onClick={() => setManagingPlayerId(p.id)}>Manage</Button>
                          </div>
                        </td>
                      </tr>
                    ))}
                  </tbody>
                </table>
              </div>

              {/* Mobile Stacked List */}
              <div className="md:hidden divide-y divide-white/5">
                {players.map(p => (
                  <div key={p.id} className="p-4 flex items-center gap-3">
                    <label className="cursor-pointer relative shrink-0">
                      <PlayerAvatar player={p} size={48} />
                      <input type="file" accept="image/*" className="hidden" onChange={(e) => handlePhotoChange(p.id, e.target.files[0])} />
                    </label>
                    <div className="flex-1 min-w-0">
                       <div className="font-bold text-white text-sm truncate">{p.name} {p.hasGoldenDart && <span>★</span>}</div>
                       <div className="text-[10px] text-white/50 mt-0.5 truncate">Target: {players.find(t => t.id === p.targetId)?.name || 'None'}</div>
                       <TimerReadout player={p} now={now} className="mt-1.5" />
                    </div>
                    <div className="flex flex-col items-end gap-1.5 shrink-0">
                      {p.status === 'alive' && (
                        <Button variant="danger" className="!py-1.5 !px-2.5 text-[10px]" onClick={() => setEliminatingPlayerId(p.id)}>Eliminate</Button>
                      )}
                      <Button variant="secondary" className="!py-1.5 !px-3 text-[10px]" onClick={() => setManagingPlayerId(p.id)}>Manage</Button>
                    </div>
                  </div>
                ))}
              </div>
            </div>
          )}

          {/* Manage Player Modal */}
          <Modal isOpen={!!managingPlayerId} onClose={() => { setManagingPlayerId(null); setIsDeletingPlayer(false); }} title={`Manage: ${managingPlayer?.name}`}>
            {managingPlayer && (
              <div className="space-y-6">
                <div className="flex items-center gap-4 bg-white/5 p-4 rounded-2xl border border-white/10">
                  <PlayerAvatar player={managingPlayer} size={56} />
                  <div>
                    <div className="font-bold text-white">{managingPlayer.name}</div>
                    <div className="text-xs text-white/50">{managingPlayer.house} • {managingPlayer.status.toUpperCase()}</div>
                  </div>
                </div>

                {isDeletingPlayer ? (
                  <div className="bg-red-500/10 border border-red-500/20 p-5 rounded-3xl space-y-4">
                    <p className="text-sm text-red-200/80 font-medium">Permanently remove this player? Their target will be seamlessly passed to whoever is hunting them to maintain the chain.</p>
                    <div className="flex gap-2">
                      <Button variant="secondary" className="flex-1 !py-3" onClick={() => setIsDeletingPlayer(false)}>Cancel</Button>
                      <Button variant="danger" className="flex-1 !py-3" onClick={() => { onRemovePlayer(managingPlayer.id); setManagingPlayerId(null); setIsDeletingPlayer(false); }}>Remove</Button>
                    </div>
                  </div>
                ) : (
                  <div className="space-y-4">
                    <div className="space-y-2">
                      <label className="text-xs font-bold text-white/40 uppercase tracking-widest ml-1">Override Target</label>
                      <select 
                        className="control-input !rounded-2xl appearance-none"
                        value={managingPlayer.targetId || ""}
                        onChange={(e) => onUpdateTarget(managingPlayer.id, e.target.value)}
                      >
                        <option value="">-- No Target --</option>
                        {players.filter(p => p.id !== managingPlayer.id).map(p => (
                          <option key={p.id} value={p.id}>{p.name} ({p.status})</option>
                        ))}
                      </select>
                      <p className="text-[10px] text-white/30 ml-1">Note: They'll need to tap Acquire Target again - their 24h window starts fresh from that moment, not from now.</p>
                    </div>

                    <div className="grid grid-cols-2 gap-3 pt-4 border-t border-white/10">
                      {managingPlayer.status === 'eliminated' ? (
                        <Button variant="secondary" className="!py-3 text-xs" onClick={() => { onRevivePlayer(managingPlayer.id); setManagingPlayerId(null); }}>
                          <HeartPulse size={14}/> Revive Player
                        </Button>
                      ) : (
                        <Button variant="secondary" className="!py-3 text-xs opacity-50 cursor-not-allowed">
                          Already Alive
                        </Button>
                      )}

                      {managingPlayer.hasGoldenDart ? (
                        <Button variant="secondary" className="!py-3 text-xs" onClick={() => onRemoveGoldenDart(managingPlayer.id)}>
                          <Trash2 size={14}/> Remove Dart
                        </Button>
                      ) : (
                        <Button variant="secondary" className="!py-3 text-xs" onClick={() => onGoldenDart(managingPlayer.id)}>
                          <Star size={14}/> Give Dart
                        </Button>
                      )}
                    </div>

                    <div className="pt-2">
                      <Button variant="secondary" className="w-full !py-3 text-xs !text-red-400 hover:!bg-red-500/10 border-red-500/20" onClick={() => setIsDeletingPlayer(true)}>
                        <UserMinus size={14}/> Permanently Remove
                      </Button>
                    </div>
                  </div>
                )}
              </div>
            )}
          </Modal>

          {/* Manual Eliminate Confirmation Modal */}
          <Modal isOpen={!!eliminatingPlayerId} onClose={() => setEliminatingPlayerId(null)} title="Confirm Elimination">
            {eliminatingPlayer && (
              <div className="space-y-6">
                <div className="bg-red-500/10 border border-red-500/20 p-5 rounded-3xl flex gap-4">
                  <AlertCircle className="text-red-500 shrink-0 mt-0.5" />
                  <p className="text-sm text-red-200/80 font-medium leading-relaxed">
                    Manually eliminate <strong className="text-white">{eliminatingPlayer.name}</strong>? Whoever is hunting them inherits their target to keep the chain going. No eliminations or house points are credited.
                  </p>
                </div>
                <div className="flex gap-3 pt-2">
                  <Button variant="secondary" className="flex-1" onClick={() => setEliminatingPlayerId(null)}>Cancel</Button>
                  <Button variant="danger" className="flex-1" onClick={() => { onEliminatePlayer(eliminatingPlayer.id); setEliminatingPlayerId(null); }}>Eliminate</Button>
                </div>
              </div>
            )}
          </Modal>

        </div>
      );
    };

    const App = () => {
      const [activeTab, setActiveTab] = useState('dashboard');
      const [players, setPlayers] = useState([]);
      const [houses, setHouses] = useState(DEFAULT_HOUSES);
      const [loggedInStudentId, setLoggedInStudentId] = useState(() => localStorage.getItem(PLAYER_LOGIN_KEY) || null);
      const [gameActive, setGameActive] = useState(false);
      const [isAdminAuthenticated, setIsAdminAuthenticated] = useState(false);

      const currentUser = players.find(p => p.studentId && p.studentId === loggedInStudentId) || null;

      useEffect(() => {
        let cancelled = false;
        const loadAll = async () => {
          const [h, p, g] = await Promise.all([fetchHouses(), fetchPlayers(), fetchGameActive()]);
          if (cancelled) return;
          const nextHouses = h.length ? h : DEFAULT_HOUSES;
          // Bail out of re-rendering the whole tree every 5s when polling turns up no real change
          setHouses(prev => JSON.stringify(prev) === JSON.stringify(nextHouses) ? prev : nextHouses);
          setPlayers(prev => JSON.stringify(prev) === JSON.stringify(p) ? prev : p);
          setGameActive(g);
        };
        loadAll();
        const pollInterval = setInterval(() => { if (!cancelled) loadAll(); }, 5000);
        return () => { cancelled = true; clearInterval(pollInterval); };
      }, []);

      const handleLoadRoster = async (newPlayers, houseNames) => {
        await supabase.from('players').delete().neq('id', 0);
        await supabase.from('houses').delete().neq('id', 0);
        await supabase.from('houses').insert(houseNames.map(name => ({ name, points: 0 })));
        await supabase.from('players').insert(newPlayers.map(p => ({
          student_id: p.studentId, name: p.name, house: p.house, status: p.status, eliminations: p.eliminations, has_golden_dart: p.hasGoldenDart
        })));
      };

      const handleSyncTimesheetRoster = async () => {
        try {
          const { players: rosterPlayers } = await fetchTimesheetRoster();
          const discoveredHouses = Array.from(new Set(rosterPlayers.map(p => p.house)));
          await handleLoadRoster(rosterPlayers, discoveredHouses);
          return { success: true };
        } catch (err) {
          return { success: false };
        }
      };

      // Game State Methods
      const startGame = async () => {
        if (players.length < 2) return;
        const shuffled = [...players].sort(() => Math.random() - 0.5);
        const now = new Date().toISOString();

        await Promise.all(shuffled.map((player, index) =>
          supabase.from('players').update({
            status: 'alive', target_id: shuffled[(index + 1) % shuffled.length].id, eliminations: 0, target_assigned_at: now, target_acquired_at: null
          }).eq('id', player.id)
        ));
        await supabase.from('houses').update({ points: 0 }).neq('id', 0);
        await supabase.from('game_state').update({ active: true }).eq('id', 1);
      };

      const endGame = async () => await supabase.from('game_state').update({ active: false }).eq('id', 1);

      const resetGame = async () => {
        await supabase.from('game_state').update({ active: false }).eq('id', 1);
        await supabase.from('houses').update({ points: 0 }).neq('id', 0);
        await supabase.from('players').update({ status: 'alive', target_id: null, eliminations: 0, has_golden_dart: false, target_assigned_at: null, target_acquired_at: null }).neq('id', 0);
        await supabase.from('taunts').delete().neq('id', 0);
      };

      const handleElimination = async (eliminatorId, targetId) => {
        const eliminator = players.find(p => p.id === eliminatorId);
        const target = players.find(p => p.id === targetId);
        if (!eliminator || !target || target.status !== 'alive') return;
        const now = new Date().toISOString();

        await supabase.from('players').update({ target_id: target.targetId, eliminations: eliminator.eliminations + 1, target_assigned_at: now, target_acquired_at: null }).eq('id', eliminator.id);
        await supabase.from('players').update({ status: 'eliminated', target_id: null }).eq('id', target.id);
        const house = houses.find(h => h.name === eliminator.house);
        if (house) await supabase.from('houses').update({ points: house.points + 10 }).eq('id', house.id);
      };

      const handleGoldenDart = async (playerId) => await supabase.from('players').update({ has_golden_dart: true }).eq('id', playerId);
      const handleRemoveGoldenDart = async (playerId) => await supabase.from('players').update({ has_golden_dart: false }).eq('id', playerId);

      const handleUpdateTarget = async (playerId, newTargetId) => {
        const now = new Date().toISOString();
        await supabase.from('players').update({ target_id: newTargetId, target_assigned_at: now, target_acquired_at: null }).eq('id', playerId);
      };

      const stitchRevivedPlayer = async (revivedPlayerId, currentPlayers, dartOwnerId = null) => {
        const alivePlayers = currentPlayers.filter(p => p.status === 'alive' && p.id !== revivedPlayerId);
        if (alivePlayers.length === 0) return currentPlayers;

        let hunter = dartOwnerId && dartOwnerId !== revivedPlayerId ? alivePlayers.find(p => p.id === dartOwnerId) : alivePlayers[Math.floor(Math.random() * alivePlayers.length)];
        if (!hunter) hunter = alivePlayers[0];

        const newTargetForRevived = hunter.targetId;
        const nowStr = new Date().toISOString();

        await supabase.from('players').update({ status: 'alive', target_id: newTargetForRevived, target_assigned_at: nowStr, target_acquired_at: null }).eq('id', revivedPlayerId);
        await supabase.from('players').update({ target_id: revivedPlayerId, target_assigned_at: nowStr, target_acquired_at: null }).eq('id', hunter.id);

        return currentPlayers.map(p => {
            if (p.id === revivedPlayerId) return { ...p, status: 'alive', targetId: newTargetForRevived, targetAssignedAt: nowStr, targetAcquiredAt: null };
            if (p.id === hunter.id) return { ...p, targetId: revivedPlayerId, targetAssignedAt: nowStr, targetAcquiredAt: null };
            return p;
        });
      };

      const handleRevivePlayer = async (playerId) => await stitchRevivedPlayer(playerId, players);
      
      const handleUseGoldenDart = async (ownerId, reviveeId) => {
        await supabase.from('players').update({ has_golden_dart: false }).eq('id', ownerId);
        let currentPlayers = players.map(p => p.id === ownerId ? { ...p, hasGoldenDart: false } : p);
        currentPlayers = await stitchRevivedPlayer(reviveeId, currentPlayers, ownerId);
        setPlayers(currentPlayers);
      };

      const handleAcquireTarget = async (playerId) => {
        const now = new Date().toISOString();
        await supabase.from('players').update({ target_acquired_at: now }).eq('id', playerId);
        setPlayers(prev => prev.map(p => p.id === playerId ? { ...p, targetAcquiredAt: now } : p));
      };

      const handleRemovePlayer = async (playerId) => {
        const playerToRemove = players.find(p => p.id === playerId);
        if (!playerToRemove) return;
        if (playerToRemove.status === 'alive') {
            const hunter = players.find(p => p.targetId === playerId);
            if (hunter) await supabase.from('players').update({ target_id: playerToRemove.targetId, target_assigned_at: new Date().toISOString(), target_acquired_at: null }).eq('id', hunter.id);
        }
        await supabase.from('players').delete().eq('id', playerId);
      };

      const handleAdminEliminate = async (playerId) => {
        const player = players.find(p => p.id === playerId);
        if (!player || player.status !== 'alive') return;
        const hunter = players.find(p => p.targetId === playerId);
        const now = new Date().toISOString();
        if (hunter) {
          await supabase.from('players').update({ target_id: player.targetId, target_assigned_at: now, target_acquired_at: null }).eq('id', hunter.id);
        }
        await supabase.from('players').update({ status: 'eliminated', target_id: null }).eq('id', playerId);
      };

      const handleSweepExpired = async () => {
          const now = new Date();
          const expired = players.filter(p => {
              if (p.status !== 'alive' || !p.targetAcquiredAt) return false;
              return (now - new Date(p.targetAcquiredAt)) > 24 * 60 * 60 * 1000;
          });
          if (expired.length === 0) return;
          let currentPlayers = [...players];
          for (const player of expired) {
              const hunter = currentPlayers.find(p => p.targetId === player.id);
              if (hunter) {
                  await supabase.from('players').update({ target_id: player.targetId, target_assigned_at: new Date().toISOString(), target_acquired_at: null }).eq('id', hunter.id);
                  currentPlayers = currentPlayers.map(p => p.id === hunter.id ? { ...p, targetId: player.targetId, targetAssignedAt: new Date().toISOString(), targetAcquiredAt: null } : p);
              }
              await supabase.from('players').update({ status: 'eliminated', target_id: null }).eq('id', player.id);
              currentPlayers = currentPlayers.map(p => p.id === player.id ? { ...p, status: 'eliminated', targetId: null } : p);
          }
          setPlayers(currentPlayers);
      };

      const handlePlayerLogin = async (studentId) => {
        const match = players.find(p => p.studentId && p.studentId.toString().trim() === studentId);
        if (!match) return { success: false, message: 'ID not found. See staff.' };
        localStorage.setItem(PLAYER_LOGIN_KEY, studentId);
        setLoggedInStudentId(studentId);
        return { success: true };
      };

      const handlePlayerLogout = () => { localStorage.removeItem(PLAYER_LOGIN_KEY); setLoggedInStudentId(null); };

      const handlePhotoUpload = async (playerId, file) => {
        const ext = (file.name.split('.').pop() || 'jpg').toLowerCase();
        const path = `${playerId}-${Date.now()}.${ext}`;
        const { error: uploadError } = await supabase.storage.from('player-photos').upload(path, file, { upsert: true, contentType: file.type });
        if (uploadError) return { success: false };
        const { data } = supabase.storage.from('player-photos').getPublicUrl(path);
        await supabase.from('players').update({ photo_url: data.publicUrl }).eq('id', playerId);
        return { success: true };
      };

      const renderTabContent = () => {
        switch (activeTab) {
          case 'dashboard': return <DashboardView currentUser={currentUser} players={players} onEliminate={handleElimination} onUseGoldenDart={handleUseGoldenDart} onAcquireTarget={handleAcquireTarget} onLogout={handlePlayerLogout} />;
          case 'leaderboard': return <LeaderboardView houses={houses} players={players} />;
          case 'rules': return <RulesView />;
          case 'admin': return isAdminAuthenticated ? (
              <AdminView players={players} houses={houses} gameActive={gameActive} onLoadRoster={handleLoadRoster} onSyncRoster={handleSyncTimesheetRoster} onStartGame={startGame} onEndGame={endGame} onResetGame={resetGame} onGoldenDart={handleGoldenDart} onRemoveGoldenDart={handleRemoveGoldenDart} onPhotoUpload={handlePhotoUpload} onUpdateTarget={handleUpdateTarget} onRevivePlayer={handleRevivePlayer} onRemovePlayer={handleRemovePlayer} onEliminatePlayer={handleAdminEliminate} onSweepExpired={handleSweepExpired} />
            ) : <AdminLogin onLogin={() => setIsAdminAuthenticated(true)} />;
          default: return null;
        }
      };

      if (!currentUser && activeTab === 'dashboard') {
          return (
             <div className="h-[100dvh] relative overflow-hidden z-10 flex flex-col">
                 <PlayerLogin onLogin={handlePlayerLogin} onAdminClick={() => setActiveTab('admin')} />
             </div>
          );
      }

      return (
        <div className="font-sans relative overflow-x-hidden flex flex-col" style={{ height: '100dvh', minHeight: '100dvh' }}>
          <main className="max-w-6xl mx-auto w-full px-3 pt-4 pb-2 sm:px-4 sm:pt-6 sm:pb-8 relative z-10 flex-1 min-h-0 overflow-y-auto flex flex-col">
            {renderTabContent()}
          </main>

          {/* Pill Navigation - part of the layout flow, so it can never overlap page content */}
          <nav
            className="shrink-0 z-50 flex justify-center px-4 pt-3"
            style={{ paddingBottom: 'calc(1.5rem + env(safe-area-inset-bottom))' }}
          >
            <div className="bg-black/80 backdrop-blur-3xl border border-white/10 p-1.5 md:p-2 rounded-full flex shadow-[0_20px_40px_rgba(0,0,0,0.8)] max-w-full overflow-x-auto no-scrollbar">
              {[
                { id: 'dashboard', label: 'Target', icon: Crosshair },
                { id: 'leaderboard', label: 'Standings', icon: Trophy },
                { id: 'rules', label: 'Rules', icon: ShieldAlert },
                { id: 'admin', label: 'Admin', icon: Settings, desktopOnly: true }
              ].map(tab => (
                <button
                  key={tab.id}
                  onClick={() => setActiveTab(tab.id)}
                  className={`items-center gap-1.5 md:gap-2 px-3 md:px-6 py-3 md:py-3.5 font-bold transition-all rounded-full whitespace-nowrap ${tab.desktopOnly ? 'hidden md:flex' : 'flex'} ${
                    activeTab === tab.id
                      ? 'bg-white text-black shadow-lg scale-[1.02]'
                      : 'text-white/80 hover:text-white hover:bg-white/10'
                  }`}
                >
                  <tab.icon size={18} className="shrink-0" />
                  <span className="text-[11px] md:text-sm tracking-wide block">{tab.label}</span>
                </button>
              ))}
            </div>
          </nav>
        </div>
      );
    };

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
