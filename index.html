<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>GOTCHA App</title>

  <!-- Fix for missing favicon 404 error -->
  <link rel="icon" href="data:," />

  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- React & ReactDOM -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>

  <!-- Babel for JSX -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>

  <!-- Supabase -->
  <script src="https://unpkg.com/@supabase/supabase-js@2"></script>

  <!-- Google Fonts: Inter -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">

  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: { sans: ['Inter', 'sans-serif'] },
          colors: {
            night: {
              950: '#020617',
              900: '#0f172a',
              800: '#1e293b'
            }
          }
        }
      }
    }
  </script>

  <style>
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

    body {
      margin: 0;
      font-family: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: #020617;
      color: #e2e8f0;
      -webkit-font-smoothing: antialiased;
    }

    /* Hide scrollbar for Chrome, Safari and Opera */
    .no-scrollbar::-webkit-scrollbar {
      display: none;
    }
    /* Hide scrollbar for IE, Edge and Firefox */
    .no-scrollbar {
      -ms-overflow-style: none;  /* IE and Edge */
      scrollbar-width: none;  /* Firefox */
    }

    /* Custom scrollbar */
    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-track { background: rgba(15,23,42,0.5); }
    ::-webkit-scrollbar-thumb { background: rgba(167,139,250,0.3); border-radius: 10px; }
    ::-webkit-scrollbar-thumb:hover { background: rgba(167,139,250,0.6); }

    /* NIGHT GLASS IMAGE BACKGROUND */
    .night-bg {
        position: fixed;
        inset: 0;
        width: 100vw;
        height: 100vh;
        background-image: url('https://i.imgur.com/J3ZEdiB.png');
        background-size: cover;
        background-position: center;
        z-index: -2;
        background-color: #020617;
    }

    /* Vignette effect */
    .night-overlay {
        position: fixed;
        inset: 0;
        background: radial-gradient(circle at center, transparent 0%, #020617 150%);
        opacity: 0.9;
        z-index: -1;
        pointer-events: none;
    }

    /* NIGHT GLASS CARDS */
    .night-glass-card {
        background: rgba(15, 23, 42, 0.45);
        backdrop-filter: blur(30px);
        -webkit-backdrop-filter: blur(30px);
        border: 1px solid rgba(167, 139, 250, 0.3);
        box-shadow: 0 50px 100px rgba(0, 0, 0, 0.65), 0 0 80px rgba(124, 58, 237, 0.25);
    }

    .night-glass-card-subtle {
        background: rgba(15, 23, 42, 0.6);
        backdrop-filter: blur(15px);
        -webkit-backdrop-filter: blur(15px);
        border: 1px solid rgba(167, 139, 250, 0.25);
    }

    /* LOGO RADIAL GLOW & FLOAT EFFECT */
    .logo-box {
        position: relative;
        display: flex;
        justify-content: center;
        align-items: center;
    }

    .logo-box::before {
        content: "";
        position: absolute;
        width: 150px;
        height: 150px;
        border-radius: 50%;
        background: radial-gradient(circle, rgba(168, 85, 247, 0.65), rgba(99, 102, 241, 0.45), rgba(37, 99, 235, 0.2), transparent 75%);
        filter: blur(28px);
        animation: logoGlowPulse 4s infinite ease-in-out;
        pointer-events: none;
    }

    @keyframes logoGlowPulse {
        0%, 100% { transform: scale(1); opacity: 0.8; }
        50% { transform: scale(1.22); opacity: 1; }
    }

    /* NIGHT GLASS BUTTONS */
    .night-btn-primary {
        background: linear-gradient(135deg, #a855f7, #6366f1, #2563eb);
        color: white;
        box-shadow: 0 15px 35px rgba(99, 102, 241, 0.45);
        transition: all 0.3s ease;
    }

    .night-btn-primary:hover {
        transform: translateY(-2px);
        box-shadow: 0 20px 45px rgba(99, 102, 241, 0.65);
    }

    .night-btn-link {
        background: rgba(15, 23, 42, 0.6);
        backdrop-filter: blur(12px);
        -webkit-backdrop-filter: blur(12px);
        border: 1px solid rgba(167, 139, 250, 0.3);
        transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .night-btn-link:hover {
        background: rgba(30, 41, 59, 0.8);
        border-color: rgba(168, 85, 247, 0.7);
        transform: translateY(-3px);
        box-shadow: 0 12px 30px rgba(124, 58, 237, 0.35);
    }

    /* INPUT STYLES */
    .control-input {
        width: 100%;
        background: rgba(15, 23, 42, 0.65);
        border: 1px solid rgba(167, 139, 250, 0.45);
        color: #ffffff;
        border-radius: 1rem;
        padding: 0.85rem 1.1rem;
        outline: none;
        transition: all 0.3s ease;
        font-size: 0.925rem;
    }

    .control-input::placeholder { color: rgba(255, 255, 255, 0.5); }

    .control-input:focus {
        border-color: #60a5fa;
        background: rgba(15, 23, 42, 0.85);
        box-shadow: 0 0 25px rgba(96, 165, 250, 0.4);
        transform: translateY(-1px);
    }

    .control-input.border-red-500, .control-input.border-red-500:focus {
        border-color: #f87171;
    }
  </style>
</head>
<body class="text-white min-h-screen w-full relative overflow-x-hidden selection:bg-purple-500/30 antialiased">
  <!-- Fullscreen Background Image -->
  <div class="night-bg"></div>
  <div class="night-overlay"></div>

  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useMemo } = React;

    // --- Supabase ---
    // Only the publishable (anon) key belongs here: this page is a static,
    // publicly-served file with no backend, so anything embedded in it is
    // visible to anyone. Table access is governed by RLS policies instead.
    const SUPABASE_URL = 'https://nmmshjdknmuzpgpquwec.supabase.co';
    const SUPABASE_ANON_KEY = 'sb_publishable_PCxlxywY7W6K3TmMrSnSsw_NPXKugoZ';
    const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    const PLAYER_LOGIN_KEY = 'gotcha_student_id';

    const fetchHouses = async () => {
      const { data, error } = await supabase.from('houses').select('*').order('name');
      if (error) { console.error('fetchHouses', error); return []; }
      return data.map(h => ({ id: h.id, name: h.name, points: h.points }));
    };

    const fetchPlayers = async () => {
      const { data, error } = await supabase.from('players').select('*').order('name');
      if (error) { console.error('fetchPlayers', error); return []; }
      return data.map(p => ({
        id: p.id,
        name: p.name,
        house: p.house,
        status: p.status,
        targetId: p.target_id,
        eliminations: p.eliminations,
        hasGoldenDart: p.has_golden_dart,
        studentId: p.student_id,
        photoUrl: p.photo_url
      }));
    };

    const fetchGameActive = async () => {
      const { data, error } = await supabase.from('game_state').select('active').eq('id', 1).maybeSingle();
      if (error) { console.error('fetchGameActive', error); return false; }
      return data ? data.active : false;
    };

    const fetchTimesheetRoster = async () => {
      const { data: settingRow, error: settingsError } = await supabase
        .from('settings')
        .select('value')
        .eq('key', 'ActiveYear')
        .maybeSingle();
      if (settingsError) throw new Error(settingsError.message);
      const activeYear = settingRow && settingRow.value;
      if (!activeYear) throw new Error('Could not find an active academic year in the timesheet settings.');

      const { data: rosterRows, error: rosterError } = await supabase
        .from('roster')
        .select('student_id, name, team')
        .eq('academic_year', activeYear)
        .order('name');
      if (rosterError) throw new Error(rosterError.message);
      if (!rosterRows || rosterRows.length === 0) {
        throw new Error(`No students found on the ${activeYear} timesheet roster.`);
      }

      return {
        activeYear,
        players: rosterRows.map(r => ({
          studentId: r.student_id,
          name: r.name,
          house: r.team,
          status: 'alive',
          eliminations: 0,
          hasGoldenDart: false
        }))
      };
    };

    const IconWrapper = ({ name, size = 24, className = '', color = 'currentColor' }) => {
      const iconRef = React.useRef(null);

      React.useEffect(() => {
        if (iconRef.current && window.lucide) {
           window.lucide.createIcons({
             icons: { [name]: window.lucide.icons[name] },
             nameAttr: 'data-lucide',
             attrs: {
               class: className,
               width: size,
               height: size,
               stroke: color
             }
           });
        }
      }, [name, size, className, color]);

      return <i ref={iconRef} data-lucide={name} className={className} style={{ width: size, height: size }}></i>;
    };

    const Crosshair = (props) => <IconWrapper name="crosshair" {...props} />;
    const ShieldAlert = (props) => <IconWrapper name="shield-alert" {...props} />;
    const Trophy = (props) => <IconWrapper name="trophy" {...props} />;
    const Users = (props) => <IconWrapper name="users" {...props} />;
    const Settings = (props) => <IconWrapper name="settings" {...props} />;
    const User = (props) => <IconWrapper name="user" {...props} />;
    const Clock = (props) => <IconWrapper name="clock" {...props} />;
    const AlertCircle = (props) => <IconWrapper name="alert-circle" {...props} />;
    const Target = (props) => <IconWrapper name="target" {...props} />;
    const Camera = (props) => <IconWrapper name="camera" {...props} />;
    const Star = (props) => <IconWrapper name="star" {...props} />;
    const Upload = (props) => <IconWrapper name="upload" {...props} />;
    const LogOut = (props) => <IconWrapper name="log-out" {...props} />;
    const RefreshCw = (props) => <IconWrapper name="refresh-cw" {...props} />;
    const Trash2 = (props) => <IconWrapper name="trash-2" {...props} />;

    const DEFAULT_HOUSES = [
      { id: 'H1', name: 'Gryffindor', points: 0 },
      { id: 'H2', name: 'Slytherin', points: 0 },
      { id: 'H3', name: 'Ravenclaw', points: 0 },
      { id: 'H4', name: 'Hufflepuff', points: 0 }
    ];

    const Button = ({ children, onClick, variant = 'primary', className = '', disabled = false, type = 'button' }) => {
      const baseStyle = "px-4 py-3 rounded-xl font-bold transition-all duration-300 flex items-center justify-center gap-2";
      const variants = {
        primary: "night-btn-primary",
        secondary: "night-btn-link text-white",
        danger: "bg-gradient-to-r from-rose-600 to-red-600 hover:from-rose-500 hover:to-red-500 text-white shadow-[0_0_15px_rgba(225,29,72,0.4)]",
        outline: "border-2 border-purple-400/50 text-purple-300 hover:bg-purple-500/20"
      };

      return (
        <button
          type={type}
          onClick={onClick}
          disabled={disabled}
          className={`${baseStyle} ${variants[variant]} ${disabled ? 'opacity-50 cursor-not-allowed shadow-none' : 'active:scale-95'} ${className}`}
        >
          {children}
        </button>
      );
    };

    const Modal = ({ isOpen, onClose, title, children }) => {
      if (!isOpen) return null;
      return (
        <div className="fixed inset-0 bg-black/75 flex items-center justify-center p-4 z-[60] backdrop-blur-md">
          <div className="night-glass-card rounded-[28px] w-full max-w-md overflow-hidden shadow-2xl border-purple-400/40">
            <div className="p-5 border-b border-purple-500/20 flex justify-between items-center bg-slate-900/40">
              <h3 className="font-bold text-lg text-white">{title}</h3>
              <button onClick={onClose} className="text-purple-200 hover:text-white transition-colors bg-slate-900/50 border border-purple-400/30 w-8 h-8 rounded-full flex items-center justify-center">&times;</button>
            </div>
            <div className="p-6">
              {children}
            </div>
          </div>
        </div>
      );
    };

    const PlayerAvatar = ({ player, size = 96 }) => {
      if (player && player.photoUrl) {
        return (
          <img
            src={player.photoUrl}
            alt={player.name}
            className="rounded-full object-cover border-4 border-purple-400/20 shadow-[0_0_20px_rgba(0,0,0,0.5)]"
            style={{ width: size, height: size }}
          />
        );
      }
      return (
        <div className="bg-slate-900/60 rounded-full flex items-center justify-center border-4 border-purple-400/20 shadow-[0_0_20px_rgba(0,0,0,0.5)]" style={{ width: size, height: size }}>
          <User size={Math.round(size * 0.42)} className="text-slate-400" />
        </div>
      );
    };

    const AdminLogin = ({ onLogin }) => {
      const [password, setPassword] = useState('');
      const [error, setError] = useState(false);

      const handleSubmit = (e) => {
        e.preventDefault();
        if (password === 'Staff49!') {
          onLogin();
        } else {
          setError(true);
          setPassword('');
        }
      };

      return (
        <div className="flex flex-col items-center justify-center py-12 px-4">
          <div className="night-glass-card border-purple-400/40 p-8 rounded-[36px] w-full max-w-sm shadow-2xl relative overflow-hidden text-center">
            <div className="logo-box mb-6 justify-center">
              <div className="w-16 h-16 rounded-2xl bg-slate-900/50 border border-purple-400/30 flex items-center justify-center relative z-10 shadow-lg">
                <ShieldAlert size={30} className="text-purple-300" />
              </div>
            </div>
            <h2 className="text-2xl font-black text-white text-center mb-2 tracking-tight">Admin Access</h2>
            <p className="text-purple-200/70 text-sm text-center mb-8">Enter the staff password to manage the game.</p>

            <form onSubmit={handleSubmit} className="space-y-4">
              <div>
                <input
                  type="password"
                  value={password}
                  onChange={(e) => { setPassword(e.target.value); setError(false); }}
                  placeholder="Enter Password"
                  className={`control-input ${error ? 'border-red-500' : ''} !text-center font-mono`}
                  autoFocus
                />
                {error && <p className="text-red-400 text-xs mt-2 text-center font-bold">Incorrect password.</p>}
              </div>
              <Button type="submit" variant="primary" className="w-full py-4 text-lg mt-2">Authenticate</Button>
            </form>
          </div>
        </div>
      );
    };

    const PlayerLogin = ({ onLogin }) => {
      const [studentId, setStudentId] = useState('');
      const [error, setError] = useState('');
      const [busy, setBusy] = useState(false);

      const handleSubmit = async (e) => {
        e.preventDefault();
        if (!studentId.trim()) return;
        setBusy(true);
        setError('');
        const result = await onLogin(studentId.trim());
        setBusy(false);
        if (!result.success) {
          setError(result.message);
          setStudentId('');
        }
      };

      return (
        <div className="flex flex-col items-center justify-center py-12 px-4">
          <div className="night-glass-card border-purple-400/40 p-8 rounded-[36px] w-full max-w-sm shadow-2xl relative overflow-hidden text-center">
            <div className="logo-box mb-6 justify-center">
              <div className="w-16 h-16 rounded-2xl bg-slate-900/50 border border-purple-400/30 flex items-center justify-center relative z-10 shadow-lg">
                <Crosshair size={30} className="text-purple-300" />
              </div>
            </div>
            <h2 className="text-2xl font-black text-white text-center mb-2 tracking-tight">Enter the Hunt</h2>
            <p className="text-purple-200/70 text-sm text-center mb-8">Enter your Student ID to start the game and see your target.</p>

            <form onSubmit={handleSubmit} className="space-y-4">
              <div>
                <input
                  type="text"
                  inputMode="numeric"
                  value={studentId}
                  onChange={(e) => { setStudentId(e.target.value); setError(''); }}
                  placeholder="Student ID"
                  className={`control-input ${error ? 'border-red-500' : ''} !text-center font-mono`}
                  autoFocus
                />
                {error && <p className="text-red-400 text-xs mt-2 text-center font-bold">{error}</p>}
              </div>
              <Button type="submit" variant="primary" className="w-full py-4 text-lg mt-2" disabled={busy}>
                {busy ? 'Checking...' : 'Continue'}
              </Button>
            </form>
          </div>
        </div>
      );
    };

    const DashboardView = ({ currentUser, players, onEliminate, onLogin, onLogout }) => {
      const [isModalOpen, setIsModalOpen] = useState(false);
      const [isRevealing, setIsRevealing] = useState(false);
      const [scrambleName, setScrambleName] = useState("");

      const target = useMemo(() => players.find(p => p.id === currentUser?.targetId), [players, currentUser]);

      // Target decryption animation logic
      useEffect(() => {
        if (!currentUser) return;
        const key = `target_seen_${currentUser.id}_${currentUser.targetId}`;
        
        // If they have a target, and we haven't logged that they've seen THIS specific target yet
        if (currentUser.targetId && !localStorage.getItem(key)) {
          setIsRevealing(true);
          let iteration = 0;
          const maxIterations = 25; // number of cycles
          const nameToScramble = target?.name || "ACQUIRING...";

          const interval = setInterval(() => {
            const chars = "ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789@#$%&*";
            setScrambleName(nameToScramble.split("").map((c, i) => {
              if (c === " ") return " ";
              // Decode from left to right gradually based on iteration
              const threshold = (i / nameToScramble.length) * maxIterations;
              return iteration > threshold ? c : chars[Math.floor(Math.random() * chars.length)];
            }).join(""));

            iteration++;
            if (iteration > maxIterations) {
              clearInterval(interval);
              setIsRevealing(false);
              localStorage.setItem(key, 'true');
            }
          }, 80);
          return () => clearInterval(interval);
        }
      }, [currentUser, target]);

      if (!currentUser) {
        return <PlayerLogin onLogin={onLogin} />;
      }

      return (
        <div className="max-w-3xl mx-auto space-y-6 pb-12">
          {/* Player Identity Card */}
          <div className="night-glass-card rounded-[36px] border-purple-400/40 p-6 flex flex-col md:flex-row items-center justify-between gap-6 relative overflow-hidden shadow-2xl">
            <div className="absolute top-0 left-0 w-full h-1 md:w-2 md:h-full bg-gradient-to-b from-purple-400 to-blue-600"></div>
            <div className="flex flex-col md:flex-row items-center gap-6 z-10 w-full md:w-auto text-center md:text-left">
              <PlayerAvatar player={currentUser} size={96} />
              <div>
                <h1 className="text-3xl font-black text-white tracking-tight">{currentUser.name}</h1>
                <div className="flex flex-wrap justify-center md:justify-start items-center gap-3 mt-3">
                  <span className="bg-slate-900/50 border border-purple-400/20 px-4 py-1.5 rounded-full text-sm font-bold text-purple-200">
                    Team {currentUser.house}
                  </span>
                  {currentUser.status === 'alive' ? (
                    <span className="bg-emerald-500/10 border border-emerald-500/30 text-emerald-400 px-4 py-1.5 rounded-full text-sm font-bold flex items-center gap-1.5">
                      <span className="w-2 h-2 rounded-full bg-emerald-400 animate-pulse"></span> ACTIVE
                    </span>
                  ) : (
                    <span className="bg-rose-500/10 border border-rose-500/30 text-rose-400 px-4 py-1.5 rounded-full text-sm font-bold flex items-center gap-1.5">
                      <AlertCircle size={14} /> ELIMINATED
                    </span>
                  )}
                  <button onClick={onLogout} className="night-btn-link px-3 py-1.5 rounded-full text-xs font-bold text-purple-300/60 hover:text-white flex items-center gap-1.5">
                    <LogOut size={12} /> Not you?
                  </button>
                </div>
              </div>
            </div>

            <div className="text-center md:text-right z-10 night-glass-card-subtle p-4 rounded-2xl border-purple-400/30 w-full md:w-auto shadow-inner">
              <div className="text-xs text-purple-200/70 font-bold uppercase tracking-widest mb-1">Total Eliminations</div>
              <div className="text-5xl font-black text-white drop-shadow-md">{currentUser.eliminations}</div>
            </div>
          </div>

          {currentUser.hasGoldenDart && (
            <div className="bg-gradient-to-r from-yellow-500/20 to-transparent border border-yellow-500/30 p-5 rounded-3xl flex items-center gap-5 shadow-xl backdrop-blur-md">
              <div className="bg-yellow-500/20 text-yellow-400 p-3 rounded-2xl border border-yellow-500/30"><Star size={28} className="text-yellow-400" fill="currentColor" /></div>
              <div>
                <h3 className="text-yellow-400 font-black text-lg">Golden Dart Secured</h3>
                <p className="text-sm text-yellow-100/70 mt-1">You possess a rare Golden Dart. One bonus life is available.</p>
              </div>
            </div>
          )}

          {/* Target Card */}
          {currentUser.status === 'alive' ? (
            <div className="night-glass-card rounded-[36px] border-purple-400/40 p-1 relative overflow-hidden group">
              <div className="absolute inset-0 bg-gradient-to-b from-purple-500/5 to-transparent pointer-events-none"></div>
              <div className="night-glass-card-subtle rounded-[28px] border-purple-400/20 p-8 relative overflow-hidden min-h-[400px] flex flex-col justify-center">
                <div className="absolute right-0 top-0 opacity-[0.03] pointer-events-none group-hover:scale-110 transition-transform duration-700">
                  <Target size={280} className="text-white transform translate-x-1/4 -translate-y-1/4" />
                </div>

                <h2 className="absolute top-8 left-8 text-sm font-bold text-purple-300/80 uppercase tracking-widest flex items-center gap-2">
                  <Crosshair size={18} /> Mission Objective
                </h2>

                {isRevealing ? (
                  <div className="flex flex-col items-center justify-center py-12 relative z-10 w-full mt-6">
                    <div className="absolute inset-0 flex items-center justify-center opacity-10">
                      <Target size={200} className="text-purple-400 animate-ping" />
                    </div>
                    <Crosshair size={72} className="text-purple-400 animate-spin mb-8 relative z-10" />
                    <h3 className="text-3xl md:text-5xl font-black text-white text-center font-mono tracking-[0.15em] relative z-10 drop-shadow-[0_0_15px_rgba(168,85,247,0.8)] px-4 max-w-full break-words">
                      {scrambleName}
                    </h3>
                    <p className="text-purple-400 mt-8 uppercase tracking-[0.3em] text-xs font-bold animate-pulse relative z-10">
                      Decrypting Target Profile...
                    </p>
                  </div>
                ) : target ? (
                  <div className="flex flex-col items-center justify-center py-8 relative z-10 mt-6 animate-in fade-in zoom-in duration-500">

    const App = () => {
      const [activeTab, setActiveTab] = useState('dashboard');
      const [players, setPlayers] = useState([]);
      const [houses, setHouses] = useState(DEFAULT_HOUSES);
      const [loggedInStudentId, setLoggedInStudentId] = useState(() => localStorage.getItem(PLAYER_LOGIN_KEY) || null);
      const [gameActive, setGameActive] = useState(false);
      const [isAdminAuthenticated, setIsAdminAuthenticated] = useState(false);

      const currentUser = players.find(p => p.studentId && p.studentId === loggedInStudentId) || null;

      useEffect(() => {
        let cancelled = false;

        const loadAll = async () => {
          const [h, p, g] = await Promise.all([fetchHouses(), fetchPlayers(), fetchGameActive()]);
          if (cancelled) return;
          setHouses(h.length ? h : DEFAULT_HOUSES);
          setPlayers(p);
          setGameActive(g);
        };
        
        // Initial load
        loadAll();

        // WebSockets are restricted in this preview environment, 
        // so we use HTTP polling (every 5 seconds) as a fallback for realtime updates.
        const pollInterval = setInterval(() => {
          if (!cancelled) {
            loadAll();
          }
        }, 5000);

        return () => {
          cancelled = true;
          clearInterval(pollInterval);
        };
      }, []);

      const handleLoadRoster = async (newPlayers, houseNames) => {
        await supabase.from('players').delete().neq('id', 0);
        await supabase.from('houses').delete().neq('id', 0);
        await supabase.from('houses').insert(houseNames.map(name => ({ name, points: 0 })));
        await supabase.from('players').insert(newPlayers.map(p => ({
          student_id: p.studentId,
          name: p.name,
          house: p.house,
          status: p.status,
          eliminations: p.eliminations,
          has_golden_dart: p.hasGoldenDart
        })));
      };

      const handleSyncTimesheetRoster = async () => {
        try {
          const { activeYear, players: rosterPlayers } = await fetchTimesheetRoster();
          const discoveredHouses = Array.from(new Set(rosterPlayers.map(p => p.house)));
          await handleLoadRoster(rosterPlayers, discoveredHouses);
          return { success: true, count: rosterPlayers.length, houseCount: discoveredHouses.length, activeYear };
        } catch (err) {
          return { success: false, message: err.message };
        }
      };

      // Game State Methods
      const startGame = async () => {
        if (players.length < 2) return;
        const shuffled = [...players].sort(() => Math.random() - 0.5);
        await Promise.all(shuffled.map((player, index) =>
          supabase.from('players').update({
            status: 'alive',
            target_id: shuffled[(index + 1) % shuffled.length].id,
            eliminations: 0
          }).eq('id', player.id)
        ));
        await supabase.from('houses').update({ points: 0 }).neq('id', 0);
        await supabase.from('game_state').update({ active: true }).eq('id', 1);
      };

      const endGame = async () => {
         await supabase.from('game_state').update({ active: false }).eq('id', 1);
      };

      const resetGame = async () => {
        await supabase.from('game_state').update({ active: false }).eq('id', 1);
        await supabase.from('houses').update({ points: 0 }).neq('id', 0);
        await supabase.from('players').update({
          status: 'alive',
          target_id: null,
          eliminations: 0,
          has_golden_dart: false
        }).neq('id', 0);
      };

      const handleElimination = async (eliminatorId, targetId) => {
        const eliminator = players.find(p => p.id === eliminatorId);
        const target = players.find(p => p.id === targetId);
        if (!eliminator || !target || target.status !== 'alive') return;

        await supabase.from('players').update({
          target_id: target.targetId,
          eliminations: eliminator.eliminations + 1
        }).eq('id', eliminator.id);

        await supabase.from('players').update({
          status: 'eliminated',
          target_id: null
        }).eq('id', target.id);

        const house = houses.find(h => h.name === eliminator.house);
        if (house) {
          await supabase.from('houses').update({ points: house.points + 10 }).eq('id', house.id);
        }
      };

      const handleGoldenDart = async (playerId) => {
        await supabase.from('players').update({ has_golden_dart: true }).eq('id', playerId);
      };

      const handleRemoveGoldenDart = async (playerId) => {
        await supabase.from('players').update({ has_golden_dart: false }).eq('id', playerId);
      };

      const handlePlayerLogin = async (studentId) => {
        const match = players.find(p => p.studentId && p.studentId.toString().trim() === studentId);
        if (!match) {
          return { success: false, message: 'Student ID not found. See a staff member if you believe this is an error.' };
        }
        localStorage.setItem(PLAYER_LOGIN_KEY, studentId);
        setLoggedInStudentId(studentId);
        return { success: true };
      };

      const handlePlayerLogout = () => {
        localStorage.removeItem(PLAYER_LOGIN_KEY);
        setLoggedInStudentId(null);
      };

      const handlePhotoUpload = async (playerId, file) => {
        const ext = (file.name.split('.').pop() || 'jpg').toLowerCase();
        const path = `${playerId}-${Date.now()}.${ext}`;
        const { error: uploadError } = await supabase.storage.from('player-photos').upload(path, file, { upsert: true, contentType: file.type });
        if (uploadError) return { success: false, message: uploadError.message };
        const { data } = supabase.storage.from('player-photos').getPublicUrl(path);
        const { error: updateError } = await supabase.from('players').update({ photo_url: data.publicUrl }).eq('id', playerId);
        if (updateError) return { success: false, message: updateError.message };
        return { success: true };
      };

      const renderTabContent = () => {
        switch (activeTab) {
          case 'dashboard':
            return <DashboardView currentUser={currentUser} players={players} onEliminate={handleElimination} onLogin={handlePlayerLogin} onLogout={handlePlayerLogout} />;
          case 'leaderboard':
            return <LeaderboardView houses={houses} players={players} />;
          case 'rules':
            return <RulesView />;
          case 'admin':
            return isAdminAuthenticated ? (
              <AdminView 
                players={players} 
                houses={houses} 
                gameActive={gameActive}
                onLoadRoster={handleLoadRoster} 
                onSyncRoster={handleSyncTimesheetRoster} 
                onStartGame={startGame}
                onEndGame={endGame}
                onResetGame={resetGame}
                onGoldenDart={handleGoldenDart}
                onRemoveGoldenDart={handleRemoveGoldenDart}
                onPhotoUpload={handlePhotoUpload} 
              />
            ) : (
              <AdminLogin onLogin={() => setIsAdminAuthenticated(true)} />
            );
          default:
            return null;
        }
      };

      return (
        <div className="min-h-screen font-sans text-slate-200 relative selection:bg-purple-500/30 overflow-x-hidden">
          <div className="relative z-10 flex flex-col min-h-screen">
            {/* Header - Night Glass */}
            <header className="bg-slate-900/60 backdrop-blur-2xl border-b border-purple-400/25 sticky top-0 z-40">
              <div className="max-w-6xl mx-auto px-4 h-16 md:h-20 flex items-center justify-between">
                <div className="flex items-center gap-3">
                  <div className="logo-box">
                    <img
                      src="https://i.imgur.com/p2qZOL5.png"
                      alt="GOTCHA Logo"
                      className="h-10 w-10 md:h-12 md:w-12 rounded-xl object-contain relative z-10 drop-shadow-[0_0_10px_rgba(168,85,247,0.5)]"
                    />
                  </div>
                  <span className="text-2xl md:text-3xl font-black tracking-tight text-white drop-shadow-md">GOTCHA</span>
                </div>

                {currentUser ? (
                  <div className="flex items-center gap-3 night-glass-card-subtle border-purple-400/30 py-1.5 pl-2 pr-4 rounded-xl shadow-inner">
                    <PlayerAvatar player={currentUser} size={32} />
                    <span className="text-sm font-bold text-white hidden sm:inline">{currentUser.name}</span>
                    <button onClick={handlePlayerLogout} title="Log out" className="text-purple-300/70 hover:text-white transition-colors">
                      <LogOut size={16} />
                    </button>
                  </div>
                ) : (
                  <div className="text-xs font-bold text-purple-300/50 uppercase tracking-widest hidden sm:block">Enter your Student ID on Mission tab</div>
                )}
              </div>
            </header>

            {/* Navigation - Fixed bottom on mobile, sticky top on desktop */}
            <nav className="fixed bottom-0 left-0 right-0 z-50 bg-slate-900/70 backdrop-blur-2xl border-t border-purple-400/25 md:sticky md:top-20 md:bg-slate-900/40 md:border-t-0 md:border-b">
              <div className="max-w-6xl mx-auto flex justify-around md:justify-start px-2 py-2 md:py-0 md:px-4">
                {[
                  { id: 'dashboard', label: 'Mission', icon: User },
                  { id: 'leaderboard', label: 'Standings', icon: Trophy },
                  { id: 'rules', label: 'Rules', icon: ShieldAlert },
                  { id: 'admin', label: 'Admin', icon: Settings }
                ].map(tab => (
                  <button
                    key={tab.id}
                    onClick={() => setActiveTab(tab.id)}
                    className={`flex flex-col md:flex-row items-center justify-center gap-1 md:gap-3 px-3 py-3 md:px-6 md:py-5 font-bold transition-all w-full md:w-auto md:border-b-2 ${
                      activeTab === tab.id
                        ? 'text-purple-300 md:border-purple-400 bg-white/5 md:bg-purple-500/10 rounded-xl md:rounded-none'
                        : 'text-slate-400 hover:text-white border-transparent hover:bg-white/5 rounded-xl md:rounded-none'
                    }`}
                  >
                    <tab.icon size={20} className={activeTab === tab.id ? 'drop-shadow-[0_0_8px_rgba(168,85,247,0.6)]' : ''} />
                    <span className="text-[10px] md:text-sm tracking-wide">{tab.label}</span>
                  </button>
                ))}
              </div>
            </nav>

            {/* Main Content Area - Padding bottom applied for mobile nav */}
            <main className="flex-1 max-w-6xl mx-auto w-full px-4 pt-8 pb-28 md:pb-12 relative z-10">
              {renderTabContent()}
            </main>
          </div>
        </div>
      );
    };

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
